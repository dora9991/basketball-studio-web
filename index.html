      d.querySelector('summary').addEventListener('click', () => { S.openSetup = !d.open; });
      el.append(d);
    } else el.append(...secGoal, ...secRun, ...secRes);
  }

  /* ---------- ゴールの指定（映像の上でドラッグ） ---------- */
  function setOverlayActive(on) { const cv = $('#autoOverlay'); cv.style.pointerEvents = on ? 'auto' : 'none'; cv.style.cursor = on ? 'crosshair' : 'default'; }
  function startMarking(i) {
    S.openSetup = true;
    app.pause();
    S.marking = { i, step: 0, box: null, drag: null };
    setOverlayActive(true);
    render(); drawOverlay();
    const mc = pane() && pane().querySelector('.markcard');
    if (mc && mc.scrollIntoView) mc.scrollIntoView({ block: 'nearest' });
  }
  /* 映像の画素 ⇄ 画面上の位置。ふだんは映像全体（黒帯つき）、リングをなぞるときは拡大表示（mk.view の範囲を画面いっぱいに） */
  function mapping(r) {
    const W = app.media.width, H = app.media.height;
    const mk = S.marking;
    if (mk && mk.view) return { s: r.width / mk.view.w, ox: 0, oy: 0, vx: mk.view.x, vy: mk.view.y };
    const s = Math.min(r.width / W, r.height / H);
    return { s, ox: (r.width - W * s) / 2, oy: (r.height - H * s) / 2, vx: 0, vy: 0 };
  }
  function toSrc(ev) {
    const r = $('#autoOverlay').getBoundingClientRect();
    const m = mapping(r);
    return { x: BS.clamp(m.vx + (ev.clientX - r.left - m.ox) / m.s, 0, app.media.width), y: BS.clamp(m.vy + (ev.clientY - r.top - m.oy) / m.s, 0, app.media.height) };
  }
  /* 映像の画素 → ブラウザの画面座標（テストやデモから、いまの表示での位置を知るため） */
  function toScreen(x, y) {
    const r = $('#autoOverlay').getBoundingClientRect();
    const m = mapping(r);
    return { x: r.left + m.ox + (x - m.vx) * m.s, y: r.top + m.oy + (y - m.vy) * m.s };
  }
  /* リングは小さい（画面上で 20 画素ほどのこともある）ので、バックボードを囲んだら、その周りを拡大して見せる */
  function zoomFor(box) {
    const r = $('#autoOverlay').getBoundingClientRect();
    const W = app.media.width, H = app.media.height;
    const base = Math.min(r.width / W, r.height / H);
    const vw = Math.min(W, box.w / 0.42);                       // バックボードの幅が画面の約 4 割になるように
    if (r.width / vw < base * 1.4) return null;                 // もともと大きく映っているなら拡大しない
    const vh = vw * r.height / r.width;
    return { x: box.x + box.w / 2 - vw / 2, y: box.y + box.h * 0.8 - vh / 2, w: vw, h: vh };
  }
  function onDown(ev) { if (!S.marking) return; ev.preventDefault(); const p = toSrc(ev); S.marking.drag = { a: p, b: p }; $('#autoOverlay').setPointerCapture(ev.pointerId); drawOverlay(); }
  function onMove(ev) { if (!S.marking || !S.marking.drag) return; S.marking.drag.b = toSrc(ev); drawOverlay(); }
  function onUp(ev) {
    const mk = S.marking;
    if (!mk || !mk.drag) return;
    mk.drag.b = toSrc(ev);
    const { a, b } = mk.drag;
    mk.drag = null;
    if (mk.step === 0) {
      const box = { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
      if (box.w < 16 || box.h < 12) { BS.ui.toast('小さすぎます。バックボード全体を囲んでください', 'err'); drawOverlay(); return; }
      mk.box = box; mk.step = 1; mk.view = zoomFor(box); mk.t = app.time();
    } else {
      const w = Math.hypot(a.x - b.x, a.y - b.y);
      if (w < 8) { BS.ui.toast('リングの左端から右端までドラッグしてください', 'err'); drawOverlay(); return; }
      const rim = { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, w };
      setMark(mk.i, { box: mk.box, rim, t: app.time() });
      S.marking = null; setOverlayActive(false);
      S.thumbs[mk.i] = makeThumb(mk.i);
      // 気づきやすい失敗を、その場で知らせる
      const far = rim.cx < mk.box.x - mk.box.w * 0.5 || rim.cx > mk.box.x + mk.box.w * 1.5 || rim.cy < mk.box.y - mk.box.h * 0.5 || rim.cy > mk.box.y + mk.box.h * 2;
      if (far) BS.ui.toast('リングの線が、囲んだバックボードから離れています。同じゴールのリングをなぞり直してください（「指定し直す」）', 'warn', 8000);
      else if (w / app.media.width < 0.0125) BS.ui.toast(`${HOOP_LABEL[mk.i]} を指定しました。ただしリングが小さく映っています。もっと大きく映っている場面があれば、そこで指定し直すと精度が上がります`, 'warn', 8000);
      else BS.ui.toast(`${HOOP_LABEL[mk.i]} を指定しました${cfg().hoops.filter(Boolean).length >= 2 ? '。② の「自動解析を始める」を押してください' : '。もう1つのゴールも、映っている場面で同じように指定します'}`, 'ok', 5000);
    }
    render(); drawOverlay();
  }
  function cancelMarking() {
    if (!S.marking) return;
    S.marking = null; setOverlayActive(false);
    render(); drawOverlay();
  }
  function setMark(i, m) {
    const c = cfg();
    c.hoops[i] = { id: i === 0 ? 'A' : 'B', t: m.t, box: m.box, rim: m.rim };
    app.store.updateMeta({ auto: c });
  }
  function drawOverlay() {
    const cv = $('#autoOverlay');
    if (!cv || !app || !app.media) return;
    const r = cv.getBoundingClientRect();
    const dpr = root.devicePixelRatio || 1;
    if (cv.width !== Math.round(r.width * dpr)) { cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr); }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, r.width, r.height);
    const W = app.media.width, H = app.media.height;
    const mp = mapping(r);
    const sc = mp.s, ox = mp.ox - mp.vx * mp.s, oy = mp.oy - mp.vy * mp.s;
    const X = (x) => ox + x * sc, Y = (y) => oy + y * sc;
    const rect = (b, col, lab) => { g.strokeStyle = col; g.lineWidth = 2; g.strokeRect(X(b.x), Y(b.y), b.w * sc, b.h * sc); if (lab) { g.fillStyle = col; g.font = 'bold 12px sans-serif'; g.fillText(lab, X(b.x) + 3, Y(b.y) - 4); } };
    const rimLine = (rm, col) => { g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.moveTo(X(rm.cx - rm.w / 2), Y(rm.cy)); g.lineTo(X(rm.cx + rm.w / 2), Y(rm.cy)); g.stroke(); };
    const mk = S.marking;
    if (mk) {
      if (mk.view) {
        // 拡大表示：映像のその部分を大きく描く
        g.fillStyle = '#000'; g.fillRect(0, 0, r.width, r.height);
        try { g.drawImage(app.media.el, mk.view.x, mk.view.y, mk.view.w, mk.view.h, 0, 0, r.width, r.height); } catch (e) { /* まだ描けるコマがない */ }
      } else { g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 0, r.width, r.height); }
      if (mk.box) rect(mk.box, mk.i ? '#e879f9' : '#22c55e', HOOP_LABEL[mk.i]);
      if (mk.drag) {
        const { a, b } = mk.drag;
        if (mk.step === 0) rect({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) }, '#fbbf24');
        else { g.strokeStyle = '#fbbf24'; g.lineWidth = 3; g.beginPath(); g.moveTo(X(a.x), Y(a.y)); g.lineTo(X(b.x), Y(b.y)); g.stroke(); }
      }
      // いま何をすればよいかを、映像の上の帯に出す
      g.fillStyle = 'rgba(0,0,0,0.66)'; g.fillRect(0, 0, r.width, 28);
      g.fillStyle = '#fde047'; g.font = 'bold 13.5px sans-serif';
      g.fillText(mk.step === 0 ? `${HOOP_LABEL[mk.i]}　① バックボード（板）全体を、ドラッグで囲んでください` : `${HOOP_LABEL[mk.i]}　② ${mk.view ? '🔍 拡大表示中：' : ''}リング（輪）の左端 → 右端 を、ぴったりドラッグ`, 10, 19);
      return;
    }
    // 解析中：いま調べているコマと、追跡している枠・ボール候補（自動解析タブを見ているときだけ。ほかのタブでは映像をふさがない）
    if (S.live) {
      if (app.tab !== 'auto') return;
      if (S.live.preview) { g.fillStyle = '#000'; g.fillRect(0, 0, r.width, r.height); g.drawImage(S.live.preview, X(0), Y(0), W * sc, H * sc); }
      const idx = (S.running && S.running.idx) || [0, 1];
      S.live.status.forEach((s, i) => {
        if (!s.tracked) return;
        const hi = idx[i] != null ? idx[i] : i;
        rect(s.box, hi ? '#e879f9' : '#22c55e', HOOP_LABEL[hi]);
        rimLine(s.rim, '#fde047');
        (s.balls || []).forEach((c) => { g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(X(s.rim.cx + c.x * s.rim.w), Y(s.rim.cy + c.y * s.rim.w), 0.3 * s.rim.w * sc, 0, Math.PI * 2); g.stroke(); });
      });
      return;
    }
    // 指定済みのゴール（指定したコマの近くでだけ表示）
    if (app.tab === 'auto') {
      cfg().hoops.forEach((m, i) => { if (m && Math.abs(app.time() - m.t) < 0.2) { rect(m.box, i ? '#e879f9' : '#22c55e', HOOP_LABEL[i]); rimLine(m.rim, '#fde047'); } });
    }
  }

  /* ---------- 解析エンジン（できれば Worker で、だめなら画面側で同じコードを動かす） ---------- */
  function yieldNow() {       // setTimeout はタブが裏に回ると遅くなるので MessageChannel で一息つく
    return new Promise((r) => { const ch = new MessageChannel(); ch.port1.onmessage = () => r(); ch.port2.postMessage(0); });
  }
  async function openEngine(cfgA, onEvent) {
    const make = (useWorker) => {
      let worker = null, core = null, seq = 0, dead = null, source = null;
      const pend = new Map();
      /* Worker が「ファイルのここを読んで」と頼んできたとき（Worker の中からは読めない環境）に、画面側で読んで渡す */
      const serveRead = (m) => {
        const reply = (o, tr) => { const msg = Object.assign({ cmd: 'data', rid: m.rid }, o); if (worker) worker.postMessage(msg, tr || []); else core.handle(msg, receive); };
        if (!source || typeof source.slice !== 'function') { reply({ error: 'ファイルがありません' }); return; }
        source.slice(m.a, m.b).arrayBuffer().then((buf) => reply({ buf }, [buf]), (err) => reply({ error: String((err && err.message) || err) }));
      };
      const receive = (m) => {
        if (m.ev === 'read') { serveRead(m); return; }
        if (m.ev) { onEvent(m); return; }
        const p = pend.get(m.id);
        if (!p) return;
        pend.delete(m.id);
        if (m.ok) p.resolve(m); else p.reject(Object.assign(new Error(m.error), { code: m.code }));
      };
      if (useWorker) {
        const code = ['vision', 'auto', 'mp4', 'autoEngine'].map((k) => '(' + BS.src[k].toString() + ')(self);').join('\n') + '\nBS.autoEngine.serve(self);';
        const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        worker = new Worker(url);
        worker.onmessage = (e) => receive(e.data);
        worker.onerror = (e) => { dead = new Error(e.message || 'Worker error'); pend.forEach((p) => p.reject(dead)); pend.clear(); };
      } else {
        core = BS.autoEngine.create({
          makeCanvas: (w, hh) => { const c = document.createElement('canvas'); c.width = w; c.height = hh; return c; },
          transferable: false, preview: (c) => c
        });
      }
      return {
        kind: useWorker ? 'worker' : 'local',
        call(cmd, payload, transfer) {
          return new Promise((resolve, reject) => {
            if (dead) { reject(dead); return; }
            const m = Object.assign({ id: ++seq, cmd }, payload || {});
            if (payload && payload.file) source = payload.file;
            pend.set(m.id, { resolve, reject });
            if (worker) worker.postMessage(m, transfer || []); else core.handle(m, receive);
          });
        },
        cancel() { if (worker) worker.postMessage({ cmd: 'cancel' }); else core.cancel(); },
        close() { if (worker) worker.terminate(); }
      };
    };
    if (typeof Worker !== 'undefined' && typeof OffscreenCanvas !== 'undefined') {
      let eng = null;
      try { eng = make(true); await eng.call('init', { cfg: cfgA }); return eng; }
      catch (err) { console.warn('[auto] Worker を使えないので画面側で解析します', err); if (eng) eng.close(); }
    }
    const eng = make(false);
    await eng.call('init', { cfg: cfgA });
    return eng;
  }

  /* B-1) 合成サンプル：1コマずつ描いて送る */
  async function runSynth(eng, media, marks, st, onLive, until) {
    // 解析用に、画面とは別の canvas へ描く（CPU 描画にしておくと、画素の受け渡しが速く、タブが裏でも遅くならない）
    const cv = document.createElement('canvas');
    cv.width = media.width; cv.height = media.height;
    cv.getContext('2d', { willReadFrequently: true });
    const rd = BS.Renderer(media.game, cv);
    const shot = (t) => { rd.draw(t); return createImageBitmap(cv); };
    for (let k = 0; k < marks.length; k++) {
      const bm = await shot(marks[k].t);
      await eng.call('tpl', { i: k, image: bm }, eng.kind === 'worker' ? [bm] : []);
    }
    const dur = Math.min(media.duration, until != null ? until : Infinity), step = 1 / 15;
    const q = [];
    let lastPrev = 0, lastYield = performance.now();
    for (let k = 0; k * step <= dur && !st.cancel; k++) {
      const t = k * step;
      const bm = await shot(t);
      const now = performance.now();
      const preview = now - lastPrev > 200;
      if (preview) lastPrev = now;
      q.push(eng.call('frame', { t, image: bm, preview }, eng.kind === 'worker' ? [bm] : []).then((r) => onLive(t, r.live)));
      if (q.length >= 3) await q.shift();
      if (eng.kind === 'local' && now - lastYield > 40) { await yieldNow(); lastYield = performance.now(); }
    }
    await Promise.all(q);
    return (await eng.call('finish')).result;
  }

  /* B-2) WebCodecs が使えない動画：<video> を等速で再生しながら、表示されたコマを送る。
     表示されているコマしか取れないので、このタブを表示している間だけ進む（裏に回ると一時停止）。 */
  async function runVideoPlayback(eng, media, marks, st, onLive) {
    const v = media.el;
    if (!v.requestVideoFrameCallback) throw new Error('このブラウザは、この動画形式の自動解析に対応していません');
    const prevRate = v.playbackRate, prevMuted = v.muted;
    for (let k = 0; k < marks.length; k++) {
      await media.seek(marks[k].t);
      await new Promise((r) => setTimeout(r, 250));
      const bm = await createImageBitmap(v);
      await eng.call('tpl', { i: k, image: bm }, eng.kind === 'worker' ? [bm] : []);
    }
    await media.seek(0);
    v.muted = true; v.playbackRate = 1;      // 等速。2倍速だと表示の間に合わないコマが出て、調べる間隔が不ぞろいになる（判定は約15コマ/秒で合わせてある）
    const dur = media.duration, MIN_STEP = BS.autoEngine.MIN_STEP;
    let inflight = 0, lastT = -1, frames = 0, gaps = 0, holdQueue = false, holdHidden = false, lastPrev = 0, failed = null;
    const resume = () => { if (!holdQueue && !holdHidden && !st.cancel) v.play().catch(() => {}); };
    await new Promise((resolve) => {
      let over = false;
      const onVis = () => { if (document.hidden) { holdHidden = true; v.pause(); } else if (holdHidden) { holdHidden = false; resume(); } };
      const end = () => { if (over) return; over = true; v.removeEventListener('ended', end); document.removeEventListener('visibilitychange', onVis); resolve(); };
      v.addEventListener('ended', end);
      document.addEventListener('visibilitychange', onVis);
      const onFrame = (now, meta) => {
        if (over) return;
        if (st.cancel || failed) { v.pause(); end(); return; }
        const t = meta.mediaTime;
        if (t - lastT >= MIN_STEP) {
          if (lastT >= 0 && t - lastT > 0.11) gaps++;
          lastT = t; frames++; inflight++;
          const preview = now - lastPrev > 200;
          if (preview) lastPrev = now;
          createImageBitmap(v)
            .then((bm) => eng.call('frame', { t, image: bm, preview }, eng.kind === 'worker' ? [bm] : []))
            .then((r) => { inflight--; onLive(t, r.live); if (holdQueue && inflight <= 2) { holdQueue = false; resume(); } })
            .catch((err) => { inflight--; failed = err; });
          if (inflight > 6 && !holdQueue) { holdQueue = true; v.pause(); }
        }
        if (t >= dur - 0.15) { end(); return; }
        v.requestVideoFrameCallback(onFrame);
      };
      v.requestVideoFrameCallback(onFrame);
      if (document.hidden) holdHidden = true; else v.play().catch(() => end());
    });
    v.pause();
    while (inflight > 0) await yieldNow();
    v.playbackRate = prevRate; v.muted = prevMuted;
    if (failed) throw failed;
    const res = (await eng.call('finish')).result;
    res.mode = 'playback'; res.gaps = gaps; res.pushed = frames;
    return res;
  }

  async function run(opts) {
    if (S.running || !app.media) return;
    opts = opts || {};
    const c = cfg();
    const marks = c.hoops.filter(Boolean);
    if (!marks.length) return;
    const media = app.media;
    if (!opts.silent) app.stopDemo('auto');      // デモの中から呼ばれたときは止めない
    if (BS.uiHL.reelActive()) BS.uiHL.stop(true);
    review.stop(true);
    media.pause();
    const idx = c.hoops.map((m, i) => (m ? i : -1)).filter((i) => i >= 0);
    const st = S.running = { cancel: false, made: 0, miss: 0, t: 0, mode: '', eng: null, idx };
    render();
    const dur = opts.t1 != null ? Math.min(opts.t1, app.duration()) : app.duration();
    const t0w = performance.now();
    const onLive = (t, live, preview) => {
      st.t = t;
      for (const e of live.events) { if (e.made) st.made++; else st.miss++; }
      const old = S.live && S.live.preview;
      const pv = preview || live.preview || null;
      if (pv && old && old !== pv && typeof old.close === 'function') old.close();
      S.live = { status: live.status, preview: pv || old || null };
      const bar = $('#autoBar'), lab = $('#autoLabel'), lv = $('#autoLive');
      const sec = Math.max(0.5, (performance.now() - t0w) / 1000);
      if (bar) bar.style.width = (BS.clamp(t / dur, 0, 1) * 100).toFixed(1) + '%';
      if (lab) lab.textContent = `${BS.fmtTime(t)} / ${BS.fmtTime(dur)}（${(t / sec).toFixed(1)}倍速）`;
      if (lv) lv.textContent = `検出：成功 ${st.made} 本・失敗 ${st.miss} 本`;
      drawOverlay();
    };
    let eng = null, res = null;
    try {
      eng = st.eng = await openEngine({ srcW: media.width, srcH: media.height, hoops: marks.map((m) => ({ id: m.id, box: m.box, rim: m.rim })), debug: !!S.debug },      // S.debug: 検証用（コマごとのログを S.lastLog に残す）
        (m) => { if (m.ev === 'progress') onLive(m.t, m.live, m.preview); else if (m.ev === 'info') st.info = m; });
      if (media.kind === 'synth') {
        st.mode = 'push';
        res = await runSynth(eng, media, marks, st, onLive, opts.t1);
      } else {
        try {
          st.mode = 'decode';
          const src = typeof media.file === 'string' ? { url: new URL(media.file, root.location.href).href } : { file: media.file };
          res = (await eng.call('decode', Object.assign({ marks: marks.map((m, i) => ({ i, t: m.t })), t0: 0, t1: opts.t1, debug: !!S.debug }, src))).result;
        } catch (err) {
          if (err.code !== 'unsupported') throw err;
          console.warn('[auto] ファイルを直接読めないので、再生しながら解析します：', err.message);
          BS.ui.toast('この動画形式は直接読めないので、再生しながら解析します（動画と同じ長さの時間がかかります。このタブを表示したままにしてください）', 'warn', 9000);
          st.mode = 'playback';
          res = await runVideoPlayback(eng, media, marks, st, onLive);
        }
      }
      if (st.cancel) throw Object.assign(new Error('中止しました'), { code: 'cancelled' });
      if (res.log) { S.lastLog = res.log; delete res.log; }
      res.shots.forEach((s) => { s.hoop = idx[s.hoop]; });     // marks の順（詰めたもの）→ ゴール番号 に戻す
      res.wall = (performance.now() - t0w) / 1000;
      apply(res, idx, dur);
    } catch (err) {
      if (err.code === 'cancelled' || st.cancel) BS.ui.toast('解析を中止しました', 'warn');
      else { console.error('[auto]', err); BS.ui.toast('解析に失敗しました：' + err.message, 'err', 8000); }
    }
    if (eng) eng.close();
    if (S.live && S.live.preview && typeof S.live.preview.close === 'function') S.live.preview.close();
    S.running = null; S.live = null;
    drawOverlay();
    if (media.kind === 'synth') media.seek(0);
    render();
    return res;
  }
  function cancelRun() { const st = S.running; if (!st) return; st.cancel = true; if (st.eng) st.eng.cancel(); }

  function apply(res, idx, until) {
    const P = app.store.project, M = app.model();
    const c = cfg();
    const evs = A.toEvents(res, { hoopTeam: c.hoopTeam, periods: M.periods.map((p) => ({ n: p.n, t0: p.t0 })), halfSwitch: true });
    // 以前の自動タグのうち、未確認のものは置き換える。確認済みと近い時刻のものは足さない
    const keep = P.events.filter((e) => !(e.auto && !e.ok));
    const confirmed = keep.filter((e) => e.auto || e.type === 'shot' || e.type === 'ft');
    const fresh = evs.filter((e) => !confirmed.some((k) => k.type === e.type && Math.abs(k.t - e.t) < 2));
    // 解析の記録（どの方式で・どこまで調べたか・ゴールが映っていた区間）
    const mapMask = (m) => { let o = 0; idx.forEach((hi, i) => { if (m & (1 << i)) o |= 1 << hi; }); return o; };
    const made = res.shots.filter((s) => s.made).length;
    c.last = {
      at: Date.now(), mode: res.mode, frames: res.frames, wall: Math.round(res.wall), dur: +app.duration().toFixed(1), until: +Math.min(until, app.duration()).toFixed(1),
      shots: res.shots.length, made, gaps: res.gaps || 0,
      spans: (res.spans || []).filter((sp) => sp[2]).map((sp) => [+sp[0].toFixed(1), +sp[1].toFixed(1), mapMask(sp[2])])
    };
    app.store.updateMeta({ auto: c });
    app.store.replaceEvents(keep.concat(fresh), '自動解析');
    S.lastResult = { shots: res.shots.length, made };
    BS.ui.toast(`自動解析が終わりました：シュート ${res.shots.length} 本（成功 ${made}）を検出`, 'ok', 6000);
  }

  /* ゴールが映っていた区間の帯（映っていない時間は検出できないので、正直に見せる） */
  function coverage(last) {
    const full = last.dur || app.duration() || 1;
    const dur = last.until && last.until < full - 1 ? last.until : full;      // 一部だけ解析したときは、その範囲に対する割合
    const rows = [0, 1].filter((i) => cfg().hoops[i]).map((i) => {
      let sec = 0;
      const segs = last.spans.filter((sp) => sp[2] & (1 << i)).map((sp) => {
        sec += sp[1] - sp[0] + 1 / 15;
        return h('i', { style: { position: 'absolute', top: 0, bottom: 0, left: (sp[0] / dur * 100).toFixed(2) + '%', width: Math.max(0.15, (sp[1] - sp[0]) / dur * 100).toFixed(2) + '%', background: i ? '#e879f9' : '#22c55e' } });
      });
      return h('div', { style: { margin: '6px 0' } },
        h('div', { class: 'note' }, `${HOOP_LABEL[i]} が映っていた時間：${BS.fmtTime(sec)}（${Math.round(sec / dur * 100)}%）`),
        h('div', { style: { position: 'relative', height: '10px', background: 'rgba(128,128,128,0.25)', borderRadius: '5px', overflow: 'hidden', cursor: 'pointer' },
          title: 'クリックした位置へ移動',
          onclick: (e) => { const r = e.currentTarget.getBoundingClientRect(); app.seek(BS.clamp((e.clientX - r.left) / r.width, 0, 1) * dur); } }, segs));
    });
    const how = last.mode === 'decode' ? 'ファイルを直接デコード（全区間・約15コマ/秒）' : last.mode === 'playback' ? `再生しながら解析${last.gaps ? '（コマの取りこぼし ' + last.gaps + ' 回）' : ''}` : '合成映像を1コマずつ';
    return h('div', { class: 'card' },
      h('b', null, 'どこを調べられたか'),
      rows,
      h('div', { class: 'note' }, `灰色の時間はゴールが画面に映っていない（または追えなかった）ので、その間のシュートは検出できません。`),
      dur < full ? h('div', { class: 'note' }, `※ 今回は最初の ${BS.fmtTime(last.until)} だけを解析しました（帯もその範囲です）。`) : null,
      h('div', { class: 'note' }, `解析方式：${how}／${last.frames} コマ／${BS.fmtTime(last.wall)} で完了`));
  }

  /* ---------- 確認モード ----------
     見つけた場面を順に再生し、「誰が」を背番号のキーで、「どこから」をコート図のクリックで入れてもらう。
     シュートは、選手と場所の両方が入ったら次の場面へ進む（順番はどちらが先でもよい。→ で場所なしのまま進める）。 */
  function reviewQueue() {
    const reb = cfg().reviewReb !== false;       // リバウンド（推定）も聞くか
    return app.model().events.filter((e) => e.auto && !e.ok && (e.type === 'shot' || e.type === 'ft' || (reb && e.type === 'reb')));
  }
  /* 選手はもう入っているのに、場所がまだのシュート（「場所だけ入れる」で順に回る） */
  function locQueue() {
    return app.model().events.filter((e) => e.type === 'shot' && e.sx == null && (e.ok || !e.auto));
  }
  /* コート図の向き（そのシュートを打ったゴールごと）。利用者が回していなければ、ゴールの指定から決める（BS.courtRotOfMark） */
  function courtRot(ev) {
    const i = ev && ev.hoop;
    if (i == null) return 0;
    const c = cfg();
    const r = c.courtRot && c.courtRot[i];
    return r != null ? r : BS.courtRotOfMark(c.hoops[i]);
  }
  function rotateCourt(ev) {
    const i = ev && ev.hoop;
    if (i == null) { BS.ui.toast('この場面は、どちらのゴールか分からないので、図の向きを変えられません', 'warn'); return; }
    const c = cfg();
    const rots = BS.COURT_ROTS;
    c.courtRot = c.courtRot ? c.courtRot.slice() : [null, null];
    c.courtRot[i] = rots[(rots.indexOf(courtRot(ev)) + 1) % rots.length];
    app.store.updateMeta({ auto: c });
    BS.uiTag.renderPrompt();
  }
  /* シュートの場所も確認モードで入れるか（既定は入れる） */
  function setReviewLoc(on) {
    const c = cfg();
    c.reviewLoc = !!on;
    app.store.updateMeta({ auto: c });
    if (review.active) review.advance(true); else render();
  }
  const review = {
    active: false, id: null, stopAt: 0,
    mode: 'all',       // 'all'＝まだ確認していない場面を順に／'loc'＝選手は入っていて場所がまだのシュートだけを順に（場所だけ入れる）
    hist: [],          // 見てきた順（← で、確認済みの場面にも戻って直せるように）
    ptsBy: null,       // この場面で W／R を押して、点数を自分で決めた（場所のクリックで上書きしない）
    timer: 0,          // 「そろったので次へ」の待ち
    start(mode) {
      review.mode = mode === 'loc' ? 'loc' : 'all';
      const q = review.queue();
      if (!q.length) { BS.ui.toast(review.mode === 'loc' ? '場所がまだのシュートはありません' : '確認するものはありません', 'ok'); return; }
      review.active = true; review.hist = [];
      app.showTab('tag');
      review.show(q[0].id);
    },
    /* これから回る場面 */
    queue() { return review.mode === 'loc' ? locQueue() : reviewQueue(); },
    /* 選手がもう決まっている場面か（自動で見つけたものは確認済み、手で入れたタグは最初から） */
    confirmed(ev) { return !!ev && (!!ev.ok || !ev.auto); },
    stop(silent) {
      if (!review.active) return;
      clearTimeout(review.timer);
      review.active = false; review.id = null; review.hist = []; review.ptsBy = null; review.mode = 'all';
      app.tagger.reset();
      app.pause();
      if (!silent) BS.ui.toast('確認モードを終了しました', 'ok');
      BS.uiTag.renderPrompt();
    },
    cur() { return app.store.project.events.find((e) => e.id === review.id) || null; },
    /* シュートの場所も聞く設定か */
    wantsLoc() { return review.mode === 'loc' || cfg().reviewLoc !== false; },
    /* この場面は、これから場所を入れてもらうか（シュートで、まだ場所がなく、聞く設定のとき） */
    needLoc(ev) { return !!ev && ev.type === 'shot' && ev.sx == null && review.wantsLoc(); },
    show(id) {
      const e = app.store.project.events.find((x) => x.id === id);
      if (!e) { review.next(); return; }
      clearTimeout(review.timer);
      review.id = id; review.ptsBy = null;
      if (review.hist[review.hist.length - 1] !== id) review.hist.push(id);
      const lead = e.type === 'reb' ? 2.5 : 2.2;
      review.stopAt = (e.tDet != null ? e.tDet : e.t) + (e.type === 'reb' ? 1.5 : 1.6);
      app.seek(Math.max(0, e.t - lead), { fromReel: true });
      app.play();
      app.tagger.beginAssign(id);
      BS.uiTag.renderPrompt();
    },
    next(dir) {
      clearTimeout(review.timer);
      if (dir === -1) {
        // 見てきた順に戻る。確認済みの場面にも戻れるので、選手や場所を入れ直せる
        while (review.hist.length) {
          const id = review.hist.pop();
          if (id !== review.id && app.store.find(id)) { review.show(id); return; }
        }
      }
      const q = review.queue();
      if (!q.length) {
        if (dir === -1 && review.cur()) { review.show(review.id); return; }      // 戻る先がない：いまの場面をもう一度
        const loc = review.mode === 'loc';
        review.stop(true);
        BS.ui.toast(loc ? '場所を入れ終わりました 🎉（ショットのタブで、選手ごとの図が見られます）' : 'すべて確認しました 🎉', 'ok', 5000);
        app.showTab(loc ? 'shot' : 'box');
        return;
      }
      const cur = review.cur();
      const t = cur ? cur.t : -1;
      let nx;
      if (dir === -1) nx = q.slice().reverse().find((e) => e.t < t - 0.01) || q[q.length - 1];
      else nx = q.find((e) => e.t > t + 0.01 || (e.t === t && e.id !== review.id)) || q[0];
      review.show(nx.id);
    },
    onTime(t) { if (review.active && t >= review.stopAt && !app.paused()) app.pause(); },
    /* コート図でクリックした場所を、いま確認しているシュートに付ける。2点／3点も、場所から決める */
    setLoc(sx, sy) {
      const ev = review.cur();
      if (!review.active || !ev) return;
      if (!review.wantsLoc()) return;
      if (ev.type !== 'shot') {
        BS.uiPlayer.flash(ev.type === 'ft' ? 'フリースローには場所を付けません（W／R でシュートに直せます）' : 'リバウンドには場所を付けません', 'info');
        return;
      }
      const z = BS.shotZone(sx, sy);
      const keep = review.ptsBy === ev.id;      // W／R で決めた点数は、そのままにする
      const pts = keep ? ev.pts : (z.three ? 3 : 2);
      app.store.updateEvent(ev.id, { sx, sy, pts }, 'シュート位置');
      BS.uiPlayer.flash(`シュート位置：${BS.zoneLabel(z.zone)}（${pts}点${keep && (pts === 3) !== z.three ? '。点数は W／R で決めたまま' : ''}）`, 'ok');
      review.advance(true);
    },
    /* そろっていたら次の場面へ。足りなければ、そのまま待つ。
       acted＝利用者がこの場面に何か入れた直後か（表示しただけ・W／R を押しただけでは、先へ進まない） */
    advance(acted) {
      if (!review.active) return;
      clearTimeout(review.timer);
      const ev = review.cur();
      const go = () => { const id = review.id; review.timer = setTimeout(() => { if (review.active && review.id === id) review.next(1); }, 350); };
      if (!ev) { go(); return; }      // 確認中のタグが消えた
      const flow = app.tagger.state().flow;
      const asking = !!flow && flow.kind === 'assign' && flow.ref === ev.id;      // 「誰のプレー？」を出している
      if (flow && !asking) return;                                               // アシストなど、ほかの質問の途中
      const complete = review.confirmed(ev) && !review.needLoc(ev);
      if (asking) {
        // 表示した直後、または場所を待っているところ。そろっていても、利用者が何か入れた直後でなければ進まない（← で戻って見ているだけ、など）
        if (acted && complete) go(); else BS.uiTag.renderPrompt();
        return;
      }
      // 「誰？」の入力が終わった（番号が入った）か、元に戻した直後
      if (complete) { go(); return; }
      app.tagger.beginAssign(ev.id);      // まだ足りない（場所がまだ／元に戻して選手が消えた）：番号キーがこの場面に効くようにして待つ
      BS.uiTag.renderPrompt();
    },
    /* 確認モード中のキー。処理したら true */
    key(e) {
      if (!review.active) return false;
      const ev = review.cur();
      const flow = app.tagger.state().flow;
      const upd = (patch, msg) => { app.store.updateEvent(ev.id, patch, '確認'); BS.uiPlayer.flash(msg, 'info'); if (!app.tagger.state().flow) app.tagger.beginAssign(ev.id); BS.uiTag.renderPrompt(); };
      switch (e.code) {
        case 'Escape': review.stop(); return true;
        case 'ArrowRight': review.next(1); return true;
        case 'ArrowLeft': review.next(-1); return true;
        case 'Space': if (ev) { app.seek(Math.max(0, ev.t - 2.2), { fromReel: true }); app.play(); } return true;
        case 'Delete': case 'Backspace':
          if (!ev) return true;
          if (review.mode === 'loc') { BS.uiPlayer.flash('「場所だけ入れる」の間は、タグを消せません（消すときは、タグ一覧の 🗑）', 'info'); return true; }
          app.store.removeEvent(ev.id, '誤検出を削除');
          if (app.store.find(ev.id + 'r')) app.store.removeEvent(ev.id + 'r', '誤検出を削除');
          BS.uiPlayer.flash('この検出を削除しました', 'info');
          app.tagger.reset(); review.next(1);
          return true;
        case 'Enter': case 'NumpadEnter':
          if (flow && flow.kind === 'assist') return false;   // アシストの省略はタグ入力側で処理
          review.next(1); return true;
        default: break;
      }
      if (!ev || (flow && flow.kind !== 'assign')) return false;
      if (ev.type === 'shot' || ev.type === 'ft') {
        if (e.code === 'KeyW') { review.ptsBy = ev.id; upd({ type: 'shot', pts: 2 }, '2点シュートにしました'); return true; }
        if (e.code === 'KeyR') { review.ptsBy = ev.id; upd({ type: 'shot', pts: 3 }, '3点シュートにしました'); return true; }
        // フリースローは場所が要らないので、選手がもう入っていれば、これでそろう
        if (e.code === 'KeyF') { upd({ type: 'ft' }, 'フリースローにしました'); review.advance(true); return true; }
        if (e.code === 'KeyM') { upd({ made: !ev.made, ast: null }, ev.made ? '「失敗」にしました' : '「成功」にしました'); return true; }
      }
      // 番号キーと Q 以外のプレーのキーは、確認モードでは無効（誤操作防止）
      if (/^Key[A-Z]$/.test(e.code) && e.code !== 'KeyQ') return true;
      return false;
    },
    /* タグ入力の状態が変わった（番号が入った・質問が終わった・元に戻した）とき */
    onTagChange() { review.advance(false); },
    label() {
      if (!review.active) return null;
      const ev = review.cur();
      if (!ev) return null;
      const q = review.queue();
      const P = app.store.project;
      return `${review.mode === 'loc' ? '📍 場所だけ入れる 残り' + q.length + '本' : '⚡ 確認 残り' + q.length + '件'}｜${BS.fmtTime(ev.t)} ${P.teams[ev.team] ? P.teams[ev.team].short : ''} ${ev.type === 'reb' ? (ev.off ? 'オフェンスリバウンド（推定）' : 'ディフェンスリバウンド（推定）') : ev.type === 'ft' ? 'FT' + (ev.made ? '成功' : '失敗') : ev.pts + 'P' + (ev.made ? '成功' : '失敗')}${ev.unsure ? '（入ったか要確認）' : ''}`;
    }
  };

  /* ゴール → チームの対応や、後半の開始位置を変えたとき：まだ確認していない自動タグのチームを付け直す（解析をやり直さなくてよい） */
  function remapAuto() {
    const P = app.store.project, c = cfg(), M = app.model();
    const perAt = (t) => { let n = 1; M.periods.forEach((p) => { if (t >= p.t0) n = p.n; }); return n; };
    const teamOf = (hoop, t) => (perAt(t) >= 3 ? 1 - c.hoopTeam[hoop] : c.hoopTeam[hoop]);
    let n = 0;
    const evs = P.events.map((e) => {
      if (!e.auto || e.ok || e.hoop == null || !(e.type === 'shot' || e.type === 'ft' || e.type === 'reb')) return e;
      const shotTeam = teamOf(e.hoop, e.type === 'reb' ? e.t - 1.0 : (e.tDet != null ? e.tDet : e.t));
      const team = e.type === 'reb' ? (e.off ? shotTeam : 1 - shotTeam) : shotTeam;
      if (team === e.team) return e;
      n++;
      return Object.assign({}, e, { team });
    });
    if (n) app.store.replaceEvents(evs, 'ゴールとチームの対応');
    return n;
  }
  /* データが変わるたびに呼ばれる：同じ試合のまま、対応（ゴール→チーム・後半の開始）が変わっていたら付け直す */
  let mapKey = null;
  function onData() {
    if (!app || !app.store) return;
    const P = app.store.project;
    const key = P.id + '|' + cfg().hoopTeam.join('') + '|' + app.model().periods.map((p) => p.n + '@' + p.t0).join(',');
    const prev = mapKey;
    mapKey = key;
    if (prev != null && prev !== key && prev.split('|')[0] === P.id) { const n = remapAuto(); if (n) BS.ui.toast(`自動タグ ${n} 件のチームを付け直しました`, 'ok', 4000); }
  }
  function onChange() { if (app.tab === 'auto') render(); }
  /* タブを切り替えたとき：映像の上の描き込み（ゴールの枠など）を、そのタブに合わせて描き直す。指定の途中だったらやめる */
  function onTab(id) {
    if (id !== 'auto' && S.marking) { S.marking = null; setOverlayActive(false); }
    drawOverlay();
  }
  function onTime(t) {
    review.onTime(t);
    const mk = S.marking;
    if (mk && mk.step === 1 && Math.abs(t - mk.t) > 0.02) {
      // 板を囲んだあとでコマが動いた：枠とリングが別のコマになってしまうので、囲むところからやり直す
      mk.step = 0; mk.box = null; mk.view = null; mk.drag = null;
      BS.ui.toast('コマが動いたので、バックボードを囲むところからやり直してください', 'warn', 4500);
      render(); drawOverlay();
      return;
    }
    if (mk && mk.step === 0) { drawOverlay(); return; }
    if (app.tab === 'auto' && !S.running && !S.marking) drawOverlay();
  }

  BS.review = review;
  BS.uiAuto = { FIG, init, render, onChange, onData, onTime, onTab, run, cancel: cancelRun, cancelMarking, setMark, drawOverlay, toScreen, state: S, reviewQueue, openEngine, remapAuto, setHalf, courtRot, rotateCourt, setReviewLoc, locQueue };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/demo.js */
/* バスケ分析スタジオ — 自動デモ
   開いたときに「何ができるか」を、カーソルとキー表示つきで実際に操作して見せる。
   本物のクリック・キー入力・ホイール操作があれば、その場でデモを止めて操作を渡す。 */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { $ } = BS.ui;

  let run = null;   // 実行中のデモ { id, cancelled }
  let runSeq = 0;
  const TOTAL = 9;
  const AUTO_UNTIL = 56;   // デモで自動解析する長さ（秒）。サンプルの最初のシュート5本ぶん

  class Cancelled extends Error {}

  function running() { return !!run; }

  function layer() { return $('#demoLayer'); }
  function check(r) { if (!run || run !== r || r.cancelled) throw new Cancelled(); }
  function sleep(r, ms) {
    return new Promise((res, rej) => {
      const t0 = performance.now();
      const tick = () => {
        if (!run || run !== r || r.cancelled) { rej(new Cancelled()); return; }
        if (performance.now() - t0 >= ms) { res(); return; }
        r.timer = setTimeout(tick, Math.min(80, ms));
      };
      tick();
    });
  }
  /* 説明の吹き出しは、右側の操作パネルを隠さないよう映像の上部に重ねる */
  function placeCaption() {
    const c = $('#demoCaption');
    const v = $('#viewer');
    if (!c || !v) return;
    const r = v.getBoundingClientRect();
    const wide = root.innerWidth > 1180;
    if (wide && r.top > -40 && r.top < root.innerHeight - 200) {
      const w = Math.min(560, r.width - 24);
      c.style.left = (r.left + r.width / 2) + 'px';
      c.style.top = Math.max(8, r.top + 58) + 'px';
      c.style.bottom = 'auto';
      c.style.width = w + 'px';
    } else {
      c.style.left = '50%';
      c.style.top = 'auto';
      c.style.bottom = '88px';
      c.style.width = 'min(620px, calc(100vw - 24px))';
    }
  }
  function caption(step, title, text) {
    const c = $('#demoCaption');
    placeCaption();
    c.querySelector('.st').textContent = step ? `自動デモ ${step}/${TOTAL}` : '自動デモ';
    c.querySelector('h4').textContent = title;
    c.querySelector('p').textContent = text;
    c.querySelector('.stepn').textContent = '';
    c.querySelector('.bar i').style.width = ((step || 0) / TOTAL * 100) + '%';
  }
  function cursorTo(r, x, y) {
    placeCaption();
    const cur = $('#demoCursor');
    cur.style.left = x + 'px'; cur.style.top = y + 'px';
    return sleep(r, 650);
  }
  async function pointAt(r, el, opts) {
    check(r);
    if (!el) return;
    opts = opts || {};
    const rect0 = el.getBoundingClientRect();
    if (rect0.top < 60 || rect0.bottom > root.innerHeight - 20) {
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      await sleep(r, 450);
    }
    const rect = el.getBoundingClientRect();
    const x = rect.left + (opts.fx != null ? rect.width * opts.fx : Math.min(rect.width / 2, 60));
    const y = rect.top + (opts.fy != null ? rect.height * opts.fy : rect.height / 2);
    await cursorTo(r, x, y);
    if (opts.outline) { el.classList.add('demo-target'); r.outlined.push(el); }
  }
  async function click(r, el, opts) {
    await pointAt(r, el, opts);
    check(r);
    const cur = $('#demoCursor');
    cur.classList.remove('click'); void cur.getBoundingClientRect(); cur.classList.add('click');
    await sleep(r, 160);
    check(r);
    if (opts && opts.point) {
      const rect = el.getBoundingClientRect();
      const x = rect.left + rect.width * opts.fx, y = rect.top + rect.height * opts.fy;
      el.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: x, clientY: y }));
    } else el.click();
    await sleep(r, 260);
  }
  function unoutline(r) { r.outlined.forEach((el) => el.classList.remove('demo-target')); r.outlined = []; }

  const KEYCODE = { Q: 'KeyQ', W: 'KeyW', E: 'KeyE', R: 'KeyR', T: 'KeyT', F: 'KeyF', G: 'KeyG', D: 'KeyD', A: 'KeyA', X: 'KeyX', S: 'KeyS', B: 'KeyB', C: 'KeyC', U: 'KeyU', Y: 'KeyY', P: 'KeyP', M: 'KeyM', Enter: 'Enter', Space: 'Space', Escape: 'Escape', Delete: 'Delete' };
  async function press(r, key, label) {
    check(r);
    const box = $('#demoKeys');
    const k = document.createElement('div');
    k.className = 'key';
    k.innerHTML = `${key === 'Space' ? '␣' : key === 'Escape' ? 'Esc' : key === 'Delete' ? 'Del' : key}${label ? `<small>${label}</small>` : ''}`;
    box.appendChild(k);
    while (box.children.length > 5) box.firstChild.remove();
    setTimeout(() => k.remove(), 2200);
    const code = /^\d$/.test(key) ? 'Digit' + key : (KEYCODE[key] || key);
    BS.app.handleKey({ code, key: key.length === 1 ? key.toLowerCase() : key, shiftKey: false, altKey: false, metaKey: false, ctrlKey: false, target: document.body, isTrusted: false, preventDefault() {}, defaultPrevented: false });
    await sleep(r, 420);
  }
  async function waitTime(r, t, maxMs) {
    const t0 = performance.now();
    const app = BS.app;
    while (app.time() < t) {
      check(r);
      if (performance.now() - t0 > (maxMs || 15000)) { await app.seek(t); break; }
      if (app.paused()) app.play();
      await sleep(r, 60);
    }
  }
  const tabBtn = (id) => document.querySelector(`.tab[data-tab="${id}"]`);
  const pane = (id) => document.querySelector(`.pane[data-pane="${id}"]`);

  /* ---------- シナリオ ---------- */
  async function script(r) {
    const app = BS.app;
    const game = app.sampleGame();
    const find = (id) => game.events.find((e) => e.id === id);
    const noOf = (pid) => { for (const t of game.teams) { const p = t.players.find((x) => x.id === pid); if (p) return String(p.no); } return ''; };
    const autoPane = () => pane('auto');
    const btnIn = (root, text) => Array.from(root.querySelectorAll('button')).find((b) => b.textContent.includes(text));
    app.setRate(1);
    app.store.project.settings.autoPause = true;
    app.showTab('auto');
    app.tagger.setTeam(0);

    // 1. 動画を開く
    caption(1, '① 試合の動画を開く', 'スマホやビデオで撮った試合動画（MP4・MOV）を「🎬 動画を開く」か、ドラッグ&ドロップで読み込みます。このデモでは、1試合分のサンプル（合成映像）を使います。');
    await pointAt(r, $('#btnOpen'), { outline: true });
    await sleep(r, 1500);
    unoutline(r);

    // 2. 自動解析
    caption(2, '② 映像を自動で解析する', 'まず、試合で使う2つのゴールを映像の上でドラッグして教えます（最初の1回だけ。サンプルは指定済み）。カメラが動いても、ゴールを自動で追いかけます。');
    const jump = btnIn(autoPane(), '指定したコマへ');
    if (jump) { await click(r, jump); await sleep(r, 1700); }
    caption(2, '② 映像を自動で解析する', '「⚡ 自動解析を始める」を押すと、ボールがリングを通った（得点）・外れた（シュート失敗）を映像から見つけます。解析はこのパソコンの中だけで行います。デモでは最初の1分だけ解析します。');
    const runBtn = btnIn(autoPane(), '自動解析を始める');
    if (runBtn) {
      await pointAt(r, runBtn, { outline: true });
      const cur = $('#demoCursor');
      cur.classList.remove('click'); void cur.getBoundingClientRect(); cur.classList.add('click');
      await sleep(r, 300);
      unoutline(r);
    }
    check(r);
    const done = BS.uiAuto.run({ t1: AUTO_UNTIL, silent: true });
    await pointAt(r, $('#viewer'), { fx: 0.5, fy: 0.6 });
    while (BS.uiAuto.state.running) await sleep(r, 120);
    await done;
    check(r);
    const queue = BS.uiAuto.reviewQueue();
    const nShot = queue.filter((e) => e.type !== 'reb').length, nMade = queue.filter((e) => e.type !== 'reb' && e.made).length;
    caption(2, '② 映像を自動で解析する', nShot
      ? `シュート ${nShot} 本（うち得点 ${nMade} 本）を見つけました。どちらのチームか・外れた後のリバウンドの種類（推定）まで入っています。タイムラインの ⚡ が自動で付いたタグです。`
      : 'この環境では検出できませんでした（描画の違いによるものです）。このまま先へ進みます。');
    // 解析したのは最初の1分なので、タイムラインを拡大して見せる
    const zoomBtn = (z) => document.querySelector(`#tlHead .seg button[data-z="${z}"]`);
    await app.seek(20);
    if (zoomBtn('1m')) await click(r, zoomBtn('1m'));
    await pointAt(r, $('#timeline'), { fx: 0.3, fy: 0.8, outline: true });
    await sleep(r, 2600);
    unoutline(r);

    // 3. 確認モード（番号キーで「誰が」、コート図のクリックで「どこから」）
    if (nShot) {
      caption(3, '③ 「誰が・どこから」を入れる', '確認モードでは、見つけた場面が順に再生されます。背番号のキーを押し、コート図で打った場所をクリックします。得点ならアシストも続けて聞かれます（Enter で省略）。');
      const rv = btnIn(autoPane(), '確認モード');
      if (rv) await click(r, rv);
      // 正解（シミュレーション）から、その場面の選手を引く
      const truth = (ev) => {
        const same = (g) => (ev.type === 'reb' ? g.type === 'reb' : (g.type === 'shot' || g.type === 'ft'));
        let best = null;
        for (const g of game.events) { if (!same(g) || Math.abs(g.t - ev.t) > 2.5) continue; if (!best || Math.abs(g.t - ev.t) < Math.abs(best.t - ev.t)) best = g; }
        return best;
      };
      let shown = 0, fixed3 = false;
      while (BS.review.active && shown < 5) {
        check(r);
        const ev = BS.review.cur();
        if (!ev) break;
        const g = truth(ev);
        if (!g) { await press(r, 'Delete', '誤検出を消す'); shown++; continue; }
        await sleep(r, 1700);
        if (ev.team !== g.team) await press(r, 'Q', 'チーム切替');
        for (const d of noOf(g.pid)) await press(r, d, '背番号');
        // 番号が決まるのを待つ（「1」のように、10番台の最初の数字でもある番号は、2桁目を少し待ってから決まる）
        for (let k = 0; k < 14 && BS.review.active && BS.review.cur() && BS.review.cur().id === ev.id && !BS.review.cur().ok; k++) await sleep(r, 100);
        await sleep(r, 250);
        // 得点 → アシストを聞かれる
        if (app.tagger.state().flow && app.tagger.state().flow.kind === 'assist') {
          if (g.ast) { for (const d of noOf(g.ast)) await press(r, d, 'アシスト'); } else await press(r, 'Enter', '省略');
        }
        // シュートなら、コート図で打った場所をクリック（ここでは正解の位置）。2点か3点かは、場所から決まる
        const curEv = BS.review.active ? BS.review.cur() : null;
        if (curEv && curEv.id === ev.id && curEv.type === 'shot' && g.type === 'shot' && g.sx != null && BS.review.needLoc(curEv)) {
          if (g.pts === 3 && !fixed3) { caption(3, '③ 「誰が・どこから」を入れる', '3点ラインの外をクリックすると、3点シュートになります。フリースローは「F」、成功⇄失敗は「M」、違っていた検出は「Delete」で直せます。'); fixed3 = true; }
          const cv = $('#revCourt');
          const pt = BS.uiTag.reviewCourtPoint(g.sx, g.sy), rc = cv.getBoundingClientRect();
          await click(r, cv, { point: true, fx: (pt.x - rc.left) / rc.width, fy: (pt.y - rc.top) / rc.height });
        }
        shown++;
        await sleep(r, 700);
      }
      if (BS.review.active) { await press(r, 'Escape', '確認を終える'); }
      await sleep(r, 500);
    }

    // 4. 自動で拾えないプレーは、見ながら足す
    caption(4, '④ 足りないプレーは見ながら足す', 'アシスト・ターンオーバー・ファウルなど、映像からは拾えないプレーはキーで足せます。「背番号 → プレーのキー」の順。ここでは「1 5 → C」で #15 のファウル。');
    await click(r, tabBtn('tag'));
    const eF = find('g11'), eM = find('g10');
    await app.seek(eM.t - 1.6);
    app.play();
    caption(4, '④ 足りないプレーは見ながら足す', 'マウスでも入力できます。選手ボタン → プレーボタン → アシストの選手 → コート図（シュート位置）の順にクリック。');
    await waitTime(r, eM.t + 0.3);
    const chip = (pid) => document.querySelector(`.pl[data-pid="${pid}"]`);
    const court = () => $('#miniCourt');
    if (chip(eM.pid)) {
      await click(r, chip(eM.pid));
      await click(r, document.querySelector('.act[data-act="3m"]'));
      if (chip(eM.ast)) await click(r, chip(eM.ast));
      if (court()) await click(r, court(), { point: true, fx: eM.sx / 15, fy: eM.sy / 14.2 });
    }
    await sleep(r, 500);
    caption(4, '④ 足りないプレーは見ながら足す', 'キーボードなら「背番号 → プレーのキー」。ここでは「1 5 → C」で #15 のファウル（種類は番号で選択）。入力中は自動で一時停止します。');
    await app.seek(eF.t - 1.4);
    app.play();
    await waitTime(r, eF.t + 0.3);
    for (const d of noOf(eF.pid)) await press(r, d, '背番号');
    await press(r, 'C', 'ファウル');
    await press(r, '1', '通常');
    await press(r, 'Enter', '省略');
    await sleep(r, 700);
    app.pause();

    // 5. 1試合分
    caption(5, '⑤ 1試合分のタグがそろうと…', 'このサンプルには1試合分（約300件）のタグが入っています。ここから先の集計・ハイライト・アドバイスは、すべて自動です。');
    app.loadSampleEvents();
    if (zoomBtn('all')) await click(r, zoomBtn('all'));
    await pointAt(r, $('#timeline'), { fx: 0.5, fy: 0.5, outline: true });
    await sleep(r, 2200);
    unoutline(r);

    // 6. 集計
    caption(6, '⑥ 個人とチームの集計', 'ボックススコア（得点・リバウンド・アシスト・TO・ファウル…）、勝敗を分ける4つの要素（Four Factors）を自動で計算。数字をクリックすると、その場面だけを連続再生します。');
    await click(r, tabBtn('box'));
    await sleep(r, 900);
    const ff = pane('box').querySelector('.cmp');
    if (ff) { await pointAt(r, ff, { fx: 0.5, fy: 0.5, outline: true }); await sleep(r, 1600); unoutline(r); }
    const lnk = pane('box').querySelector('.tbl tbody tr td .lnk');
    if (lnk) {
      await click(r, lnk);
      await sleep(r, 5200);
      BS.uiHL.stop(true);
    }

    // 7. 場面別・ショット・ファウル
    caption(7, '⑦ 場面ごとの集計・ショット・ファウル', '速攻・セット・セカンドチャンス・TO後など「場面ごと」に1回の攻撃あたりの得点（PPP）を比較。ショットはゾーン別の成功率、ファウルはピリオドごとのチームファウルとファウルトラブルまで。');
    await click(r, tabBtn('scene'));
    await sleep(r, 1800);
    const bars = pane('scene').querySelector('.ppp-bars');
    if (bars) { await pointAt(r, bars, { fx: 0.4, fy: 0.3, outline: true }); await sleep(r, 1500); unoutline(r); }
    await click(r, tabBtn('shot'));
    await sleep(r, 1800);
    await click(r, tabBtn('foul'));
    await sleep(r, 1800);

    // 8. ハイライト
    caption(8, '⑧ ハイライトを自動で作る', '得点シーンを前後つきで自動カット。失点シーンは「攻撃の始まり」から切り出して原因別に分類。並べ替え・トリム・テロップを直して、動画ファイルに書き出せます。');
    await click(r, tabBtn('hl'));
    await sleep(r, 900);
    const playBtn = Array.from(pane('hl').querySelectorAll('button')).find((b) => b.textContent.includes('連続再生'));
    if (playBtn) { await click(r, playBtn); await sleep(r, 6500); }
    BS.uiHL.stop(true);
    const concede = pane('hl').querySelector('button[data-preset="concede"]');
    if (concede) { await click(r, concede); await sleep(r, 1400); }
    const causes = pane('hl').querySelector('.causes');
    if (causes) { await pointAt(r, causes, { fx: 0.3, fy: 0.5, outline: true }); await sleep(r, 1800); unoutline(r); }
    const exp = $('#btnExport');
    if (exp) { await pointAt(r, exp, { outline: true }); await sleep(r, 1400); unoutline(r); }

    // 9. アドバイス
    caption(9, '⑨ アドバイス', '数字から「優先して取り組むこと」を失点の大きい順に。根拠の数字・理由・練習メニュー・関連シーンの動画までセットで出します。選手ごとの良かった点・課題、相手の要注意選手も。');
    await click(r, tabBtn('adv'));
    await sleep(r, 1600);
    const card = pane('adv').querySelector('.adv');
    if (card) {
      await pointAt(r, card, { fx: 0.5, fy: 0.3, outline: true });
      await sleep(r, 1600);
      unoutline(r);
      const b = card.querySelector('.btn.primary');
      if (b) { await click(r, b); await sleep(r, 5200); BS.uiHL.stop(true); }
    }
    caption(0, 'デモはここまで。自由に操作できます', 'サンプル試合はそのまま触れます（数字をクリック、タブを切り替え、タグを追加…）。自分の動画は「🎬 動画を開く」→「⚡自動解析」から。キー操作の一覧は「?」キー。');
    await sleep(r, 5000);
  }

  function start() {
    stop('restart', true);
    const r = { id: ++runSeq, cancelled: false, outlined: [], timer: null };
    run = r;
    const L = layer();
    L.hidden = false;
    $('#demoKeys').innerHTML = '';
    const cur = $('#demoCursor');
    cur.style.transition = 'none';
    cur.style.left = (root.innerWidth / 2) + 'px'; cur.style.top = (root.innerHeight / 2) + 'px';
    void cur.getBoundingClientRect();
    cur.style.transition = '';
    BS.app.setRate(1);
    BS.app.openSample({ empty: true, at: 3 });
    BS.app.showTab('auto');
    caption(0, 'バスケ分析スタジオへようこそ', '試合の動画を読み込むと、映像から得点とシュート失敗を自動で見つけ、個人スタッツ・場面別の集計・ファウル・ハイライト動画・アドバイスまで作ります。これから自動デモで全機能をお見せします。');
    const onUser = (e) => {
      if (!e.isTrusted || !run) return;
      if (e.type === 'keydown' && /^(Shift|Control|Alt|Meta|CapsLock)$/.test(e.key)) return;
      stop('user', false, e);
    };
    r.listeners = ['pointerdown', 'keydown', 'wheel', 'touchstart'].map((ev) => { document.addEventListener(ev, onUser, { capture: true, passive: true }); return [ev, onUser]; });
    (async () => {
      try {
        await sleep(r, 2600);
        await script(r);
        finish(r, true);
      } catch (err) {
        if (!(err instanceof Cancelled)) { console.error('[demo]', err); finish(r, false); }
      }
    })();
  }

  function cleanup(r) {
    if (!r) return;
    r.cancelled = true;
    if (r.timer) clearTimeout(r.timer);
    (r.listeners || []).forEach(([ev, fn]) => document.removeEventListener(ev, fn, { capture: true }));
    unoutline(r);
  }
  function finish(r, completed) {
    if (run !== r) return;
    cleanup(r);
    run = null;
    layer().hidden = true;
    ensureData();
    if (completed) BS.ui.toast('デモが終わりました。自由に操作してください', 'ok', 4000, { label: 'もう一度', fn: () => start() });
  }
  function stop(why, silent, ev) {
    const r = run;
    if (!r) return;
    cleanup(r);
    run = null;
    layer().hidden = true;
    const app = BS.app;
    if (BS.uiAuto.state.running && why !== 'auto') BS.uiAuto.cancel();
    if (BS.review.active) BS.review.stop(true);
    if (why === 'user' || why === 'app') {
      ensureData();
      if (app.tagger.state().flow || app.tagger.busy()) app.tagger.reset();
      if (BS.uiHL.reelActive()) BS.uiHL.stop(true);
      // 操作を渡すので映像は止める（Space で止めた場合は Space 自身の再生/停止に任せる）
      if (!(ev && ev.type === 'keydown' && ev.code === 'Space')) app.pause();
    }
    if (!silent && why === 'user') BS.ui.toast('デモを止めました。自由に操作できます', 'ok', 5000, { label: '▶ デモをもう一度', fn: () => start() });
  }
  // デモ途中で止めても、サンプルの全タグがそろった状態にする
  function ensureData() {
    const app = BS.app;
    const P = app.store.project;
    if (P.source && P.source.kind === 'sample' && P.events.length < app.sampleGame().events.length * 0.5) {
      app.loadSampleEvents();
      BS.uiPlayer.flash('サンプル試合の全タグを読み込みました', 'info');
    }
  }

  BS.demo = { start, stop, running };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/app.js */
/* バスケ分析スタジオ — 起動・全体の組み立て（タブ・キーボード・再生制御・サンプル試合） */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h, $ } = BS.ui;

  const TABS = [
    { id: 'auto', label: '⚡自動解析' },
    { id: 'tag', label: 'タグ付け' },
    { id: 'box', label: '集計' },
    { id: 'scene', label: '場面別' },
    { id: 'shot', label: 'ショット' },
    { id: 'foul', label: 'ファウル' },
    { id: 'hl', label: 'ハイライト' },
    { id: 'adv', label: 'アドバイス' }
  ];

  const store = BS.createStore();
  let media = null;
  let sampleGame = null;
  let autoPaused = false;
  let renderTimer = null;

  const app = BS.app = {
    store, TABS, tab: 'tag', dataVersion: 0, reelVersion: 0,
    get media() { return media; },
    model: () => store.model(),
    time: () => (media ? media.time : 0),
    duration: () => (media ? media.duration : 0) || store.project.duration || store.model().duration || 0,
    paused: () => (media ? media.paused : true),
    play() { if (media) media.play(); },
    pause() { if (media) media.pause(); },
    toggle() { if (!media) return; if (media.paused) media.play(); else media.pause(); },
    seek(t, opts) {
      if (!media) return Promise.resolve();
      if (!(opts && opts.fromReel) && BS.uiHL.reelActive()) BS.uiHL.stop(true);
      return media.seek(BS.clamp(t, 0, app.duration()));
    },
    seekBy(d) { return app.seek(app.time() + d); },
    setRate(r) { if (media) media.rate = r; const s = $('#speedSel'); if (s) s.value = String(r); },
    reelClips: () => (app.tab === 'hl' ? BS.uiHL.clipsFor() : null),
    playReel: (clips, label) => BS.uiHL.playReel(clips, label),
    playEvents(events, label) {
      if (!events || !events.length) { BS.ui.toast('該当する場面がありません', 'warn'); return; }
      const clips = BS.clips.fromEvents(store.project, store.model(), events);
      BS.uiHL.playReel(clips, `${label}（${events.length}）`);
    },
    undo() { const l = store.undo(); if (l) { tagger.reset(); BS.ui.toast(`元に戻しました（${l}）`, 'ok'); } else BS.ui.toast('これ以上戻せません', 'warn'); },
    redo() { const l = store.redo(); if (l) BS.ui.toast(`やり直しました（${l}）`, 'ok'); },
    showTab, setMedia, openSample, tag, handleKey,
    stopDemo: (why) => { if (BS.demo && BS.demo.running()) BS.demo.stop(why || 'app'); }
  };

  /* ---------- タグ入力 ---------- */
  const tagger = app.tagger = BS.createTagger({
    project: () => store.project,
    now: () => app.time(),
    add: (evs) => { store.addEvents(evs, 'タグ'); setTimeout(() => evs.forEach((e) => BS.uiPlayer.flashRow(e.id)), 30); },
    update: (id, patch) => store.updateEvent(id, patch, 'タグ変更'),
    remove: (id) => store.removeEvent(id, 'タグ削除'),
    toast: (text, kind) => BS.uiPlayer.flash(text, kind),
    onCourt: (team, t) => BS.uiTag.onCourtAt(team, t),
    /* 名簿にない背番号が押されたとき：その番号の選手を名簿に足す（名簿を先に作らなくても始められるように）。足した選手の id を返す */
    addPlayer: (team, no) => {
      const P = store.project, T = P.teams[team];
      no = String(no);
      if (!T || !/^\d{1,2}$/.test(no)) return null;
      const hit = T.players.find((p) => String(p.no) === no);
      if (hit) return hit.id;
      let id = (team === 0 ? 'A' : 'B') + no;
      if (T.players.some((p) => p.id === id)) id = BS.uid(team === 0 ? 'A' : 'B');
      const players = T.players.concat([{ id, no, name: '', pos: '', starter: false }]).sort((a, b) => Number(a.no) - Number(b.no));
      store.updateMeta({ teams: P.teams.map((x, i) => (i === team ? Object.assign({}, x, { players }) : x)) });
      return id;
    }
  });
  tagger.on('change', () => {
    const busy = tagger.busy();
    const reviewing = BS.review && BS.review.active;
    if (store.project.settings.autoPause && media && !reviewing) {
      if (busy && !media.paused && !BS.uiHL.reelActive()) { media.pause(); autoPaused = true; }
      else if (!busy && autoPaused) { autoPaused = false; media.play(); }
    }
    if (!busy && media && media.paused === false) autoPaused = false;
    BS.uiTag.renderPrompt();
    BS.uiTag.renderRosters();
    if (reviewing) BS.review.onTagChange();
  });
  function tag(inp) {
    if (inp.k === 'team-set') { tagger.setTeam(inp.team); return; }
    if (inp.k === 'action') BS.uiTag.pressAction(inp.id);
    tagger.input(inp);
  }

  /* ---------- タブ ---------- */
  function buildTabs() {
    const nav = $('#tabs');
    TABS.forEach((t, i) => {
      nav.appendChild(h('button', { class: 'tab' + (t.id === app.tab ? ' on' : ''), role: 'tab', dataset: { tab: t.id }, title: `${t.label}（Alt+${i + 1}）`, onclick: () => showTab(t.id) }, t.label));
    });
  }
  function showTab(id) {
    if (!TABS.find((t) => t.id === id)) return;
    app.tab = id;
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === id));
    document.querySelectorAll('.pane').forEach((p) => { p.hidden = p.dataset.pane !== id; });
    renderTab(id);
    BS.uiAuto.onTab(id);           // 映像の上のゴールの枠などは、自動解析タブでだけ出す（ほかのタブに残さない）
    BS.uiTag.renderPrompt();       // 映像の上の案内は、タブによって出し分ける
    app.reelVersion++;
    BS.uiPlayer.drawTimeline();
    const tb = $('#tabbody');
    if (tb) tb.scrollTop = 0;
    // ページごと下へスクロールしていたら、切り替えたタブの先頭が見える位置へ戻す
    if (root.scrollY > 0 && root.scrollTo) root.scrollTo(0, 0);
  }
  function renderTab(id) {
    switch (id) {
      case 'auto': BS.uiAuto.render(); BS.uiAuto.drawOverlay(); break;
      case 'tag': BS.uiTag.onChange(); break;
      case 'box': BS.uiStats.renderBox(); break;
      case 'scene': BS.uiStats.renderScene(); break;
      case 'shot': BS.uiStats.renderShot(); break;
      case 'foul': BS.uiStats.renderFoul(); break;
      case 'hl': BS.uiHL.render(); break;
      case 'adv': BS.uiAdvice.render(); break;
      default: break;
    }
  }

  /* ---------- データが変わったとき ---------- */
  store.on('change', (ch) => {
    app.dataVersion++;
    tagger.validate();
    BS.uiHL.onData();
    BS.uiAuto.onData();
    if (ch.kind === 'load' || ch.kind === 'meta') {
      updateHeader();
      if (ch.kind === 'load') { tagger.reset(); tagger.setTeam(store.project.ourTeam || 0); }
    }
    BS.uiPlayer.onChange();
    if (BS.review && BS.review.active && !store.find(BS.review.id)) { /* 確認中のタグが消えた */ }
    if (renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(() => { renderTimer = null; renderTab(app.tab); if (app.tab !== 'tag') BS.uiTag.onChange(); }, 40);
  });
  function updateHeader() {
    const P = store.project;
    $('#projTitle').value = P.title || '';
    const b = $('#srcBadge');
    const src = P.source || {};
    if (src.kind === 'sample') { b.textContent = 'サンプル（合成映像）'; b.className = 'badge sample'; }
    else if (src.kind === 'video') { b.textContent = (media ? '🎬 ' : '⚠ 動画未接続：') + (src.name || '動画'); b.className = 'badge' + (media ? ' video' : ''); b.title = media ? '' : '同じ動画ファイルを「🎬 動画を開く」で開き直すと、タグと映像がつながります'; }
    else { b.textContent = '動画なし'; b.className = 'badge'; }
    document.title = (P.title ? P.title + ' - ' : '') + 'バスケ分析スタジオ';
  }

  /* ---------- 映像 ---------- */
  function setMedia(m) {
    if (BS.uiHL.reelActive()) BS.uiHL.stop(true);
    if (media && media !== m) media.destroy();
    media = m;
    autoPaused = false;
    BS.uiPlayer.mount(m);
    if (m) {
      m.on('time', (t) => { BS.uiPlayer.onTime(t); BS.uiHL.onTime(t); BS.uiTag.onTime(t); BS.uiAuto.onTime(t); });
      m.on('play', () => BS.uiPlayer.onTime(m.time));
      m.on('pause', () => BS.uiPlayer.onTime(m.time));
      m.on('ready', () => { BS.uiPlayer.onChange(); });
      m.on('notice', (msg) => BS.ui.toast(msg, 'warn', 7000));
      const s = $('#speedSel');
      if (s) m.rate = Number(s.value) || 1;
    }
    updateHeader();
  }

  /* ---------- サンプル試合 ---------- */
  function sampleProject(game, events, title) {
    const p = BS.newProject({
      id: 'sample', title: title || '練習試合 ブルーウィングス vs レッドホークス（サンプル）', date: '2026-09-27',
      source: { kind: 'sample', seed: game.seed }, teams: BS.deepCopy(game.teams), events: BS.deepCopy(events || []),
      periodMinutes: 8, duration: game.duration
    });
    p.persist = false;
    return p;
  }
  function openSample(opts) {
    opts = opts || {};
    if (!sampleGame) sampleGame = BS.sim.generate({});
    const m = BS.createSynthMedia(sampleGame);
    setMedia(m);
    const events = opts.keepEvents || (opts.empty ? [] : sampleGame.events);
    const p = sampleProject(sampleGame, events, opts.title);
    // サンプル映像はゴールの位置が分かっているので、自動解析の「ゴールを指定」は最初から入れておく
    // （画面左のゴール＝前半は相手チームが攻める側）
    const marks = [0, 1].map((side) => m.renderer.hoopMark(side));
    if (marks[0] && marks[1]) p.auto = { hoops: marks.map((mk, i) => ({ id: i ? 'B' : 'A', t: mk.t, box: mk.box, rim: mk.rim })), hoopTeam: [1, 0] };
    store.set(p, 'load');
    if (opts.at != null) m.seek(opts.at);
    return m;
  }
  app.sampleGame = () => { if (!sampleGame) sampleGame = BS.sim.generate({}); return sampleGame; };
  app.loadSampleEvents = () => { store.replaceEvents(BS.deepCopy(app.sampleGame().events), 'サンプルのタグ'); };

  /* ---------- キーボード ---------- */
  function handleKey(e) {
    if (e.defaultPrevented) return false;
    const t = e.target || document.body;
    // チェックボックス・ラジオは文字を打つ場所ではないので、キー操作を止めない（クリックで切り替えたあともフォーカスが残るので、
    // 「入力欄」扱いにすると、そのあと番号キーなどが効かなくなる）。フォーカスがあるときの Space は、ボタンと同じくブラウザに任せる（切り替え）
    const tick = t.tagName === 'INPUT' && /^(checkbox|radio)$/i.test(t.type || '');
    const editable = !tick && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || ''));
    if (BS.ui.modalOpen()) {
      if (e.key === 'Escape') { BS.ui.closeModal(); e.preventDefault && e.preventDefault(); }
      return false;
    }
    if (editable) { if (e.key === 'Escape' && t.blur) t.blur(); return false; }
    if (t.tagName === 'BUTTON' && (e.code === 'Enter' || e.code === 'Space') && e.isTrusted) return false;
    if (tick && e.code === 'Space' && e.isTrusted) return false;
    const pd = () => { if (e.preventDefault) e.preventDefault(); };
    if (BS.uiAuto.state.running) { if (e.code === 'Escape') { pd(); BS.uiAuto.cancel(); } return true; }
    if (BS.uiAuto.state.marking) {
      // ゴールを指定している間：Esc でやめる。板を囲む前なら、コマを探すキー（矢印・, .）は使える。ほかのキー（タグ付け・再生）は無効
      if (e.code === 'Escape') { pd(); BS.uiAuto.cancelMarking(); return true; }
      if (!(BS.uiAuto.state.marking.step === 0 && /^(ArrowLeft|ArrowRight|Comma|Period)$/.test(e.code))) { pd(); return true; }
    }
    if (BS.review.active && !(e.metaKey || e.ctrlKey || e.altKey) && BS.review.key(e)) { pd(); return true; }
    if ((e.metaKey || e.ctrlKey) && e.code === 'KeyZ') { pd(); if (e.shiftKey) app.redo(); else app.undo(); return true; }
    if ((e.metaKey || e.ctrlKey) && e.code === 'KeyY') { pd(); app.redo(); return true; }
    if (e.metaKey || e.ctrlKey) return false;
    if (e.altKey && /^Digit[1-8]$/.test(e.code)) { pd(); showTab(TABS[Number(e.code.slice(5)) - 1].id); return true; }
    if (e.key === '?' || (e.code === 'Slash' && e.shiftKey)) { pd(); BS.uiSetup.keysDialog(); return true; }
    switch (e.code) {
      case 'Space': pd(); app.toggle(); return true;
      case 'ArrowLeft': pd(); app.seekBy(e.shiftKey ? -10 : -2); return true;
      case 'ArrowRight': pd(); app.seekBy(e.shiftKey ? 10 : 2); return true;
      case 'Comma': pd(); if (media) { media.pause(); app.seekBy(-1 / 30); } return true;
      case 'Period': pd(); if (media) { media.pause(); app.seekBy(1 / 30); } return true;
      case 'Enter': case 'NumpadEnter': pd(); tag({ k: 'enter' }); return true;
      case 'Escape': pd(); if (BS.uiHL.reelActive() && !tagger.busy() && !tagger.state().flow) BS.uiHL.stop(); else tag({ k: 'esc' }); return true;
      case 'KeyQ': pd(); tag({ k: 'team' }); return true;
      default: break;
    }
    if (e.key === '[' || e.key === ']') {
      pd();
      const rates = [0.25, 0.5, 1, 1.5, 2, 4];
      const cur = media ? media.rate : 1;
      let i = rates.indexOf(cur); if (i < 0) i = 2;
      i = BS.clamp(i + (e.key === ']' ? 1 : -1), 0, rates.length - 1);
      app.setRate(rates[i]);
      BS.uiPlayer.flash(`再生速度 ${rates[i]}x`, 'info');
      return true;
    }
    const dm = /^(?:Digit|Numpad)(\d)$/.exec(e.code);
    if (dm && !e.altKey) { pd(); tag({ k: 'digit', d: dm[1] }); return true; }
    const act = BS.TAG_ACTIONS.find((a) => a.code === e.code);
    if (act && !e.altKey && !e.shiftKey) { pd(); tag({ k: 'action', id: act.id }); return true; }
    return false;
  }

  /* ---------- 起動 ---------- */
  function boot() {
    BS.uiPlayer.init(app);
    BS.uiTag.init(app);
    BS.uiStats.init(app);
    BS.uiHL.init(app);
    BS.uiAdvice.init(app);
    BS.uiSetup.init(app);
    BS.uiAuto.init(app);
    buildTabs();
    document.addEventListener('keydown', (e) => handleKey(e));
    // マウスでボタンを押したときにフォーカスが残らないように（Space で再生・停止するため）
    document.addEventListener('mousedown', (e) => { const b = e.target.closest && e.target.closest('button, .pl, .act'); if (b) e.preventDefault(); });
    $('#btnSample').addEventListener('click', () => { app.stopDemo('sample'); openSample({ at: 20 }); showTab('box'); BS.ui.toast('サンプル試合（1試合分のタグ付き）を開きました', 'ok'); });
    $('#btnDemo').addEventListener('click', () => {
      const P = store.project;
      if (P.source && P.source.kind === 'video') {
        BS.ui.modal({
          title: 'デモを再生しますか？', body: h('p', null, 'デモではサンプル試合に切り替わります。今の試合のタグはこのブラウザに保存されています。あとで同じ動画を「🎬 動画を開く」で開くと、続きから作業できます。'),
          buttons: [{ label: 'キャンセル' }, { label: 'デモを再生', cls: 'primary', onClick: () => { store.saveNow(); BS.demo.start(); } }]
        });
      } else BS.demo.start();
    });
    $('#btnWide').addEventListener('click', () => { document.body.classList.toggle('wide'); $('#btnWide').classList.toggle('on'); setTimeout(() => BS.uiPlayer.onChange(), 50); });
    const params = new URLSearchParams(root.location.search);
    const noDemo = params.has('nodemo');
    if (noDemo) {
      openSample({ at: Number(params.get('t') || 20) });
      showTab(params.get('tab') || 'tag');
    } else {
      BS.demo.start();
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
