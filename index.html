  }

  /* ---------- タグの編集 ---------- */
  function playerOptions(P, team, sel, allowNone) {
    const opts = [];
    if (allowNone) opts.push(h('option', { value: '' }, allowNone === true ? '（なし）' : allowNone));
    (P.teams[team] || { players: [] }).players.forEach((p) => opts.push(h('option', { value: p.id, selected: p.id === sel }, `#${p.no} ${p.name || ''}`)));
    return opts;
  }
  function editEvent(id) {
    const P = app.store.project;
    const e = P.events.find((x) => x.id === id);
    if (!e) return;
    const body = h('div');
    const f = {};
    const time = h('input', { type: 'number', step: 0.1, min: 0, value: e.t });
    body.append(h('div', { class: 'row' }, h('label', { class: 'field', style: { flex: 1 } }, '時刻（秒）', time),
      h('button', { class: 'btn small', onclick: () => { time.value = app.time().toFixed(2); } }, '今の再生位置にする'),
      h('button', { class: 'btn small', onclick: () => app.seek(Math.max(0, Number(time.value) - 2)) }, 'この時刻へ移動')));
    const hasTeam = e.team === 0 || e.team === 1;
    if (hasTeam && e.type !== 'period' && e.type !== 'mark') {
      f.team = h('select', null, [0, 1].map((tm) => h('option', { value: tm, selected: e.team === tm }, P.teams[tm].name)));
      body.append(h('label', { class: 'field' }, 'チーム', f.team));
    }
    const team = () => (f.team ? Number(f.team.value) : e.team);
    const refill = () => {
      if (f.pid) { f.pid.innerHTML = ''; playerOptions(P, team(), e.pid, e.type === 'reb' || e.type === 'to' ? '（チーム）' : false).forEach((o) => f.pid.appendChild(o)); }
      if (f.ast) { f.ast.innerHTML = ''; playerOptions(P, team(), e.ast, true).forEach((o) => f.ast.appendChild(o)); }
      ['blk', 'stl', 'drawn'].forEach((k) => { if (f[k]) { f[k].innerHTML = ''; playerOptions(P, 1 - team(), e[k], true).forEach((o) => f[k].appendChild(o)); } });
      ['out', 'in'].forEach((k) => { if (f[k]) { f[k].innerHTML = ''; playerOptions(P, team(), e[k], true).forEach((o) => f[k].appendChild(o)); } });
    };
    if (['shot', 'ft', 'reb', 'to', 'foul'].includes(e.type)) { f.pid = h('select'); body.append(h('label', { class: 'field' }, '選手', f.pid)); }
    if (e.type === 'shot') {
      f.made = h('select', null, h('option', { value: '1', selected: e.made }, '成功'), h('option', { value: '0', selected: !e.made }, '失敗'));
      f.pts = h('select', null, h('option', { value: '2', selected: e.pts === 2 }, '2P'), h('option', { value: '3', selected: e.pts === 3 }, '3P'));
      f.ast = h('select'); f.blk = h('select');
      f.play = h('select', null, h('option', { value: '' }, '（未分類）'), BS.PLAYS.map((p) => h('option', { value: p.id, selected: e.play === p.id }, p.label)));
      body.append(h('div', { class: 'grid2' }, h('label', { class: 'field' }, '結果', f.made), h('label', { class: 'field' }, '種類', f.pts)),
        h('div', { class: 'grid2' }, h('label', { class: 'field' }, 'アシスト', f.ast), h('label', { class: 'field' }, 'ブロック（相手）', f.blk)),
        h('label', { class: 'field' }, 'プレーの形（任意・場面別の集計に使う）', f.play));
      // シュートの位置：コート図をクリックして入れる／変える。クリックすると、2P／3P も場所に合わせて変わる（そのあと「種類」で直せる）
      f.loc = e.sx != null ? { sx: e.sx, sy: e.sy } : null;
      const locNote = h('div', { class: 'note' });
      const court = BS.uiTag.makeCourt({
        rot: BS.uiAuto.courtRot(e),
        onPick: (sx, sy) => { f.loc = { sx, sy }; f.pts.value = BS.shotZone(sx, sy).three ? '3' : '2'; drawLoc(); }
      });
      const clear = h('button', { class: 'btn small', onclick: () => { f.loc = null; drawLoc(); } }, '位置を消す');
      const drawLoc = () => {
        court.marks.innerHTML = f.loc ? BS.uiTag.markHTML({ sx: f.loc.sx, sy: f.loc.sy, made: f.made.value === '1' }, BS.ui.teamColor(P, team()), '1') : '';
        locNote.textContent = f.loc ? `位置：${BS.zoneLabel(BS.shotZone(f.loc.sx, f.loc.sy).zone)}（図をクリックで変更）` : '位置：なし（図をクリックで記録）';
        clear.hidden = !f.loc;
      };
      f.made.addEventListener('change', drawLoc);
      body.append(h('div', { class: 'editloc' }, h('div', { class: 'ec' }, court.svg), h('div', null, locNote, h('div', { class: 'note' }, '図の下が手前（カメラ側）。クリックすると、種類（2P／3P）も場所に合わせて変わります。'), clear)));
      drawLoc();
    }
    if (e.type === 'ft') { f.made = h('select', null, h('option', { value: '1', selected: e.made }, '成功'), h('option', { value: '0', selected: !e.made }, '失敗')); body.append(h('label', { class: 'field' }, '結果', f.made)); }
    if (e.type === 'reb') { f.off = h('select', null, h('option', { value: '1', selected: e.off }, 'オフェンス（OR）'), h('option', { value: '0', selected: !e.off }, 'ディフェンス（DR）')); body.append(h('label', { class: 'field' }, '種類', f.off)); }
    if (e.type === 'to') {
      f.kind = h('select', null, h('option', { value: '' }, '（未分類）'), BS.TO_KINDS.filter((k) => k.id !== 'offfoul').map((k) => h('option', { value: k.id, selected: e.kind === k.id }, k.label)));
      f.stl = h('select');
      body.append(h('div', { class: 'grid2' }, h('label', { class: 'field' }, 'TOの種類', f.kind), h('label', { class: 'field' }, 'スティール（相手）', f.stl)));
      f.play = h('select', null, h('option', { value: '' }, '（未分類）'), BS.PLAYS.map((p) => h('option', { value: p.id, selected: e.play === p.id }, p.label)));
      body.append(h('label', { class: 'field' }, 'プレーの形（任意）', f.play));
    }
    if (e.type === 'foul') {
      f.kind = h('select', null, BS.FOUL_KINDS.map((k) => h('option', { value: k.id, selected: (e.kind || 'P') === k.id }, k.label)));
      f.drawn = h('select');
      body.append(h('div', { class: 'grid2' }, h('label', { class: 'field' }, 'ファウルの種類', f.kind), h('label', { class: 'field' }, 'ファウルを受けた選手', f.drawn)));
    }
    if (e.type === 'sub') { f.out = h('select'); f.in = h('select'); body.append(h('div', { class: 'grid2' }, h('label', { class: 'field' }, 'OUT', f.out), h('label', { class: 'field' }, 'IN', f.in))); }
    if (e.type === 'period') { f.n = h('select', null, [1, 2, 3, 4, 5, 6].map((n) => h('option', { value: n, selected: e.n === n }, n > 4 ? '延長' + (n - 4) : n + 'Q'))); body.append(h('label', { class: 'field' }, 'ピリオド', f.n)); }
    if (e.type === 'mark') { f.text = h('textarea', { style: { minHeight: '80px', fontFamily: 'inherit' } }, e.text || ''); body.append(h('label', { class: 'field' }, 'メモ（ハイライトのテロップにも使えます）', f.text)); }
    if (f.team) f.team.addEventListener('change', refill);
    refill();
    BS.ui.modal({
      title: 'タグを編集：' + BS.clips.describe(P, e), body,
      buttons: [
        { label: '🗑 削除', cls: 'danger', onClick: () => { app.store.removeEvent(e.id, 'タグ削除'); BS.ui.toast('削除しました', 'warn', 4000, { label: '元に戻す', fn: () => app.undo() }); } },
        { label: 'キャンセル' },
        {
          label: '保存', cls: 'primary', onClick: () => {
            const patch = { t: Math.max(0, Number(time.value) || 0) };
            if (f.team) patch.team = Number(f.team.value);
            if (f.pid) patch.pid = f.pid.value || null;
            if (f.made) patch.made = f.made.value === '1';
            if (f.pts) patch.pts = Number(f.pts.value);
            if (f.ast) patch.ast = f.ast.value || null;
            if (f.blk) patch.blk = f.blk.value || null;
            if (f.play) patch.play = f.play.value || null;
            if (f.off) patch.off = f.off.value === '1';
            if (f.kind) patch.kind = f.kind.value || null;
            if (f.stl) patch.stl = f.stl.value || null;
            if (f.drawn) patch.drawn = f.drawn.value || null;
            if (f.out) patch.out = f.out.value || null;
            if (f.in) patch.in = f.in.value || null;
            if (f.n) patch.n = Number(f.n.value);
            if (f.text) patch.text = f.text.value;
            if (e.type === 'shot') { patch.sx = f.loc ? f.loc.sx : null; patch.sy = f.loc ? f.loc.sy : null; }
            if (patch.made === false) patch.ast = null;
            if (patch.made === true) patch.blk = null;
            app.store.updateEvent(e.id, patch, 'タグ編集');
            BS.ui.toast('保存しました', 'ok');
          }
        }]
    });
  }

  /* ---------- 印刷（レポート） ---------- */
  function printReport() {
    BS.uiStats.renderBox();
    BS.uiAdvice.render();
    const panes = document.querySelectorAll('.pane');
    const prev = Array.from(panes).map((p) => p.hidden);
    panes.forEach((p) => { p.hidden = !(p.dataset.pane === 'box' || p.dataset.pane === 'adv'); });
    const done = () => { panes.forEach((p, i) => { p.hidden = prev[i]; }); root.removeEventListener('afterprint', done); };

   ① ゴールを指定（映像の上でドラッグ） → ② 解析（映像を早送りしながら検出） → ③ 結果を確認（背番号を付ける）
   解析はすべてこのパソコンの中で行う（映像を外部に送らない）。 */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h, $ } = BS.ui;
  const V = BS.vision, A = BS.auto;

  let app = null;
  const S = { marking: null, running: null, lastResult: null, live: null, debug: false, lastLog: null, thumbs: [null, null], pid: null, openHow: null, openHalf: false, openSetup: false };
  const HOOP_LABEL = ['ゴールA', 'ゴールB'];

  function init(a) {
    app = a;
    const viewer = $('#viewer');
    const cv = h('canvas', { id: 'autoOverlay', style: { position: 'absolute', inset: '0', width: '100%', height: '100%', pointerEvents: 'none' } });
    viewer.appendChild(cv);
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    cv.addEventListener('pointerup', onUp);
    root.addEventListener('resize', drawOverlay);
  }
  function pane() { return document.querySelector('.pane[data-pane="auto"]'); }
  function cfg() {
    const P = app.store.project;
    if (!P.auto) P.auto = { hoops: [], hoopTeam: [P.ourTeam || 0, 1 - (P.ourTeam || 0)] };
    return P.auto;
  }

  /* ---------- 画面 ---------- */
  /* 指定のしかたの絵（左：板を囲む → 右：リングをなぞる） */
  const FIG = '<svg viewBox="0 0 330 122" role="img" aria-label="ゴールの指定のしかた：バックボードを囲み、次にリングの左端から右端までなぞる">' +
    '<defs><clipPath id="figClip2"><rect x="0" y="0" width="155" height="96" rx="8"/></clipPath></defs>' +
    '<g><rect x="0" y="0" width="155" height="96" rx="8" fill="#26334d"/>' +
    '<rect x="42" y="18" width="72" height="44" rx="2" fill="#e5e7eb" stroke="#94a3b8"/><rect x="66" y="38" width="24" height="18" fill="none" stroke="#64748b" stroke-width="2"/>' +
    '<ellipse cx="78" cy="65" rx="13" ry="3.5" fill="none" stroke="#f97316" stroke-width="3"/>' +
    '<path d="M66 67 L70 84 M73 69 L74 84 M83 69 L82 84 M90 67 L86 84 M70 84 L86 84" stroke="#e5e7eb" stroke-width="1" fill="none"/>' +
    '<rect x="35" y="11" width="86" height="57" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 4"/>' +
    '<circle cx="35" cy="11" r="4" fill="#fbbf24"/><path d="M121 68 l-10 -1 l6 -8 z" fill="#fbbf24"/>' +
    '<text x="77" y="114" text-anchor="middle" fill="#cbd5e1" font-size="11.5">① 板（バックボード）を囲む</text></g>' +
    '<path d="M159 48 l10 0 m-4 -4 l4 4 l-4 4" stroke="#94a3b8" stroke-width="2" fill="none"/>' +
    '<g transform="translate(175,0)"><rect x="0" y="0" width="155" height="96" rx="8" fill="#26334d"/>' +
    '<g clip-path="url(#figClip2)"><rect x="8" y="-40" width="139" height="72" rx="2" fill="#e5e7eb" stroke="#94a3b8"/><rect x="52" y="-6" width="52" height="34" fill="none" stroke="#64748b" stroke-width="3"/>' +
    '<ellipse cx="78" cy="46" rx="38" ry="9" fill="none" stroke="#f97316" stroke-width="5"/>' +
    '<path d="M42 50 L54 92 M58 54 L64 92 M78 55 L78 92 M98 54 L92 92 M114 50 L102 92 M50 72 L106 72" stroke="#e5e7eb" stroke-width="1.5" fill="none"/></g>' +
    '<path d="M40 46 L116 46" stroke="#fde047" stroke-width="3"/><circle cx="40" cy="46" r="4.5" fill="#fde047"/><path d="M116 46 l-9 -5 l0 10 z" fill="#fde047"/>' +
    '<text x="77" y="114" text-anchor="middle" fill="#cbd5e1" font-size="11.5">② リングの左端 → 右端をなぞる</text></g></svg>';
  function howTo(open) {
    const d = h('details', { class: 'card howto' },
      h('summary', null, 'ゴールの指定のしかた（2回ドラッグするだけ）'),
      h('div', { class: 'howfig', html: FIG }),
      h('ol', null,
        h('li', null, '映像の下の', h('b', null, 'タイムライン'), 'を動かして、ゴールが', h('b', null, '大きく・はっきり'), '映っている場面で止める'),
        h('li', null, '下の「このゴールを指定する」を押す'),
        h('li', null, h('b', null, 'バックボード（板）全体'), 'を、ドラッグで囲む'),
        h('li', null, '画面が拡大されるので、', h('b', null, 'リング（輪）の左端から右端まで'), 'ドラッグしてなぞる')),
      h('p', { class: 'note', style: { margin: '6px 0 0' } }, '板の前に選手やボールが重なっていない・ぶれていないコマが向いています。体育館にほかのコートのゴールが映っていても、この試合で使う2つだけを指定します（片方だけでも解析できます）。'));
    d.open = !!open;
    // 利用者が開け閉めしたら、その状態を覚えておく（toggle は、上で open を設定しただけでも届くので、見出しのクリックで見る）
    d.querySelector('summary').addEventListener('click', () => { S.openHow = !d.open; });
    return d;
  }
  /* 指定したゴールの小さな絵（確認用）。その場のコマから切り出すだけで、保存はしない */
  function makeThumb(i) {
    const m = cfg().hoops[i];
    if (!m || !app.media) return null;
    const W = app.media.width, H = app.media.height;
    const pad = Math.max(m.box.w, m.box.h) * 0.3;
    const x0 = Math.max(0, m.box.x - pad), y0 = Math.max(0, m.box.y - pad);
    const x1 = Math.min(W, m.box.x + m.box.w + pad), y1 = Math.min(H, Math.max(m.box.y + m.box.h, m.rim.cy + m.rim.w * 0.9) + pad);
    const sw = x1 - x0, sh = y1 - y0;
    if (sw < 4 || sh < 4) return null;
    const k = Math.min(190 / sw, 130 / sh);
    const cv = document.createElement('canvas');
    cv.width = Math.round(sw * k * 2); cv.height = Math.round(sh * k * 2);      // 2倍の画素で描いて半分で表示（にじみを減らす）
    cv.style.width = Math.round(sw * k) + 'px'; cv.style.height = Math.round(sh * k) + 'px';
    cv.className = 'hoopthumb';
    cv.title = 'このように指定されています（緑/紫の枠＝バックボード、黄色の線＝リング）';
    const g = cv.getContext('2d');
    try { g.drawImage(app.media.el, x0, y0, sw, sh, 0, 0, cv.width, cv.height); } catch (e) { return null; }
    const q = cv.width / sw;
    g.strokeStyle = i ? '#e879f9' : '#22c55e'; g.lineWidth = 3; g.strokeRect((m.box.x - x0) * q, (m.box.y - y0) * q, m.box.w * q, m.box.h * q);
    g.strokeStyle = '#fde047'; g.lineWidth = 4; g.beginPath(); g.moveTo((m.rim.cx - m.rim.w / 2 - x0) * q, (m.rim.cy - y0) * q); g.lineTo((m.rim.cx + m.rim.w / 2 - x0) * q, (m.rim.cy - y0) * q); g.stroke();
    return cv;
  }
  /* 後半（3Q）の開始位置。ここより後は、ゴールとチームの対応が入れ替わる */

    app.store.replaceEvents(evs, t != null ? '後半の開始' : '後半の開始を取り消し');
    BS.ui.toast(t != null ? `${BS.fmtTime(t)} から後半（3Q）にしました。ここより後は、ゴールとチームの対応が入れ替わります` : '後半の開始を取り消しました', 'ok', 5000);
  }

    if (!el) return;

    const c = cfg();
    if (S.pid !== P.id) { S.pid = P.id; S.thumbs = [null, null]; S.openHow = null; S.openSetup = false; }
    el.innerHTML = '';
    if (!app.media) {
      const src = P.source && P.source.kind === 'video' ? P.source.name : '';
      el.append(h('div', { class: 'card note' }, src

        : '動画を開くと、映像から得点・シュート失敗を自動で検出できます。'));
      return;
    }
    const nMark = c.hoops.filter(Boolean).length;
    const autos = M.events.filter((e) => e.auto);
    const stage = S.running ? 2 : autos.length ? 3 : nMark >= 1 ? 2 : 1;
    el.append(h('p', { class: 'note', style: { marginTop: 0 } }, '映像を解析して、ボールがリングを通った（得点）・外れた（シュート失敗）を自動で見つけます。解析はこのパソコンの中だけで行います。 ',
      h('a', { href: '#', onclick: (e) => { e.preventDefault(); BS.uiSetup.helpDialog(); } }, 'くわしい使い方')));
    el.append(h('div', { class: 'steps' }, [['1', 'ゴールを教える'], ['2', '解析する'], ['3', '結果を見る・直す']].map(([n, lab], i) =>
      h('span', { class: 'step' + (stage === i + 1 ? ' on' : stage > i + 1 ? ' done' : '') }, h('b', null, stage > i + 1 ? '✓' : n), lab))));

    // ①②③ を別々に組み立てて、最後に並べる（結果があるときは ③ を先に見せる）
    const secGoal = [], secRun = [], secRes = [];

    // ① ゴール

    if (S.marking) {
      secGoal.push(h('div', { class: 'card markcard', style: { borderColor: 'var(--warn)', marginBottom: '8px' } },
        h('b', null, `${HOOP_LABEL[S.marking.i]} を指定中：`),
        S.marking.step === 0 ? ' ① 映像の上で、バックボード（板）全体をドラッグで囲んでください。' : ' ② 次に、リング（輪）の左端から右端まで、ぴったりなぞってください（ここがずれると精度が落ちます）。',
        h('div', { class: 'row', style: { marginTop: '6px' } },
          S.marking.step === 1 ? h('button', { class: 'btn small', onclick: () => { S.marking.step = 0; S.marking.box = null; S.marking.view = null; render(); drawOverlay(); } }, '囲み直す') : null,
          h('button', { class: 'btn small', onclick: () => cancelMarking() }, 'やめる'),
          h('span', { class: 'note' }, 'Esc でもやめられます'))));
    }
    secGoal.push(howTo(S.openHow != null ? S.openHow : nMark < 2));
    const list = h('div', { class: 'advcards' });
    [0, 1].forEach((i) => {
      const m = c.hoops[i];
      const teamSel = h('select', { onchange: (e) => { c.hoopTeam[i] = Number(e.target.value); c.hoopTeam[1 - i] = 1 - c.hoopTeam[i]; app.store.updateMeta({ auto: c }); } },
        [0, 1].map((tm) => h('option', { value: tm, selected: c.hoopTeam[i] === tm }, P.teams[tm].name)));
      list.append(h('div', { class: 'adv' + (m ? ' good' : '') },
        h('div', { class: 'ah' }, h('b', null, HOOP_LABEL[i]), m ? h('span', { class: 'note' }, `✓ 指定済み（${BS.fmtTime(m.t)} のコマ）`) : h('span', { class: 'note' }, '未指定')),
        h('div', { class: 'row', style: { marginTop: '6px' } },
          h('button', { class: 'btn small ' + (m ? '' : 'primary'), disabled: !!S.running, onclick: () => startMarking(i) }, m ? '指定し直す' : 'このゴールを指定する'),
          m ? h('button', { class: 'btn small', onclick: () => { app.seek(m.t).then(() => { S.thumbs[i] = makeThumb(i) || S.thumbs[i]; render(); }); } }, '指定したコマへ') : null,
          h('label', { class: 'note', title: 'このゴールに入ったシュートを、どちらのチームの得点にするか。解析のあとで変えても、まだ確認していない自動タグにすぐ反映されます' }, 'このゴールで得点するチーム（前半） ', teamSel)),
        m && S.thumbs[i] ? h('div', { class: 'thumbrow' }, S.thumbs[i], h('span', { class: 'note' }, '枠＝バックボード、黄色の線＝リング。ずれていたら「指定し直す」')) : null));
    });
    secGoal.push(list);
    {
      const p3 = M.events.find((e) => e.type === 'period' && (e.n || 0) === 3);
      const d = h('details', { class: 'note', style: { marginTop: '8px' } },
        h('summary', null, p3 ? `後半（3Q）の開始：${BS.fmtTime(p3.t)}（ここより後は、ゴールとチームの対応が入れ替わります）` : 'ハーフタイムで攻めるゴールが入れ替わる試合のとき'),
        h('div', { class: 'row', style: { marginTop: '6px' } },
          p3 ? null : h('span', null, '後半が始まる場面で止めて →'),
          h('button', { class: 'btn small', onclick: () => setHalf(app.time()) }, p3 ? 'いまの位置を後半の開始にする' : 'ここから後半（3Q）にする'),
          p3 ? h('button', { class: 'btn small', onclick: () => setHalf(null) }, '取り消す') : null),
        h('div', { style: { marginTop: '4px' } }, 'まだ確認していない自動タグのチームは、すぐに付け直されます（解析のやり直しは不要）。'));
      d.open = !!S.openHalf;
      d.querySelector('summary').addEventListener('click', () => { S.openHalf = !d.open; });
      secGoal.push(d);
    }

    // ② 解析
    const ready = nMark >= 1;
    secRun.push(h('h3', null, '② 解析する'));
    if (S.running) {
      secRun.push(h('div', { class: 'card' },
        h('b', null, '解析中… '), h('span', { id: 'autoLabel', class: 'note' }, ''),
        h('div', { class: 'progress' }, h('i', { id: 'autoBar' })),
        h('div', { class: 'note', id: 'autoLive' }, ''),
        h('p', { class: 'note' }, '動画のすべての区間を順に調べています。終わるまでこのページは開いたままにしてください（ほかのタブを見ていても、解析は続きます）。'),
        h('button', { class: 'btn small danger', onclick: () => cancelRun() }, '中止')));
    } else {
      secRun.push(h('div', { class: 'row' },
        h('button', { class: 'btn primary', disabled: !ready, onclick: () => run() }, autos.length ? '⚡ もう一度解析する' : '⚡ 自動解析を始める'),
        h('span', { class: 'note' }, ready ? `動画 ${BS.fmtTime(app.duration())} → 目安 ${BS.fmtTime(app.duration() / (app.media.kind === 'synth' ? 4.5 : 3))}（パソコンの速さで変わります）${nMark === 1 ? '。ゴールが1つだけなので、もう片方のシュートは検出されません' : ''}` : '先に ① でゴールを1つ以上指定してください')));
      if (autos.length) secRun.push(h('p', { class: 'note', style: { margin: '4px 0 0' } }, 'やり直しても、確認モードで選手を入れたタグは残ります（まだ確認していない自動タグだけが置き換わります）。'));
    }

    // ③ 結果
    if (autos.length) {
      const shots = autos.filter((e) => e.type === 'shot' || e.type === 'ft');
      const made = shots.filter((e) => e.made).length;
      const todo = reviewQueue().length;
      const rebTodo = M.events.filter((e) => e.auto && !e.ok && e.type === 'reb').length;
      const locTodo = locQueue().length;
      const tn = (tm) => P.teams[tm].name;
      secRes.push(h('h3', null, '③ 結果を見る・直す'),
        h('div', { class: 'kpis' },
          h('div', { class: 'kpi' }, h('small', null, '自動検出したシュート'), h('b', null, shots.length)),
          h('div', { class: 'kpi' }, h('small', null, 'うち成功（得点）'), h('b', null, made)),
          h('div', { class: 'kpi' }, h('small', null, '選手が未確認'), h('b', null, todo)),
          h('div', { class: 'kpi' }, h('small', null, `スコア（${P.teams[0].short} - ${P.teams[1].short}）`), h('b', null, `${M.score[0]} - ${M.score[1]}`))),
        h('div', { class: 'row', style: { marginTop: '10px' } },
          h('button', { class: 'btn good', disabled: !todo, onclick: () => review.start() }, `▶ 確認モード（残り ${todo} 件）`),
          locTodo ? h('button', { class: 'btn', id: 'btnLocOnly', title: '選手はもう入っていて、場所がまだのシュートを順に再生します。コート図をクリックするだけです', onclick: () => review.start('loc') }, `📍 場所だけ入れる（${locTodo} 本）`) : null,
          h('button', { class: 'btn', onclick: () => { app.showTab('hl'); } }, '🎬 ハイライトを見る'),
          h('button', { class: 'btn', onclick: () => { app.showTab('box'); } }, '📊 集計を見る')),
        h('label', { class: 'note switch', style: { display: 'block', marginTop: '6px' } },

          ` リバウンド（推定）も確認モードで聞く${rebTodo ? `（${rebTodo} 件）` : ''}。外すと、シュートだけを順に確認します`),
        h('label', { class: 'note switch', style: { display: 'block', marginTop: '4px' } },
          h('input', { type: 'checkbox', id: 'optReviewLoc', checked: c.reviewLoc !== false, onchange: (e) => setReviewLoc(e.target.checked) }),
          ' シュートの場所も確認モードで入れる（コート図を1クリック。2点／3点は場所から自動で決まり、個人ごとのショット図が出ます）'),
        h('div', { class: 'row note', style: { marginTop: '6px' } },

      const d = h('details', { class: 'setupfold' }, h('summary', null, '① ゴールの指定・② 解析のやり直し（変えるときは、ここを開く）'), ...secGoal, ...secRun);
