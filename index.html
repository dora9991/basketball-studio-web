<script>
/* js/model.js */
/* バスケ分析スタジオ — 集計エンジン
   タグ（イベント）の列から、ボックススコア・ポゼッション・場面別・Four Factors・
   ショットゾーン・ファウル・ラインナップ・ランなどをまとめて計算する。DOM 非依存。 */
(function (root) {
  'use strict';
  const BS = root.BS;

  const OFF_TYPES = new Set(['shot', 'ft', 'reb', 'to', 'foul']);

  function emptyBox() {
    return {
      pts: 0, fgm: 0, fga: 0, p2m: 0, p2a: 0, p3m: 0, p3a: 0, ftm: 0, fta: 0,
      or: 0, dr: 0, reb: 0, ast: 0, stl: 0, blk: 0, tov: 0, pf: 0, fd: 0,
      pm: 0, sec: 0, min: 0, eff: 0, gmsc: 0, tsp: null, efg: null
    };
  }
  function finishBox(b) {
    b.reb = b.or + b.dr;
    b.eff = b.pts + b.reb + b.ast + b.stl + b.blk - (b.fga - b.fgm) - (b.fta - b.ftm) - b.tov;
    b.gmsc = BS.round(b.pts + 0.4 * b.fgm - 0.7 * b.fga - 0.4 * (b.fta - b.ftm) + 0.7 * b.or + 0.3 * b.dr + b.stl + 0.7 * b.ast + 0.7 * b.blk - 0.4 * b.pf - b.tov, 1);
    const tsa = b.fga + 0.44 * b.fta;
    b.tsp = tsa > 0 ? b.pts / (2 * tsa) : null;
    b.efg = b.fga > 0 ? (b.fgm + 0.5 * b.p3m) / b.fga : null;
    return b;
  }
  function zoneBox() {
    const z = {};
    BS.ZONES.forEach((it) => { z[it.id] = { fga: 0, fgm: 0, pts: 0 }; });
    z.none = { fga: 0, fgm: 0, pts: 0 };
    return z;
  }

  function sortEvents(events) {
    return events.map((e, i) => ({ e, i })).sort((a, b) => (a.e.t - b.e.t) || (a.i - b.i)).map((x) => x.e);
  }

  function compute(project) {
    const teams = project.teams;
    const duration = project.duration || 0;
    const periodMin = project.periodMinutes || 10;
    const events = sortEvents(project.events || []);
    const players = {};
    teams.forEach((t) => t.players.forEach((p) => { players[p.id] = { id: p.id, team: t.id, no: p.no, name: p.name, pos: p.pos || '', starter: !!p.starter, box: emptyBox(), zones: zoneBox(), scene: {}, play: {}, fouls: [] }; }));

    /* ---------- ピリオド ---------- */
    const periods = [];
    let curP = null;
    for (const e of events) {
      if (e.type === 'period') {
        if (curP) curP.t1 = e.t;
        curP = { n: e.n || periods.length + 1, t0: e.t, t1: null };
        periods.push(curP);
      }
    }
    if (!periods.length) periods.push({ n: 1, t0: 0, t1: null });
    else if (periods[0].t0 > 0.5) {
      if (periods[0].n > 1) periods.unshift({ n: periods[0].n - 1, t0: 0, t1: periods[0].t0 });
      else periods[0].t0 = 0;
    }
    periods.forEach((p, i) => { if (p.t1 == null) p.t1 = i + 1 < periods.length ? periods[i + 1].t0 : Math.max(duration, lastT(events), p.t0 + 1); });
    function periodAt(t) {
      for (let i = periods.length - 1; i >= 0; i--) if (t >= periods[i].t0) return periods[i].n;
      return periods[0].n;
    }
    events.forEach((e) => { e._per = periodAt(e.t); });

    /* ---------- ボックススコア ---------- */
    const team = [0, 1].map(() => ({ box: emptyBox(), un: emptyBox(), unCount: 0, zones: zoneBox(), teamReb: 0, teamTov: 0, foulsByPer: {}, foulKinds: {}, toKinds: {}, fouls: [] }));
    const P = (pid) => (pid && players[pid]) ? players[pid] : null;
    for (const e of events) {
      const T = team[e.team] || null;
      const pl = P(e.pid);
      // 自動検出で、まだ選手を確認していないもの
      const unassigned = !!(T && !pl && e.auto);
      if (unassigned) {
        T.unCount++;
        const u = T.un;
        if (e.type === 'shot') { u.fga++; if (e.pts === 3) u.p3a++; else u.p2a++; if (e.made) { u.fgm++; u.pts += e.pts; if (e.pts === 3) u.p3m++; else u.p2m++; } }
        else if (e.type === 'ft') { u.fta++; if (e.made) { u.ftm++; u.pts++; } }
        else if (e.type === 'reb') { if (e.off) u.or++; else u.dr++; }
        else if (e.type === 'to') u.tov++;
      }
      if (e.type === 'shot') {
        const three = e.pts === 3;
        const zone = (e.sx != null && e.sy != null) ? BS.shotZone(e.sx, e.sy).zone : 'none';
        e._zone = zone;
        [T && T.box, pl && pl.box].forEach((b) => {
          if (!b) return;
          b.fga++; if (three) b.p3a++; else b.p2a++;
          if (e.made) { b.fgm++; b.pts += e.pts; if (three) b.p3m++; else b.p2m++; }
        });
        [T && T.zones, pl && pl.zones].forEach((z) => {
          if (!z) return;
          z[zone].fga++; if (e.made) { z[zone].fgm++; z[zone].pts += e.pts; }
        });
        if (e.made && e.ast && P(e.ast)) { P(e.ast).box.ast++; if (T) T.box.ast++; }
        else if (e.made && e.ast && T) T.box.ast++;
        if (e.blk) { if (P(e.blk)) P(e.blk).box.blk++; const DT = team[1 - e.team]; if (DT) DT.box.blk++; }
      } else if (e.type === 'ft') {
        [T && T.box, pl && pl.box].forEach((b) => { if (!b) return; b.fta++; if (e.made) { b.ftm++; b.pts++; } });
      } else if (e.type === 'reb') {
        [T && T.box, pl && pl.box].forEach((b) => { if (!b) return; if (e.off) b.or++; else b.dr++; });
        if (!pl && T && !unassigned) T.teamReb++;
      } else if (e.type === 'to') {
        [T && T.box, pl && pl.box].forEach((b) => { if (b) b.tov++; });
        if (!pl && T && !unassigned) T.teamTov++;
        if (T) T.toKinds[e.kind || 'none'] = (T.toKinds[e.kind || 'none'] || 0) + 1;
        if (e.stl) { if (P(e.stl)) P(e.stl).box.stl++; const DT = team[1 - e.team]; if (DT) DT.box.stl++; }
      } else if (e.type === 'foul') {
        [T && T.box, pl && pl.box].forEach((b) => { if (b) b.pf++; });
        if (e.kind === 'O') {
          [T && T.box, pl && pl.box].forEach((b) => { if (b) b.tov++; });
          if (T) T.toKinds.offfoul = (T.toKinds.offfoul || 0) + 1;
        }
        if (T) {
          T.foulsByPer[e._per] = (T.foulsByPer[e._per] || 0) + 1;
          T.foulKinds[e.kind || 'P'] = (T.foulKinds[e.kind || 'P'] || 0) + 1;
          T.fouls.push(e);
        }
        if (pl) pl.fouls.push(e);
        if (e.drawn && P(e.drawn)) P(e.drawn).box.fd++;
        if (e.drawn && team[1 - e.team]) team[1 - e.team].box.fd++;
      }
    }

    /* ---------- 得点の流れ・リード・ラン ---------- */
    const flow = [{ t: 0, s: [0, 0] }];
    const scoring = [];
    const s = [0, 0];
    for (const e of events) {
      let pts = 0;
      if (e.type === 'shot' && e.made) pts = e.pts;
      if (e.type === 'ft' && e.made) pts = 1;
      if (!pts || (e.team !== 0 && e.team !== 1)) continue;
      s[e.team] += pts;
      flow.push({ t: e.t, s: s.slice(), team: e.team, pts, ev: e });
      scoring.push({ t: e.t, team: e.team, pts, ev: e, s: s.slice() });
    }
    let leadChanges = 0, ties = 0, lastLeader = 0;
    const biggest = [0, 0];
    for (const f of flow.slice(1)) {
      const m = f.s[0] - f.s[1];
      const leader = m > 0 ? 1 : m < 0 ? -1 : 0;
      if (leader === 0) ties++;
      if (leader !== 0 && lastLeader !== 0 && leader !== lastLeader) leadChanges++;
      if (leader !== 0) lastLeader = leader;
      if (m > biggest[0]) biggest[0] = m;
      if (-m > biggest[1]) biggest[1] = -m;
    }
    const runs = [];
    let run = null;
    for (const sc of scoring) {
      if (run && run.team === sc.team) { run.pts += sc.pts; run.t1 = sc.t; run.evs.push(sc.ev); }
      else {
        if (run && run.pts >= 7) runs.push(run);
        run = { team: sc.team, pts: sc.pts, t0: sc.t, t1: sc.t, evs: [sc.ev], startScore: [sc.s[0] - (sc.team === 0 ? sc.pts : 0), sc.s[1] - (sc.team === 1 ? sc.pts : 0)] };
      }
    }
    if (run && run.pts >= 7) runs.push(run);

    /* ---------- ポゼッション ---------- */
    const poss = [];
    let cur = null;
    let lastEnd = { t: 0, type: 'period', team: -1 };
    const open = (tm, t0, startType) => {
      cur = { team: tm, t0, t1: t0, startType, evs: [], pts: 0, fga: 0, fgm: 0, p3a: 0, p3m: 0, fta: 0, ftm: 0, tov: 0, or: 0, ptsAfterOR: 0, firstAct: null, pending: null, play: null, id: poss.length };
    };
    const close = (endType, t) => {
      if (!cur) return;
      cur.endType = cur.endType || endType;
      const lt = cur.lastT != null ? cur.lastT : cur.t0;
      cur.t1 = Math.max(lt, Math.min(t != null ? t : lt, lt + (cur.endType === 'made' ? 2 : 1)));
      poss.push(cur);
      lastEnd = { t: cur.lastT != null ? cur.lastT : cur.t1, type: cur.endType, team: cur.team, stl: cur.stl };
      cur = null;
    };
    const startFrom = (le) => {
      if (!le) return 'unknown';
      if (le.type === 'made') return 'after-make';
      if (le.type === 'to') return le.stl ? 'steal' : 'dead-to';
      if (le.type === 'period') return 'period';
      if (le.type === 'miss') return 'dreb';
      return 'unknown';
    };
    for (const e of events) {
      if (e.type === 'period') { close(cur && cur.pending === 'made' ? 'made' : 'period', e.t); lastEnd = { t: e.t, type: 'period', team: -1 }; continue; }
      if (!OFF_TYPES.has(e.type)) continue;
      if (e.team !== 0 && e.team !== 1) continue;
      if (e.type === 'foul' && e.kind === 'T') { if (cur) cur.evs.push(e); continue; }
      if (e.type === 'reb' && !e.off) {
        if (cur && cur.team !== e.team) close(cur.pending === 'made' ? 'made' : 'miss', e.t);
        else if (cur) close(cur.pending === 'made' ? 'made' : 'unknown', e.t);
        open(e.team, e.t, 'dreb');
        cur.evs.push(e); cur.lastT = e.t; e._poss = cur.id;
        continue;
      }
      const off = e.type === 'foul' ? (e.kind === 'O' ? e.team : 1 - e.team) : e.team;
      if (cur && cur.team === off && cur.pending) {
        const andOne = (e.type === 'ft') || (e.type === 'foul' && e.kind !== 'O');
        if (!andOne) { close(cur.pending, e.t); }
      }
      if (!cur || cur.team !== off) {
        if (cur) close(cur.pending || 'unknown', e.t);
        const gap = e.t - lastEnd.t;
        const t0 = (lastEnd && gap >= 0 && gap < 40) ? lastEnd.t : Math.max(0, e.t - 4);
        let st = startFrom(lastEnd);
        if (lastEnd.team === off && st !== 'period') st = 'unknown';
        open(off, t0, st);
      }
      cur.evs.push(e); cur.t1 = e.t; cur.lastT = e.t; e._poss = cur.id;
      if (e.type === 'shot') {
        cur.fga++; if (e.pts === 3) cur.p3a++;
        if (cur.firstAct == null) cur.firstAct = e.t;
        if (e.play) { if (!cur.firstPlay) cur.firstPlay = e.play; cur.play = e.play; }
        if (e.made) {
          cur.fgm++; cur.pts += e.pts; if (e.pts === 3) cur.p3m++;
          if (cur.or > 0) cur.ptsAfterOR += e.pts;
          cur.pending = 'made';
        } else cur.pending = null;
      } else if (e.type === 'ft') {
        cur.fta++;
        if (cur.firstAct == null) cur.firstAct = e.t;
        if (e.made) { cur.ftm++; cur.pts++; if (cur.or > 0) cur.ptsAfterOR++; cur.pending = 'made'; }
        else if (!(e.n && e.of && e.n < e.of)) cur.pending = null;
      } else if (e.type === 'reb') {
        cur.or++; cur.pending = null;
      } else if (e.type === 'to' || (e.type === 'foul' && e.kind === 'O')) {
        cur.tov++;
        if (cur.firstAct == null) cur.firstAct = e.t;
        if (e.play) { if (!cur.firstPlay) cur.firstPlay = e.play; cur.play = e.play; }
        cur.stl = e.type === 'to' && !!e.stl;
        cur.endType = 'to';
        close('to', e.t);
      } else if (e.type === 'foul') {
        if (cur.firstAct == null && e.kind === 'S') cur.firstAct = e.t;
      }
    }
    close(cur && cur.pending ? cur.pending : 'period', cur ? cur.t1 : 0);
    poss.forEach((p) => {
      // プレータイプのタグがあればそれを優先。なければ「リバウンド/スティールから7.5秒以内に最初のシュート・TO」を速攻とみなす
      if (p.firstPlay) p.transition = p.firstPlay === 'transition';
      else {
        p.transition = (p.startType === 'dreb' || p.startType === 'steal') && p.firstAct != null && (p.firstAct - p.t0) <= 7.5;
        if (p.transition) p.play = 'transition';
      }
      p.offTO = p.startType === 'steal' || p.startType === 'dead-to';
      p.scene = p.transition ? 'transition' : 'half';
    });

    /* ---------- 場面別（チームごと・攻撃側で集計） ---------- */
    function sceneAgg(filterFn) {
      const out = [0, 1].map(() => ({ poss: 0, pts: 0, fga: 0, fgm: 0, p3a: 0, p3m: 0, fta: 0, ftm: 0, tov: 0, ids: [] }));
      for (const p of poss) {
        if (!filterFn(p)) continue;
        const o = out[p.team];
        o.poss++; o.pts += p.pts; o.fga += p.fga; o.fgm += p.fgm; o.p3a += p.p3a; o.p3m += p.p3m; o.fta += p.fta; o.ftm += p.ftm; o.tov += p.tov;
        o.ids.push(p.id);
      }
      out.forEach((o) => { o.ppp = o.poss ? o.pts / o.poss : null; o.efg = o.fga ? (o.fgm + 0.5 * o.p3m) / o.fga : null; o.tovp = o.poss ? o.tov / o.poss : null; });
      return out;
    }
    const scenes = {
      all: sceneAgg(() => true),
      transition: sceneAgg((p) => p.transition),
      half: sceneAgg((p) => !p.transition),
      afterDreb: sceneAgg((p) => p.startType === 'dreb'),
      afterSteal: sceneAgg((p) => p.startType === 'steal'),
      afterMake: sceneAgg((p) => p.startType === 'after-make'),
      afterDead: sceneAgg((p) => p.startType === 'dead-to'),
      second: sceneAgg((p) => p.or > 0),
      offTO: sceneAgg((p) => p.offTO)
    };
    const plays = {};
    BS.PLAYS.forEach((pl) => { plays[pl.id] = sceneAgg((p) => (p.play || 'other') === pl.id && (p.fga + p.fta + p.tov) > 0); });

    /* 得点の内訳（NBA のボックスにある Scoring breakdown） */
    const breakdown = [0, 1].map((tm) => {
      let paint = 0, second = 0, fast = 0, offTO = 0, bench = 0;
      for (const p of poss) {
        if (p.team !== tm) continue;
        second += p.ptsAfterOR;
        if (p.transition) fast += p.pts;
        if (p.offTO) offTO += p.pts;
      }
      for (const e of events) {
        if (e.team !== tm) continue;
        if (e.type === 'shot' && e.made && (e._zone === 'rim' || e._zone === 'paint')) paint += e.pts;
        const pl = P(e.pid);
        if (pl && !pl.starter && ((e.type === 'shot' && e.made) || (e.type === 'ft' && e.made))) bench += e.type === 'shot' ? e.pts : 1;
      }
      return { paint, second, fast, offTO, bench, biggestLead: biggest[tm] };
    });

    /* 選手 × 場面 */
    const possById = {};
    poss.forEach((p) => { possById[p.id] = p; });
    for (const e of events) {
      const pl = P(e.pid);
      if (!pl || e._poss == null) continue;
      const p = possById[e._poss];
      if (!p) continue;
      const keys = [p.scene];
      if (p.or > 0 && e.t >= firstORTime(p)) keys.push('second');
      if (p.offTO) keys.push('offTO');
      for (const k of keys) {
        const sc = pl.scene[k] || (pl.scene[k] = { fga: 0, fgm: 0, pts: 0, tov: 0, fta: 0, ftm: 0 });
        if (e.type === 'shot') { sc.fga++; if (e.made) { sc.fgm++; sc.pts += e.pts; } }
        if (e.type === 'ft') { sc.fta++; if (e.made) { sc.ftm++; sc.pts++; } }
        if (e.type === 'to' || (e.type === 'foul' && e.kind === 'O')) sc.tov++;
      }
      if (e.type === 'shot' || e.type === 'to') {
        const pk = p.play || 'other';
        const sp = pl.play[pk] || (pl.play[pk] = { fga: 0, fgm: 0, pts: 0, tov: 0 });
        if (e.type === 'shot') { sp.fga++; if (e.made) { sp.fgm++; sp.pts += e.pts; } } else sp.tov++;
      }
    }
    function firstORTime(p) {
      const r = p.evs.find((x) => x.type === 'reb' && x.off);
      return r ? r.t : Infinity;
    }

    /* ---------- 出場・+/-・ラインナップ ---------- */
    const lineupKnown = [0, 1].map((tm) => teams[tm].players.filter((p) => p.starter).length === 5);
    const lineups = [[], []];
    const onCourtLog = [];
    if (lineupKnown[0] || lineupKnown[1]) {
      const on = [0, 1].map((tm) => new Set(teams[tm].players.filter((p) => p.starter).map((p) => p.id)));
      const lu = [{}, {}];
      let tPrev = 0;
      const perLen = {};
      periods.forEach((p) => { perLen[p.n] = Math.max(1, p.t1 - p.t0); });
      const addTime = (t) => {
        if (t <= tPrev) return;
        // ピリオドごとの割合で「試合時間の分」に換算
        for (const pr of periods) {
          const a = Math.max(tPrev, pr.t0), b = Math.min(t, pr.t1);
          if (b <= a) continue;
          const frac = (b - a) / perLen[pr.n];
          [0, 1].forEach((tm) => {
            if (!lineupKnown[tm]) return;
            on[tm].forEach((pid) => { if (players[pid]) { players[pid].box.sec += b - a; players[pid].box.min += frac * periodMin; } });
            const key = Array.from(on[tm]).sort().join('|');
            const L = lu[tm][key] || (lu[tm][key] = { key, pids: Array.from(on[tm]), sec: 0, min: 0, ptsFor: 0, ptsAgainst: 0, possFor: 0, possAgainst: 0 });
            L.sec += b - a; L.min += frac * periodMin;
          });
        }
        tPrev = t;
      };
      const keyOf = (tm) => Array.from(on[tm]).sort().join('|');
      const scIdx = new Map(scoring.map((x) => [x.ev, x]));
      for (const e of events) {
        addTime(e.t);
        if (e.type === 'sub' && (e.team === 0 || e.team === 1)) {
          if (e.out) on[e.team].delete(e.out);
          if (e.in) on[e.team].add(e.in);
          onCourtLog.push({ t: e.t, team: e.team, on: Array.from(on[e.team]) });
        }
        if (scIdx.has(e)) {
          const sc = scIdx.get(e);
          [0, 1].forEach((tm) => {
            if (!lineupKnown[tm]) return;
            const sign = sc.team === tm ? 1 : -1;
            on[tm].forEach((pid) => { if (players[pid]) players[pid].box.pm += sign * sc.pts; });
            const L = lu[tm][keyOf(tm)];
            if (L) { if (sign > 0) L.ptsFor += sc.pts; else L.ptsAgainst += sc.pts; }
            else {
              const key = keyOf(tm);
              lu[tm][key] = { key, pids: Array.from(on[tm]), sec: 0, min: 0, ptsFor: sign > 0 ? sc.pts : 0, ptsAgainst: sign > 0 ? 0 : sc.pts, possFor: 0, possAgainst: 0 };
            }
          });
        }
      }
      addTime(Math.max(duration, lastT(events)));
      // ポゼッションをラインナップに割り当て（ポゼッション終了時のメンバー）
      const onAt = (tm, t) => {
        let set = new Set(teams[tm].players.filter((p) => p.starter).map((p) => p.id));
        for (const e of events) {
          if (e.t > t) break;
          if (e.type === 'sub' && e.team === tm) { if (e.out) set.delete(e.out); if (e.in) set.add(e.in); }
        }
        return Array.from(set).sort().join('|');
      };
      for (const p of poss) {
        [0, 1].forEach((tm) => {
          if (!lineupKnown[tm]) return;
          const L = lu[tm][onAt(tm, p.t1)];
          if (!L) return;
          if (p.team === tm) L.possFor++; else L.possAgainst++;
        });
      }
      [0, 1].forEach((tm) => {
        lineups[tm] = Object.values(lu[tm]).filter((L) => L.sec > 0.5 || L.ptsFor || L.ptsAgainst)
          .map((L) => Object.assign(L, { pm: L.ptsFor - L.ptsAgainst, ortg: L.possFor ? 100 * L.ptsFor / L.possFor : null, drtg: L.possAgainst ? 100 * L.ptsAgainst / L.possAgainst : null }))
          .sort((a, b) => b.sec - a.sec);
      });
    }

    /* ---------- 仕上げ ---------- */
    Object.values(players).forEach((p) => finishBox(p.box));
    team.forEach((T) => finishBox(T.box));
    const tposs = [0, 1].map((tm) => poss.filter((p) => p.team === tm).length);
    const est = team.map((T) => T.box.fga - T.box.or + T.box.tov + 0.44 * T.box.fta);
    const ff = [0, 1].map((tm) => {
      const b = team[tm].box, o = team[1 - tm].box;
      return {
        efg: b.fga ? (b.fgm + 0.5 * b.p3m) / b.fga : null,
        tov: (b.fga + 0.44 * b.fta + b.tov) ? b.tov / (b.fga + 0.44 * b.fta + b.tov) : null,
        orb: (b.or + o.dr) ? b.or / (b.or + o.dr) : null,
        ftr: b.fga ? b.ftm / b.fga : null
      };
    });
    const teamOut = [0, 1].map((tm) => {
      const T = team[tm];
      const pcount = tposs[tm] || Math.round(est[tm]);
      const oppP = tposs[1 - tm] || Math.round(est[1 - tm]);
      const perScores = {};
      scoring.forEach((sc) => { if (sc.team === tm) { const n = periodAt(sc.t); perScores[n] = (perScores[n] || 0) + sc.pts; } });
      return {
        id: tm, box: T.box, un: finishBox(T.un), unCount: T.unCount, zones: T.zones, teamReb: T.teamReb, teamTov: T.teamTov,
        foulsByPer: T.foulsByPer, foulKinds: T.foulKinds, toKinds: T.toKinds, fouls: T.fouls,
        poss: pcount, possEst: est[tm], ortg: pcount ? 100 * T.box.pts / pcount : null,
        drtg: oppP ? 100 * team[1 - tm].box.pts / oppP : null,
        ff: ff[tm], breakdown: breakdown[tm], perScores
      };
    });

    // ファウルトラブル（中高の指導でよく使う目安）
    const foulTrouble = [];
    Object.values(players).forEach((p) => {
      const byPer = {};
      p.fouls.forEach((f) => { byPer[f._per] = (byPer[f._per] || 0) + 1; });
      let cum = 0;
      const flags = [];
      periods.forEach((pr) => {
        cum += byPer[pr.n] || 0;
        if (pr.n === 1 && cum >= 2) flags.push({ per: 1, n: cum, text: '1Qで' + cum + '個' });
        if (pr.n === 2 && cum >= 3) flags.push({ per: 2, n: cum, text: '前半で' + cum + '個' });
        if (pr.n === 3 && cum >= 4) flags.push({ per: 3, n: cum, text: '3Qまでに' + cum + '個' });
      });
      if (p.fouls.length >= 5) flags.push({ per: 0, n: 5, text: '5ファウル退場' });
      if (flags.length) foulTrouble.push({ pid: p.id, team: p.team, flags, total: p.fouls.length });
    });

    const periodScores = periods.map((pr) => ({ n: pr.n, pts: [teamOut[0].perScores[pr.n] || 0, teamOut[1].perScores[pr.n] || 0] }));

    return {
      events, periods, players, teams: teamOut, poss, scenes, plays, flow, scoring, runs,
      leadChanges, ties, biggest, lineups, lineupKnown, foulTrouble, periodScores, periodAt,
      score: s.slice(), duration: Math.max(duration, lastT(events))
    };
  }

  function lastT(events) { return events.length ? events[events.length - 1].t : 0; }

  /* ---------- 数字 → そのプレーのイベント（動画へのリンク用） ---------- */
  function eventsFor(M, q) {
    // q: { pid?, team?, stat }
    const out = [];
    const mine = (e, key) => (q.pid ? e[key || 'pid'] === q.pid : (q.team == null || e.team === q.team));
    for (const e of M.events) {
      switch (q.stat) {
        case 'pts': if (((e.type === 'shot' || e.type === 'ft') && e.made) && mine(e)) out.push(e); break;
        case 'fga': if (e.type === 'shot' && mine(e)) out.push(e); break;
        case 'fgm': if (e.type === 'shot' && e.made && mine(e)) out.push(e); break;
        case 'p3a': if (e.type === 'shot' && e.pts === 3 && mine(e)) out.push(e); break;
        case 'p3m': if (e.type === 'shot' && e.pts === 3 && e.made && mine(e)) out.push(e); break;
        case 'p2a': if (e.type === 'shot' && e.pts === 2 && mine(e)) out.push(e); break;
        case 'fta': if (e.type === 'ft' && mine(e)) out.push(e); break;
        case 'ftmiss': if (e.type === 'ft' && !e.made && mine(e)) out.push(e); break;
        case 'or': if (e.type === 'reb' && e.off && mine(e)) out.push(e); break;
        case 'dr': if (e.type === 'reb' && !e.off && mine(e)) out.push(e); break;
        case 'reb': if (e.type === 'reb' && mine(e)) out.push(e); break;
        case 'ast': if (e.type === 'shot' && e.made && e.ast && (q.pid ? e.ast === q.pid : (q.team == null || e.team === q.team))) out.push(e); break;
        case 'stl': if (e.type === 'to' && e.stl && (q.pid ? e.stl === q.pid : (q.team == null || e.team === 1 - q.team))) out.push(e); break;
        case 'blk': if (e.type === 'shot' && e.blk && (q.pid ? e.blk === q.pid : (q.team == null || e.team === 1 - q.team))) out.push(e); break;
        case 'tov': if ((e.type === 'to' || (e.type === 'foul' && e.kind === 'O')) && mine(e)) out.push(e); break;
        case 'pf': if (e.type === 'foul' && mine(e)) out.push(e); break;
        case 'fd': if (e.type === 'foul' && e.drawn && (q.pid ? e.drawn === q.pid : (q.team == null || e.team === 1 - q.team))) out.push(e); break;
        case 'miss': if (e.type === 'shot' && !e.made && mine(e)) out.push(e); break;
        default: break;
      }
    }
    return out;
  }

  BS.model = { compute, eventsFor, sortEvents };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/clips.js */
/* バスケ分析スタジオ — ハイライト用のクリップ（切り出し区間）を作る
   得点・失点・TO など「タグ」から、前後の秒数をつけて区間を作り、重なりはまとめる。DOM 非依存。 */
(function (root) {
  'use strict';
  const BS = root.BS;

  const WINDOW = {
    shotMade: [6, 2.5], shotMiss: [5, 2], ft: [1.5, 2], to: [5, 3], stl: [4, 3], blk: [4, 2.5],
    foul: [4, 2.5], reb: [4, 2], mark: [5, 5], sub: [2, 2], timeout: [2, 4], period: [1, 4]
  };

  const PRESETS = [
    { id: 'score', label: '自チームの得点', hint: '得点した場面を順番に。キャプションに得点者・アシスト・スコア' },
    { id: 'concede', label: '失点シーン（原因別）', hint: '相手の得点を「攻撃の始まり」から切り出し、原因で分類' },
    { id: 'three', label: '3P成功', hint: '自チームの3ポイント成功' },
    { id: 'defense', label: '好守（スティール・ブロック）', hint: '自チームのスティールとブロック' },
    { id: 'tov', label: 'ターンオーバー（反省用）', hint: '自チームのミスを前後つきで' },
    { id: 'fouls', label: 'ファウル', hint: '自チームのファウル' },
    { id: 'player', label: '選手別', hint: '選んだ選手の得点・アシスト・スティール・ブロック' },
    { id: 'marks', label: 'マークした場面', hint: 'M キーで付けた印' }
  ];

  const CAUSES = [
    { id: 'steal', label: 'スティールされて', short: 'スティール後' },
    { id: 'deadto', label: 'ミス（TO）の後', short: 'TO後' },
    { id: 'fast', label: '速攻', short: '速攻' },
    { id: 'oreb', label: 'オフェンスリバウンドから', short: 'OR後' },
    { id: 'ft', label: 'フリースロー', short: 'FT' },
    { id: 'three', label: '3P', short: '3P' },
    { id: 'paint', label: 'ゴール下・ペイント', short: 'ペイント' },
    { id: 'mid', label: 'ミドル', short: 'ミドル' },
    { id: 'set', label: 'その他セット', short: 'セット' }
  ];

  function nameOf(project, pid) {
    if (!pid) return '';
    for (const t of project.teams) {
      const p = t.players.find((x) => x.id === pid);
      if (p) return `#${p.no} ${p.name || ''}`.trim();
    }
    return '#?';
  }
  function perLabel(n) { return n > 4 ? 'OT' + (n - 4) : n + 'Q'; }

  /* 1つのイベントを説明する文 */
  function describe(project, e) {
    let who = nameOf(project, e.pid);
    if (!who && e.auto && (e.type === 'shot' || e.type === 'ft' || e.type === 'reb')) who = '（選手未確認）';
    switch (e.type) {
      case 'shot': {
        let s = `${who} ${e.pts}P${e.made ? '成功' : '失敗'}`;
        if (e.made && e.ast) s += `（アシスト ${nameOf(project, e.ast)}）`;
        if (!e.made && e.blk) s += `（ブロック ${nameOf(project, e.blk)}）`;
        return s;
      }
      case 'ft': return `${who} フリースロー${e.made ? '成功' : '失敗'}`;
      case 'reb': return `${who || 'チーム'} ${e.off ? 'オフェンス' : 'ディフェンス'}リバウンド`;
      case 'to': {
        let s = `${who || 'チーム'} ターンオーバー`;
        if (e.kind) s += `（${BS.toLabel(e.kind)}）`;
        if (e.stl) s += ` ← スティール ${nameOf(project, e.stl)}`;
        return s;
      }
      case 'foul': {
        let s = `${who} ファウル（${BS.foulLabel(e.kind)}）`;
        if (e.drawn) s += ` → ${nameOf(project, e.drawn)}`;
        return s;
      }
      case 'sub': return `交代 IN ${nameOf(project, e.in) || '?'} / OUT ${nameOf(project, e.out) || '?'}`;
      case 'timeout': return `タイムアウト（${(project.teams[e.team] || {}).short || ''}）`;
      case 'period': return `${perLabel(e.n || 1)} 開始`;
      case 'mark': return `マーク${e.text ? '：' + e.text : ''}`;
      default: return e.type;
    }
  }

  function scoreAt(M, t, ev) {
    // ev を含めた直後のスコア
    let s = [0, 0];
    for (const f of M.flow) {
      if (f.t > t) break;
      if (f.t === t && ev && f.ev && f.ev !== ev && M.events.indexOf(f.ev) > M.events.indexOf(ev)) break;
      s = f.s;
    }
    return s;
  }
  function scoreText(project, s) {
    return `${project.teams[0].short} ${s[0]} - ${s[1]} ${project.teams[1].short}`;
  }

  function windowFor(e) {
    if (e.type === 'shot') return e.made ? WINDOW.shotMade : WINDOW.shotMiss;
    return WINDOW[e.type] || [4, 2];
  }

  function clipFromEvent(project, M, e, opts) {
    opts = opts || {};
    const w = windowFor(e);
    const lead = opts.lead != null ? opts.lead : w[0];
    const lag = opts.lag != null ? opts.lag : w[1];
    const dur = M.duration || project.duration || e.t + lag;
    const s = scoreAt(M, e.t, e);
    const per = M.periodAt ? M.periodAt(e.t) : 1;
    return {
      id: 'c' + e.id,
      t0: Math.max(0, e.t - lead), t1: Math.min(dur, e.t + lag), at: e.t,
      title: `${perLabel(per)} ${describe(project, e)}`,
      sub: scoreText(project, s),
      team: e.team, evIds: [e.id], kind: e.type, cause: null, on: true
    };
  }

  function merge(clips, gap) {
    gap = gap == null ? 0.3 : gap;
    const sorted = clips.slice().sort((a, b) => a.t0 - b.t0);
    const out = [];
    for (const c of sorted) {
      const last = out[out.length - 1];
      if (last && c.t0 <= last.t1 + gap) {
        last.t1 = Math.max(last.t1, c.t1);
        if (!last.evIds.some((id) => c.evIds.includes(id))) {
          last.title += ' ／ ' + c.title.replace(/^\S+\s/, '');
          last.evIds = last.evIds.concat(c.evIds);
          last.sub = c.sub;
        }
      } else out.push(Object.assign({}, c));
    }
    return out;
  }

  /* 失点（相手の得点ポゼッション）の原因 */
  function causeOf(p, scoringEv) {
    if (p.startType === 'steal') return 'steal';
    if (p.startType === 'dead-to') return 'deadto';
    if (p.transition) return 'fast';
    if (p.ptsAfterOR > 0) return 'oreb';
    if (!scoringEv || scoringEv.type === 'ft') return 'ft';
    const z = scoringEv._zone;
    if (scoringEv.pts === 3) return 'three';
    if (z === 'rim' || z === 'paint') return 'paint';
    if (z === 'mid') return 'mid';
    return 'set';
  }
  function causeLabel(id) { return (CAUSES.find((c) => c.id === id) || { label: id }).label; }

  function possessionClips(project, M, team, opts) {
    opts = opts || {};
    const out = [];
    for (const p of M.poss) {
      if (p.team !== team || p.pts <= 0) continue;
      const scoringEvs = p.evs.filter((e) => (e.type === 'shot' && e.made) || (e.type === 'ft' && e.made));
      if (!scoringEvs.length) continue;
      const key = scoringEvs.find((e) => e.type === 'shot') || scoringEvs[0];
      const last = scoringEvs[scoringEvs.length - 1];
      const cause = causeOf(p, key);
      let t0 = Math.max(p.t0 - 1.5, key.t - 16);
      if (key.type === 'ft') {
        const f = p.evs.find((e) => e.type === 'foul');
        t0 = Math.max(0, (f ? f.t : key.t) - 5);
      }
      const t1 = Math.min(M.duration, last.t + 2.5);
      const s = scoreAt(M, last.t, last);
      const per = M.periodAt(key.t);
      out.push({
        id: 'p' + p.id + '-' + team,
        t0: Math.max(0, t0), t1, at: key.t,
        title: `${perLabel(per)} ${causeLabel(cause)}｜${describe(project, key)}${p.pts > (key.pts || 0) && key.type === 'shot' ? `（計${p.pts}点）` : ''}`,
        sub: scoreText(project, s),
        team, evIds: p.evs.map((e) => e.id), kind: 'poss', cause, on: true, pts: p.pts
      });
    }
    return out;
  }

  function build(project, M, preset, opts) {
    opts = opts || {};
    const us = project.ourTeam != null ? project.ourTeam : 0;
    const them = 1 - us;
    const ev = M.events;
    let clips = [];
    if (preset === 'score') {
      clips = ev.filter((e) => e.team === us && ((e.type === 'shot' && e.made) || (opts.ft && e.type === 'ft' && e.made)))
        .map((e) => clipFromEvent(project, M, e, opts));
      clips = merge(clips);
    } else if (preset === 'concede') {
      clips = possessionClips(project, M, them, opts);
      if (opts.cause) clips = clips.filter((c) => c.cause === opts.cause);
    } else if (preset === 'three') {
      clips = merge(ev.filter((e) => e.team === us && e.type === 'shot' && e.made && e.pts === 3).map((e) => clipFromEvent(project, M, e, opts)));
    } else if (preset === 'defense') {
      const items = [];
      ev.forEach((e) => {
        if (e.type === 'to' && e.stl && e.team === them) {
          const c = clipFromEvent(project, M, e, opts);
          c.title = c.title.replace(/^(\S+)\s.*$/, `$1 スティール ${nameOf(project, e.stl)}`);
          items.push(c);
        }
        if (e.type === 'shot' && e.blk && e.team === them) {
          const c = clipFromEvent(project, M, e, opts);
          c.title = c.title.replace(/^(\S+)\s.*$/, `$1 ブロック ${nameOf(project, e.blk)}`);
          items.push(c);
        }
      });
      clips = merge(items);
    } else if (preset === 'tov') {
      clips = merge(ev.filter((e) => e.team === us && (e.type === 'to' || (e.type === 'foul' && e.kind === 'O'))).map((e) => clipFromEvent(project, M, e, opts)));
    } else if (preset === 'fouls') {
      clips = merge(ev.filter((e) => e.team === us && e.type === 'foul').map((e) => clipFromEvent(project, M, e, opts)));
    } else if (preset === 'player') {
      const pid = opts.pid;
      const items = [];
      ev.forEach((e) => {
        if (e.type === 'shot' && e.made && e.pid === pid) items.push(clipFromEvent(project, M, e, opts));
        else if (e.type === 'shot' && e.made && e.ast === pid) { const c = clipFromEvent(project, M, e, opts); items.push(c); }
        else if (e.type === 'to' && e.stl === pid) { const c = clipFromEvent(project, M, e, opts); c.title = c.title.replace(/^(\S+)\s.*$/, `$1 スティール ${nameOf(project, pid)}`); items.push(c); }
        else if (e.type === 'shot' && e.blk === pid) { const c = clipFromEvent(project, M, e, opts); c.title = c.title.replace(/^(\S+)\s.*$/, `$1 ブロック ${nameOf(project, pid)}`); items.push(c); }
      });
      clips = merge(items);
    } else if (preset === 'marks') {
      clips = ev.filter((e) => e.type === 'mark').map((e) => clipFromEvent(project, M, e, opts));
    }
    return clips;
  }

  /* 任意のイベント一覧（集計表の数字クリックなど）→ クリップ */
  function fromEvents(project, M, events, opts) {
    return merge(events.map((e) => clipFromEvent(project, M, e, opts)), 0.1);
  }

  function causeSummary(clips) {
    const out = {};
    clips.forEach((c) => { if (c.cause) { out[c.cause] = out[c.cause] || { n: 0, pts: 0 }; out[c.cause].n++; out[c.cause].pts += c.pts || 0; } });
    return CAUSES.filter((c) => out[c.id]).map((c) => Object.assign({ id: c.id, label: c.label, short: c.short }, out[c.id]));
  }

  BS.clips = { PRESETS, CAUSES, build, fromEvents, merge, describe, nameOf, perLabel, causeOf, causeLabel, causeSummary, scoreText, scoreAt, windowFor };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/advice.js */
/* バスケ分析スタジオ — アドバイス（ルールベース）
   プロの分析の考え方（Dean Oliver の Four Factors、Synergy のプレータイプ別 PPP、
   ショットゾーンの期待値、ファウル管理）を、中学・高校の指導で使える言葉にしたもの。
   すべての指摘に「根拠の数字」と「その場面の動画」をつける。DOM 非依存。 */
(function (root) {
  'use strict';
  const BS = root.BS;
  const pc = (v, d = 0) => (v == null ? '—' : (100 * v).toFixed(d) + '%');
  const f2 = (v) => (v == null ? '—' : v.toFixed(2));

  function nm(project, pid) { return BS.clips.nameOf(project, pid); }

  function analyze(project, M) {
    const us = project.ourTeam != null ? project.ourTeam : 0;
    const them = 1 - us;
    const U = M.teams[us], T = M.teams[them];
    const ub = U.box, tb = T.box;
    const usName = project.teams[us].short || project.teams[us].name;
    const themName = project.teams[them].short || project.teams[them].name;
    const margin = M.score[us] - M.score[them];
    const ppp = U.poss ? ub.pts / U.poss : 1;
    const oppPPP = T.poss ? tb.pts / T.poss : 1;
    const enough = (ub.fga + tb.fga) >= 20;

    /* ---------- Four Factors を「点数」に置き換えて比べる ---------- */
    const avgFGA = (ub.fga + tb.fga) / 2;
    const factors = [
      { id: 'shoot', label: 'シュート効率（eFG%）', us: U.ff.efg, them: T.ff.efg, fmt: pc, pts: ((U.ff.efg || 0) - (T.ff.efg || 0)) * 2 * avgFGA, weight: 40 },
      { id: 'tov', label: 'ターンオーバー', us: ub.tov, them: tb.tov, fmt: (v) => v + '回', pts: (tb.tov - ub.tov) * ((ppp + oppPPP) / 2), weight: 25 },
      { id: 'reb', label: 'オフェンスリバウンド', us: ub.or, them: tb.or, fmt: (v) => v + '本', pts: (ub.or - tb.or) * 1.0, weight: 20 },
      { id: 'ft', label: 'フリースロー', us: ub.ftm, them: tb.ftm, fmt: (v) => v + '点', pts: ub.ftm - tb.ftm, weight: 15 }
    ].map((f) => Object.assign(f, { pts: BS.round(f.pts, 1) }));
    const worst = factors.slice().sort((a, b) => a.pts - b.pts);

    /* ---------- 見出し ---------- */
    const res = margin > 0 ? `${margin}点差で勝利` : margin < 0 ? `${-margin}点差で敗戦` : '引き分け';
    const neg = worst.filter((f) => f.pts <= -2).slice(0, 2);
    let keyLine;
    if (!enough) keyLine = 'タグが少ないため、傾向はまだ読み取れません。タグを増やすと精度が上がります。';
    else if (neg.length) keyLine = `差がついた要因は ${neg.map((f) => `「${f.label}」（約${Math.abs(f.pts).toFixed(0)}点分）`).join('と')}。`;
    else keyLine = '4つの要因（シュート・TO・リバウンド・FT）で大きく負けた項目はありません。';
    const flowLine = [];
    if (M.biggest[us] >= 6 && margin < 0) flowLine.push(`最大${M.biggest[us]}点リードから逆転された`);
    if (M.biggest[them] >= 6 && margin > 0) flowLine.push(`最大${M.biggest[them]}点ビハインドから逆転した`);
    if (M.leadChanges >= 4) flowLine.push(`リードチェンジ ${M.leadChanges}回の接戦`);
    const headline = {
      result: `${project.teams[us].name} ${M.score[us]} - ${M.score[them]} ${project.teams[them].name}（${res}）`,
      key: keyLine,
      flow: flowLine.join('。')
    };

    const issues = [];
    const strengths = [];

    /* ---------- 課題 ---------- */
    // TO
    const toKinds = Object.entries(U.toKinds).filter(([k]) => k !== 'none').sort((a, b) => b[1] - a[1]);
    const topKind = toKinds.length ? toKinds[0][0] : null;
    if (ub.tov >= 8 && ((U.ff.tov || 0) >= 0.17 || ub.tov - tb.tov >= 4)) {
      const how = {
        pass: ['パスの受け手が一歩ボールに寄る（ミートする）', 'パスの前に目線・フェイクで守備をずらす', '浮いた横パスより、速い短いパス・バウンズパス'],
        lost: ['ドリブルは体と腕でボールを守る', 'ヘルプが来たら止まらずにパスで逃がす', '2人に囲まれたら無理に抜かない'],
        travel: ['ジャンプストップとピボットの確認', 'キャッチの前に次の動きを決めておく'],
        offfoul: ['止まっている守備者に突っ込まない', 'ドライブはスペースへ、コースに入られたら止まってパス'],
        oob: ['ライン際は早めにパスを出す', 'パスは受け手の「外側の手」へ'],
        viol: ['3秒・8秒・24秒の意識をチームで共有', 'セットの形を決めて迷わない']
      }[topKind] || ['パス・ドリブルの判断を早く', '無理な1対2を避ける'];
      const drills = {
        pass: ['3メン（パスのみ・ノードリブル）', '2対1・3対2のアウトナンバー（パスで崩す）', '対面パス（ディフェンス付き、手を伸ばされても通す）'],
        lost: ['ハンドリング（プレッシャー付き）', '1対1 → ヘルプが来たらパス', 'ボールキープ（2人に囲まれて5秒守る）'],
        offfoul: ['ドライブ → ストップ → パスの判断練習', '1対1（チャージングを取られない強さのドライブ）']
      }[topKind] || ['3メン（パスのみ）', '2対1・3対2のアウトナンバー'];
      issues.push({
        id: 'tov', icon: '⚠️', title: 'ターンオーバーを減らす',
        impact: Math.max(0, ub.tov - tb.tov) * oppPPP + T.breakdown.offTO * 0.3,
        evidence: [
          `TO ${ub.tov}回（TO率 ${pc(U.ff.tov)}）／相手 ${tb.tov}回（${pc(T.ff.tov)}）`,
          `TOからの失点 ${T.breakdown.offTO}点、そのうちスティールされたのが ${tb.stl}回`,
          toKinds.length ? '種類: ' + toKinds.map(([k, n]) => `${BS.toLabel(k)} ${n}`).join('・') : null
        ].filter(Boolean),
        why: 'TOはシュートを打てずに攻撃が終わるうえ、スティールされると相手の速攻（いちばん決まりやすい攻撃）につながります。',
        how, drills, clips: { stat: 'tov', team: us }
      });
    }
    // 守備リバウンド
    if ((T.ff.orb || 0) >= 0.3 && tb.or >= 7) {
      const topOR = topBy(M, them, (b) => b.or);
      issues.push({
        id: 'dreb', icon: '🧱', title: 'ボックスアウトで守備リバウンドを取り切る',
        impact: T.breakdown.second * 0.6 + (tb.or - ub.or) * 0.5,
        evidence: [
          `相手のオフェンスリバウンド ${tb.or}本（相手のOR率 ${pc(T.ff.orb)}）`,
          `セカンドチャンスの失点 ${T.breakdown.second}点`,
          topOR ? `いちばん取られたのは ${nm(project, topOR.id)}（OR ${topOR.box.or}本）` : null
        ].filter(Boolean),
        why: 'せっかくシュートを外させても、リバウンドを取られると守備のやり直し。守備の頑張りが得点に結びつきません。',
        how: ['シュートが放たれたら、まず相手を見つけて体を当てる → それからボールへ', 'ガードも内側に戻ってロングリバウンドに参加', topOR ? `${nm(project, topOR.id)} にはボックスアウト担当を決める` : '相手のリバウンダーに担当を決める'],
        drills: ['1対1ボックスアウト（3秒押さえてからボールへ）', '3対3リバウンドゲーム（守備側が取るまで攻守交代なし）', 'シュート練習の外れ球は全員ボックスアウトしてから拾う'],
        clips: { stat: 'or', team: them }
      });
    }
    // 速攻の失点
    const tTr = M.scenes.transition[them];
    if (T.breakdown.fast >= 10 || (tTr.poss >= 6 && (tTr.ppp || 0) >= 1.25)) {
      issues.push({
        id: 'transD', icon: '🏃', title: '戻りを速く（トランジションディフェンス）',
        impact: T.breakdown.fast * 0.4,
        evidence: [
          `相手の速攻 ${tTr.poss}回で ${tTr.pts}点（1回あたり ${f2(tTr.ppp)}点）`,
          `スティールからの攻撃 ${M.scenes.afterSteal[them].poss}回で ${M.scenes.afterSteal[them].pts}点`
        ],
        why: '速攻は守備が整う前の攻撃なので、どのレベルでも最も失点しやすい場面です。1人目が戻れば多くは防げます。',
        how: ['シュートを打ったら、ガード1人は必ずセーフティで戻る', 'ミスした選手は取り返しに行かず、まず全力で戻る', '最初の3歩をダッシュ（ボールより先に自陣へ）'],
        drills: ['5対5トランジション（攻撃が終わったら即攻守交代）', '3対2 → 2対1の連続（戻る習慣づけ）'],
        clips: { preset: 'concede', cause: 'fast' }
      });
    }
    // シュート選択（ミドル）
    const uz = U.zones;
    const tracked = BS.ZONES.reduce((s, z) => s + uz[z.id].fga, 0);
    if (tracked >= 15) {
      const pps = (z) => (uz[z].fga ? uz[z].pts / uz[z].fga : null);
      const midShare = uz.mid.fga / tracked;
      const rimPPS = pps('rim'), midPPS = pps('mid');
      const threeFGA = uz.c3.fga + uz.ab3.fga;
      const threePPS = threeFGA ? (uz.c3.pts + uz.ab3.pts) / threeFGA : null;
      if (midShare >= 0.24 && midPPS != null && midPPS < 0.85) {
        const better = Math.max(rimPPS || 0, threePPS || 0, 1.0);
        issues.push({
          id: 'shotsel', icon: '🎯', title: 'シュート選択：止まってのミドルを減らす',
          impact: uz.mid.fga * (better - midPPS) * 0.5,
          evidence: [
            `ミドル ${uz.mid.fgm}/${uz.mid.fga}（${pc(uz.mid.fgm / uz.mid.fga)}）＝1本あたり ${f2(midPPS)}点、全シュートの ${pc(midShare)}`,
            rimPPS != null ? `ゴール下 ${uz.rim.fgm}/${uz.rim.fga} ＝1本あたり ${f2(rimPPS)}点` : null,
            threePPS != null ? `3P ${uz.c3.fgm + uz.ab3.fgm}/${threeFGA} ＝1本あたり ${f2(threePPS)}点` : null
          ].filter(Boolean),
          why: 'ゴール下と3Pは1本あたりの期待得点が高く、ミドルは低くなりがちです（プロのデータ分析で広まった考え方）。ノーマークのミドルは打ってOK。',
          how: ['ドライブはペイントまで入ってから判断する', 'コーナーに1人置いてキックアウトの出口を作る', 'ミドルは「フリーのときだけ」をチームの約束に'],
          drills: ['ドライブ → キックアウトの3対3', 'コーナーでのキャッチ&シュート（連続10本）'],
          clips: { zone: 'mid', team: us }
        });
      }
    }
    // FT
    if (ub.fta >= 8 && ub.ftm / ub.fta < 0.62) {
      const bad = Object.values(M.players).filter((p) => p.team === us && p.box.fta >= 3 && p.box.ftm / p.box.fta < 0.6).sort((a, b) => b.box.fta - a.box.fta);
      issues.push({
        id: 'ft', icon: '🎯', title: 'フリースローの確率を上げる',
        impact: (0.7 - ub.ftm / ub.fta) * ub.fta,
        evidence: [
          `FT ${ub.ftm}/${ub.fta}（${pc(ub.ftm / ub.fta)}）→ 70%なら +${((0.7 - ub.ftm / ub.fta) * ub.fta).toFixed(1)}点`,
          bad.length ? '要練習: ' + bad.map((p) => `${nm(project, p.id)} ${p.box.ftm}/${p.box.fta}`).join('・') : null
        ].filter(Boolean),
        why: 'FTは誰にも邪魔されない唯一のシュート。練習量がそのまま点になります。',
        how: ['毎回同じルーティン（ドリブル回数・呼吸）', '練習でも疲れた状態で打つ'],
        drills: ['ダッシュ直後に2本（試合の疲労を再現）', 'チーム全員で連続成功チャレンジ'],
        clips: { stat: 'ftmiss', team: us }
      });
    }
    // ファウル
    const perList = M.periods.map((p) => p.n);
    const bonusPers = perList.filter((n) => (U.foulsByPer[n] || 0) >= 5);
    const ourTrouble = M.foulTrouble.filter((f) => f.team === us);
    if (bonusPers.length >= 2 || ourTrouble.some((f) => f.total >= 5) || ub.pf - tb.pf >= 5) {
      issues.push({
        id: 'fouls', icon: '🟨', title: 'ファウルのコントロール',
        impact: tb.ftm * 0.3 + ourTrouble.filter((f) => f.total >= 5).length * 3 + bonusPers.length,
        evidence: [
          'チームファウル: ' + perList.map((n) => `${BS.clips.perLabel(n)} ${U.foulsByPer[n] || 0}`).join('・') + '（5個目から相手にFT）',
          `相手のFT ${tb.ftm}/${tb.fta}`,
          ourTrouble.length ? 'ファウルトラブル: ' + ourTrouble.map((f) => `${nm(project, f.pid)}（${f.flags[f.flags.length - 1].text}）`).join('・') : null
        ].filter(Boolean),
        why: 'チームファウルが5つを超えると、以降のファウルは全部相手のFTに。主力のファウルトラブルは出場時間を削ります。',
        how: ['手で止めに行かず、足（スライド）で守る', 'シュートブロックは真上に跳ぶ（体を当てない）', 'ファウル2つの選手はマッチアップを変える・休ませるタイミングを決めておく'],
        drills: ['シェルディフェンス（4対4、手を使わないルール）', 'クローズアウト → スライドの1対1'],
        clips: { stat: 'pf', team: us }
      });
    }
    // 相手のラン
    const oppRuns = M.runs.filter((r) => r.team === them && r.pts >= 8);
    if (oppRuns.length) {
      const big = oppRuns.slice().sort((a, b) => b.pts - a.pts)[0];
      issues.push({
        id: 'runs', icon: '🌊', title: '流れを切る（連続失点を止める）',
        impact: big.pts * 0.35,
        evidence: oppRuns.map((r) => `${BS.clips.perLabel(M.periodAt(r.t0))}（動画 ${BS.fmtTime(r.t0)}〜${BS.fmtTime(r.t1)}）に 0-${r.pts} のラン`),
        why: '連続失点は、TO・速攻・リバウンドが重なって起きることが多く、放っておくと一気に試合が決まります。',
        how: ['4〜6点の連続失点でタイムアウト、または決まったセットプレーで確実に1本', 'ランの間のTO・速攻・リバウンドを動画で確認'],
        drills: ['「止める1本」のセットプレーを1つ決めて練習', '点差・時間を設定したゲーム形式'],
        clips: { events: big.evs.map((e) => e.id) }
      });
    }
    // 相手の3P・ペイント
    if (tb.p3a >= 12 && tb.p3m / tb.p3a >= 0.38) {
      issues.push({
        id: 'opp3', icon: '🖐️', title: '3Pへのクローズアウト',
        impact: (tb.p3m / tb.p3a - 0.32) * tb.p3a * 3,
        evidence: [`相手の3P ${tb.p3m}/${tb.p3a}（${pc(tb.p3m / tb.p3a)}）`],
        why: '3Pは1本で3点。打たせる前のチェックで確率は大きく下がります。',
        how: ['ヘルプから戻るときは手を上げて小刻みに（クローズアウト）', 'シューターには離れすぎない'],
        drills: ['クローズアウト → 1対1', 'シェルディフェンス（ローテーション）'],
        clips: { stat: 'p3a', team: them }
      });
    }
    if (tb.pts >= 20 && T.breakdown.paint / tb.pts >= 0.55) {
      issues.push({
        id: 'paintD', icon: '🛡️', title: 'ペイントを守る',
        impact: (T.breakdown.paint - tb.pts * 0.45) * 0.3,
        evidence: [`相手のペイント内得点 ${T.breakdown.paint}点（全得点の ${pc(T.breakdown.paint / tb.pts)}）`],
        why: 'ゴール下は最も確率の高いシュート。ここを簡単に許すと失点が止まりません。',
        how: ['ドライブにはヘルプ（逆サイドの守備）が一歩寄る', 'ポストには前に回る・パスコースを塞ぐ'],
        drills: ['シェルディフェンス（ヘルプ&ローテーション）', 'ポストディフェンス（フロント・3/4）'],
        clips: { zone: 'paint', team: them }
      });
    }
    // ボールの動き
    if (ub.fgm >= 10 && ub.ast / ub.fgm < 0.42) {
      issues.push({
        id: 'ast', icon: '🔄', title: 'ボールを動かす',
        impact: 1.5,
        evidence: [`アシスト ${ub.ast}（成功シュートの ${pc(ub.ast / ub.fgm)} がアシスト付き）`],
        why: 'パスでずらしたシュートは、1対1のシュートより確率が高くなります。',
        how: ['「2回パスしてから」などの約束で1対1を減らす', 'ドライブしたら次のパスまで考える'],
        drills: ['5対0のボール回し（全員タッチしてからシュート）', '3対3（ドリブル2回まで）'],
        clips: { stat: 'fgm', team: us }
      });
    }

    /* ---------- 良かった点 ---------- */
    const playRows = BS.PLAYS.map((pl) => Object.assign({ id: pl.id, label: pl.label }, M.plays[pl.id][us])).filter((r) => r.poss >= 6 && r.ppp != null);
    if (playRows.length) {
      const best = playRows.slice().sort((a, b) => b.ppp - a.ppp)[0];
      if (best.ppp >= Math.max(1.0, ppp + 0.12)) {
        strengths.push({
          id: 'bestplay', icon: '💪', title: `${best.label}が効いている`,
          evidence: [`${best.label} ${best.poss}回で${best.pts}点（1回あたり ${f2(best.ppp)}点）／チーム平均 ${f2(ppp)}点`],
          how: '得点源として回数を増やす。相手が対応してきたときの2つ目の選択肢も準備。',
          clips: { play: best.id, team: us }
        });
      }
      const worstP = playRows.slice().sort((a, b) => a.ppp - b.ppp)[0];
      if (worstP.ppp <= 0.7 && worstP.id !== best.id) {
        issues.push({
          id: 'worstplay', icon: '🧩', title: `${worstP.label}の見直し`,
          impact: (ppp - worstP.ppp) * worstP.poss,
          evidence: [`${worstP.label} ${worstP.poss}回で${worstP.pts}点（1回あたり ${f2(worstP.ppp)}点）／チーム平均 ${f2(ppp)}点`],
          why: '決まりにくい形を繰り返すと、そのぶん得点機会を失います。',
          how: ['回数を減らす、またはこの形からの「次のパス」を用意する'],
          drills: ['この形からの2択（シュート or パス）を反復'],
          clips: { play: worstP.id, team: us }
        });
      }
    }
    if (ub.p3a >= 10 && ub.p3m / ub.p3a >= 0.36) strengths.push({ id: 'three', icon: '🎯', title: '3Pがよく入った', evidence: [`3P ${ub.p3m}/${ub.p3a}（${pc(ub.p3m / ub.p3a)}）`], how: 'シューターが打てる形（キックアウト・オフスクリーン）を増やす。', clips: { stat: 'p3m', team: us } });
    if (ub.fgm >= 10 && ub.ast / ub.fgm >= 0.55) strengths.push({ id: 'astgood', icon: '🔄', title: 'ボールがよく動いた', evidence: [`成功シュートの ${pc(ub.ast / ub.fgm)} がアシスト付き（${ub.ast}本）`], how: 'パスでずらす意識を継続。', clips: { stat: 'ast', team: us } });
    if ((U.ff.orb || 0) >= 0.32 && ub.or >= 8) strengths.push({ id: 'oreb', icon: '💪', title: 'オフェンスリバウンドに強い', evidence: [`OR ${ub.or}本（OR率 ${pc(U.ff.orb)}）、セカンドチャンス ${U.breakdown.second}点`], how: 'シュートの後の飛び込みを続ける。ただし戻りの1人は必ず残す。', clips: { stat: 'or', team: us } });
    const uTr = M.scenes.transition[us];
    if (uTr.poss >= 5 && (uTr.ppp || 0) >= 1.2) strengths.push({ id: 'trans', icon: '🏃', title: '速攻が決まっている', evidence: [`速攻 ${uTr.poss}回で ${uTr.pts}点（1回あたり ${f2(uTr.ppp)}点）`], how: 'リバウンド後の最初のパスを速く。走る回数を増やす。', clips: { scene: 'transition', team: us } });
    if ((U.ff.tov || 1) <= 0.14 && ub.fga >= 20) strengths.push({ id: 'lowto', icon: '👍', title: 'ミスが少ない', evidence: [`TO率 ${pc(U.ff.tov)}（${ub.tov}回）`], how: 'このボール運びを基準にする。', clips: { stat: 'tov', team: us } });
    if (ub.stl >= 8 || ub.blk >= 4) strengths.push({ id: 'def', icon: '🛡️', title: '守備で奪えている', evidence: [`スティール ${ub.stl}・ブロック ${ub.blk}`], how: '奪った後の速攻までをセットで練習。', clips: { preset: 'defense' } });
    if (M.biggest[us] >= 8) {
      const bestRun = M.runs.filter((r) => r.team === us).sort((a, b) => b.pts - a.pts)[0];
      strengths.push({ id: 'lead', icon: '📈', title: `最大${M.biggest[us]}点のリードを作れた`, evidence: [bestRun ? `${BS.clips.perLabel(M.periodAt(bestRun.t0))} に ${bestRun.pts}-0 のラン` : `最大リード ${M.biggest[us]}点`], how: 'このときの守備・速攻の形を、後半も続けられるように。', clips: bestRun ? { events: bestRun.evs.map((e) => e.id) } : { preset: 'score' } });
    }

    issues.forEach((it) => { it.impact = Math.max(0, BS.round(it.impact, 1)); });
    issues.sort((a, b) => b.impact - a.impact);

    /* ---------- 選手ごと ---------- */
    const roster = project.teams[us].players;
    const ours = roster.map((rp) => M.players[rp.id]).filter(Boolean);
    const pmSorted = ours.filter((p) => p.box.min >= 6).sort((a, b) => b.box.pm - a.box.pm);
    const players = ours.map((p) => {
      const b = p.box;
      const good = [], improve = [];
      const played = b.min >= 3 || b.fga + b.fta + b.reb + b.ast + b.tov + b.pf > 0;
      if (!played) return null;
      if (b.pts >= 12 && (b.tsp || 0) >= 0.52) good.push(`得点源：${b.pts}点（FG ${b.fgm}/${b.fga}・TS% ${pc(b.tsp)}）`);
      else if (b.pts >= 8 && (b.tsp || 0) >= 0.55) good.push(`効率よく ${b.pts}点（TS% ${pc(b.tsp)}）`);
      if (b.ast >= 5 && b.ast >= 2 * Math.max(1, b.tov)) good.push(`司令塔として安定（AST ${b.ast}・TO ${b.tov}）`);
      else if (b.ast >= 5) good.push(`アシスト ${b.ast}`);
      if (b.reb >= 8) good.push(`リバウンド ${b.reb}本（OR ${b.or}）`);
      if (b.stl + b.blk >= 3) good.push(`守備で奪った（STL ${b.stl}・BLK ${b.blk}）`);
      if (b.p3a >= 4 && b.p3m / b.p3a >= 0.4) good.push(`3P ${b.p3m}/${b.p3a}`);
      if (!p.starter && b.eff >= 10) good.push(`ベンチから出て EFF ${b.eff}（出場 ${b.min.toFixed(0)}分）`);
      if (pmSorted.length && pmSorted[0] === p && b.pm > 0) good.push(`出場中のチーム得失点差 ${BS.signed(b.pm)}（チーム最高）`);
      if (b.fga >= 8 && (b.tsp || 1) < 0.42) improve.push(`シュート効率（FG ${b.fgm}/${b.fga}・TS% ${pc(b.tsp)}）→ 打つ場所・タイミングの見直し`);
      if (b.tov >= 4) {
        const kinds = {};
        M.events.forEach((e) => { if (e.type === 'to' && e.pid === p.id) kinds[e.kind || 'none'] = (kinds[e.kind || 'none'] || 0) + 1; });
        const k = Object.entries(kinds).filter(([x]) => x !== 'none').sort((a, c) => c[1] - a[1])[0];
        improve.push(`TO ${b.tov}回${k ? `（${BS.toLabel(k[0])} ${k[1]}）` : ''}`);
      }
      if (b.pf >= 4) {
        const early = p.fouls.filter((f) => f._per <= 2).length;
        improve.push(`ファウル ${b.pf}${b.pf >= 5 ? '（退場）' : ''}${early >= 2 ? `・前半で${early}個` : ''} → 手を使わない守備`);
      }
      if (b.fta >= 4 && b.ftm / b.fta < 0.55) improve.push(`FT ${b.ftm}/${b.fta} → ルーティンを固める`);
      if ((p.pos === 'C' || p.pos === 'PF') && b.min >= 12 && b.reb <= 3) improve.push(`リバウンド ${b.reb}本 → ボックスアウトから`);
      if (b.p3a >= 4 && b.p3m / b.p3a <= 0.2) improve.push(`3P ${b.p3m}/${b.p3a} → 無理な3Pを減らす`);
      if (pmSorted.length > 2 && pmSorted[pmSorted.length - 1] === p && b.pm <= -8) improve.push(`出場中の得失点差 ${BS.signed(b.pm)}（守備の約束の確認を）`);
      return { pid: p.id, no: p.no, name: p.name, pos: p.pos, starter: p.starter, box: b, good, improve };
    }).filter(Boolean);

    /* ---------- 相手の要注意選手（スカウティング） ---------- */
    const theirs = project.teams[them].players.map((rp) => M.players[rp.id]).filter(Boolean);
    const scouting = [];
    const topScorer = theirs.slice().sort((a, b) => b.box.pts - a.box.pts)[0];
    if (topScorer && topScorer.box.pts >= 10) {
      const zs = BS.ZONES.map((z) => [z, topScorer.zones[z.id]]).filter(([, v]) => v.fga).sort((a, b) => b[1].pts - a[1].pts)[0];
      scouting.push({ pid: topScorer.id, text: `${nm(project, topScorer.id)}：${topScorer.box.pts}点${zs ? `（${zs[0].label}で${zs[1].pts}点）` : ''} → マッチアップとヘルプを決めておく`, clips: { stat: 'pts', pid: topScorer.id } });
    }
    const topOR2 = theirs.slice().sort((a, b) => b.box.or - a.box.or)[0];
    if (topOR2 && topOR2.box.or >= 4) scouting.push({ pid: topOR2.id, text: `${nm(project, topOR2.id)}：オフェンスリバウンド ${topOR2.box.or}本 → ボックスアウト担当を固定`, clips: { stat: 'or', pid: topOR2.id } });
    const topStl = theirs.slice().sort((a, b) => b.box.stl - a.box.stl)[0];
    if (topStl && topStl.box.stl >= 3) scouting.push({ pid: topStl.id, text: `${nm(project, topStl.id)}：スティール ${topStl.box.stl} → この選手の前での横パス・ドリブルに注意`, clips: { stat: 'stl', pid: topStl.id } });
    const top3 = theirs.filter((p) => p.box.p3a >= 4).sort((a, b) => b.box.p3m - a.box.p3m)[0];
    if (top3 && top3.box.p3m >= 2 && top3.box.p3m / top3.box.p3a >= 0.35) scouting.push({ pid: top3.id, text: `${nm(project, top3.id)}：3P ${top3.box.p3m}/${top3.box.p3a} → 離れすぎない`, clips: { stat: 'p3a', pid: top3.id } });

    /* ---------- 次の練習メニュー（課題の上位から） ---------- */
    const practice = [];
    const mins = [20, 15, 15, 10];
    issues.slice(0, 3).forEach((it, i) => { practice.push({ title: it.drills[0], minutes: mins[i], why: it.title }); });
    if (issues.length) practice.push({ title: '5対5（課題のルール付き）', minutes: 20, why: `「${issues[0].title}」を試合形式で確認` });
    if (!issues.find((i) => i.id === 'ft')) practice.push({ title: 'フリースロー（2本×5セット、ダッシュ後）', minutes: 10, why: '毎回のルーティン' });

    return { headline, factors, issues, strengths, players, scouting, practice, us, them, usName, themName, enough };
  }

  function topBy(M, team, fn) {
    return Object.values(M.players).filter((p) => p.team === team).sort((a, b) => fn(b.box) - fn(a.box))[0];
  }

  /* アドバイスの clips 指定 → イベント一覧 or プリセット */
  function resolveClips(project, M, spec) {
    if (!spec) return { events: [] };
    if (spec.preset) return { preset: spec.preset, cause: spec.cause || null };
    if (spec.events) return { events: M.events.filter((e) => spec.events.includes(e.id)) };
    if (spec.zone) return { events: M.events.filter((e) => e.type === 'shot' && e.team === spec.team && e._zone === spec.zone) };
    if (spec.play) {
      const ids = new Set();
      M.poss.filter((p) => p.team === spec.team && (p.play || 'other') === spec.play).forEach((p) => {
        const last = p.evs.filter((e) => e.type === 'shot' || e.type === 'to' || e.type === 'ft').pop();
        if (last) ids.add(last.id);
      });
      return { events: M.events.filter((e) => ids.has(e.id)) };
    }
    if (spec.scene) {
      const ids = new Set();
      M.poss.filter((p) => p.team === spec.team && p.scene === spec.scene).forEach((p) => {
        const last = p.evs.filter((e) => e.type === 'shot' || e.type === 'to' || e.type === 'ft').pop();
        if (last) ids.add(last.id);
      });
      return { events: M.events.filter((e) => ids.has(e.id)) };
    }
    return { events: BS.model.eventsFor(M, spec) };
  }

  BS.advice = { analyze, resolveClips };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/tagger.js */
/* バスケ分析スタジオ — タグ入力（キーボード・マウス共通の状態機械）
   「選手 → プレー」「プレー → 選手」どちらの順でも入力でき、
   シュート成功→アシスト、失敗→リバウンド、TO→種類→スティール、ファウル→種類→被ファウル
   のように続けて聞く（Enter で省略）。DOM 非依存。 */
(function (root) {
  'use strict';
  const BS = root.BS;

  const ACTIONS = [
    { id: '2m', label: '2P成功', code: 'KeyW', key: 'W', cls: 'made' },
    { id: '2x', label: '2P失敗', code: 'KeyE', key: 'E', cls: 'miss' },
    { id: '3m', label: '3P成功', code: 'KeyR', key: 'R', cls: 'made' },
    { id: '3x', label: '3P失敗', code: 'KeyT', key: 'T', cls: 'miss' },
    { id: 'fm', label: 'FT成功', code: 'KeyF', key: 'F', cls: 'made' },
    { id: 'fx', label: 'FT失敗', code: 'KeyG', key: 'G', cls: 'miss' },
    { id: 'reb', label: 'リバウンド', code: 'KeyD', key: 'D', cls: 'neutral' },
    { id: 'ast', label: 'アシスト', code: 'KeyA', key: 'A', cls: 'neutral' },
    { id: 'to', label: 'ターンオーバー', short: 'TO', code: 'KeyX', key: 'X', cls: 'bad' },
    { id: 'stl', label: 'スティール', code: 'KeyS', key: 'S', cls: 'good' },
    { id: 'blk', label: 'ブロック', code: 'KeyB', key: 'B', cls: 'good' },
    { id: 'foul', label: 'ファウル', code: 'KeyC', key: 'C', cls: 'bad' },
    { id: 'sub', label: '交代', code: 'KeyU', key: 'U', cls: 'game' },
    { id: 'timeout', label: 'タイムアウト', short: 'タイム', code: 'KeyY', key: 'Y', cls: 'game', noPlayer: true },
    { id: 'period', label: 'ピリオド開始', short: 'ピリオド', code: 'KeyP', key: 'P', cls: 'game', noPlayer: true },
    { id: 'mark', label: 'マーク', code: 'KeyM', key: 'M', cls: 'game', noPlayer: true }
  ];
  const BY_ID = {};
  ACTIONS.forEach((a) => { BY_ID[a.id] = a; });

  function createTagger(hooks) {
    const bus = BS.emitter();
    const st = { team: 0, sel: null, act: null, t0: null, flow: null, digits: '', pendingLoc: null, locTarget: null, last: null };
    let digitTimer = null;

    const proj = () => hooks.project();
    const now = () => hooks.now();
    function playerById(pid) {
      for (const t of proj().teams) { const p = t.players.find((x) => x.id === pid); if (p) return Object.assign({ team: t.id }, p); }
      return null;
    }
    const teamOf = (pid) => { const p = playerById(pid); return p ? p.team : null; };
    const who = (pid) => (pid ? BS.clips.nameOf(proj(), pid) : 'チーム');
    const events = () => proj().events || [];
    const findEv = (id) => events().find((e) => e.id === id);
    const changed = () => bus.emit('change', st);
    const flash = (text, kind) => { st.last = { text, kind: kind || 'ok', at: Date.now() }; hooks.toast && hooks.toast(text, kind || 'ok'); };

    function add(evs) {
      evs.forEach((e) => { if (!e.id) e.id = BS.uid('t'); e.t = Math.round(e.t * 100) / 100; });
      hooks.add(evs);
      return evs;
    }

    function expectTeam() {
      if (st.flow && st.flow.team != null) return st.flow.team;
      return st.team;
    }
    function expectsOption() {
      return st.flow && (st.flow.kind === 'totype' || st.flow.kind === 'foultype' || st.flow.kind === 'period');
    }

    /* ---------- 番号キー ---------- */
    function clearDigits() { st.digits = ''; if (digitTimer) { clearTimeout(digitTimer); digitTimer = null; } }
    function digit(d) {
      if (expectsOption()) { option(Number(d)); return; }
      st.digits += String(d);
      const team = expectTeam();
      const roster = (proj().teams[team] || { players: [] }).players;
      const exact = roster.find((p) => String(p.no) === st.digits);
      const longer = roster.some((p) => String(p.no).length > st.digits.length && String(p.no).startsWith(st.digits));
      if (digitTimer) { clearTimeout(digitTimer); digitTimer = null; }
      if (exact && !longer) { resolveDigits(); return; }
      // 名簿にない番号：2桁そろったら（または名簿に足せない場面なら）すぐ決める。1桁なら、2桁目を少し待つ
      if (!exact && !longer && (st.digits.length >= 2 || !hooks.addPlayer)) { resolveDigits(); return; }
      digitTimer = setTimeout(() => { digitTimer = null; resolveDigits(); }, hooks.digitWait || 750);
      changed();
    }
    function resolveDigits() {
      if (!st.digits) return;
      const team = expectTeam();
      const T = proj().teams[team] || { players: [], short: '' };
      const p = T.players.find((x) => String(x.no) === st.digits);
      const typed = st.digits;
      clearDigits();
      if (p) { player(p.id); return; }
      // 名簿にない番号。相手チームにその番号がいるなら、チームの取り違えの可能性が高いので足さない
      const other = (proj().teams[1 - team] || { players: [] }).players.find((x) => String(x.no) === typed);
      if (other) { flash(`${T.short} に #${typed} はいません（相手チームの番号です。Q でチーム切替）`, 'err'); changed(); return; }
      const pid = hooks.addPlayer ? hooks.addPlayer(team, typed) : null;
      if (!pid) { flash(`${T.short} に #${typed} はいません`, 'err'); changed(); return; }
      flash(`#${typed} を ${T.short} の名簿に追加しました（👥 チーム・選手 で名前を入れられます）`, 'info');
      player(pid);
    }
    function flushDigits() { if (st.digits) resolveDigits(); }

    /* ---------- 選手 ---------- */
    function player(pid, teamHint) {
      const team = pid ? teamOf(pid) : teamHint;
      if (st.flow) { fillFlow(pid, team); return; }
      if (st.act) { commit(st.act, pid, st.t0, team); return; }
      if (!pid) { st.team = team != null ? team : st.team; changed(); return; }
      st.sel = pid; st.team = team;
      st.t0 = now();
      changed();
    }

    /* ---------- プレー ---------- */
    function action(id) {
      const A = BY_ID[id];
      if (!A) return;
      if (st.flow) { st.flow = null; }
      if (A.noPlayer) {
        const team = st.sel ? teamOf(st.sel) : st.team;
        const t = st.t0 != null && st.sel ? st.t0 : now();
        st.sel = null; st.act = null; st.t0 = null;
        if (id === 'timeout') { add([{ type: 'timeout', t, team }]); flash(`タイムアウト（${proj().teams[team].short}）`); }
        else if (id === 'mark') { add([{ type: 'mark', t, text: '' }]); flash('マークしました（一覧でメモを書けます）'); }
        else if (id === 'period') { st.flow = { kind: 'period', t, def: currentPeriod(t) + 1 }; }
        changed();
        return;
      }
      if (st.sel) { commit(id, st.sel, st.t0); return; }
      st.act = id; st.t0 = now();
      changed();
    }

    function currentPeriod(t) {
      let n = 0;
      events().forEach((e) => { if (e.type === 'period' && e.t <= t + 0.01) n = Math.max(n, e.n || 0); });
      return n;
    }

    function lastShot(team, t, within, pred) {
      const list = events().filter((e) => e.type === 'shot' && e.team === team && e.t <= t + 0.05 && t - e.t <= within && pred(e));
      return list.sort((a, b) => b.t - a.t)[0] || null;
    }
    function autoOff(team, t) {
      const miss = events().filter((e) => ((e.type === 'shot' && !e.made) || (e.type === 'ft' && !e.made)) && e.t <= t + 0.05 && t - e.t <= 10)
        .sort((a, b) => b.t - a.t)[0];
      return miss ? miss.team === team : false;
    }

    function commit(id, pid, t, teamHint) {
      const team = pid ? teamOf(pid) : teamHint;
      if (t == null) t = now();
      st.sel = null; st.act = null; st.t0 = null;
      if (team == null) { changed(); return; }
      switch (id) {
        case '2m': case '2x': case '3m': case '3x': {
          if (!pid) { flash('シュートは選手を選んでください', 'err'); break; }
          const made = id[1] === 'm', pts = Number(id[0]);
          const e = { type: 'shot', t, team, pid, made, pts, sx: null, sy: null, ast: null, blk: null };
          if (st.pendingLoc && Math.abs(t - st.pendingLoc.t) < 20) { e.sx = st.pendingLoc.sx; e.sy = st.pendingLoc.sy; st.pendingLoc = null; }
          add([e]);
          st.locTarget = e.id;
          flash(`${who(pid)} ${pts}P${made ? '成功' : '失敗'}`, made ? 'ok' : 'info');
          st.flow = made ? { kind: 'assist', team, ref: e.id, shooter: pid } : { kind: 'reb', team: 1 - team, ref: e.id, shooterTeam: team };
          break;
        }
        case 'fm': case 'fx': {
          if (!pid) { flash('フリースローは選手を選んでください', 'err'); break; }
          const made = id === 'fm';
          const e = add([{ type: 'ft', t, team, pid, made }])[0];
          flash(`${who(pid)} FT${made ? '成功' : '失敗'}`, made ? 'ok' : 'info');
          if (!made) st.flow = { kind: 'reb', team: 1 - team, ref: e.id, shooterTeam: team };
          break;
        }
        case 'reb': {
          const off = autoOff(team, t);
          add([{ type: 'reb', t, team, pid: pid || null, off }]);
          flash(`${who(pid)} ${off ? 'オフェンス' : 'ディフェンス'}リバウンド`);
          break;
        }
        case 'ast': {
          const target = lastShot(team, t, 12, (e) => e.made && !e.ast && e.pid !== pid);
          if (!target) { flash('直前（12秒以内）に同じチームの成功シュートがありません', 'err'); break; }
          hooks.update(target.id, { ast: pid });
          flash(`アシスト ${who(pid)} → ${who(target.pid)}`);
          break;
        }
        case 'blk': {
          const target = lastShot(1 - team, t, 6, (e) => !e.made && !e.blk);
          if (!target) {
            flash('直前（6秒以内）に相手の失敗シュートがありません。先に失敗シュートを入力してください', 'err');
            break;
          }
          hooks.update(target.id, { blk: pid });
          flash(`ブロック ${who(pid)}`);
          break;
        }
        case 'to': {
          const e = add([{ type: 'to', t, team, pid: pid || null, kind: null, stl: null }])[0];
          flash(`${who(pid)} ターンオーバー`, 'info');
          st.flow = { kind: 'totype', team, ref: e.id, pid };
          break;
        }
        case 'stl': {
          if (!pid) { flash('スティールは選手を選んでください', 'err'); break; }
          const e = add([{ type: 'to', t, team: 1 - team, pid: null, kind: null, stl: pid }])[0];
          flash(`スティール ${who(pid)}`);
          st.flow = { kind: 'lost', team: 1 - team, ref: e.id };
          break;
        }
        case 'foul': {
          if (!pid) { flash('ファウルは選手を選んでください', 'err'); break; }
          const e = add([{ type: 'foul', t, team, pid, kind: 'P', drawn: null }])[0];
          flash(`${who(pid)} ファウル`, 'info');
          st.flow = { kind: 'foultype', team, ref: e.id, pid };
          break;
        }
        case 'sub': {
          if (!pid) break;
          const on = hooks.onCourt ? hooks.onCourt(team, t) : null;
          const isOn = on ? on.includes(pid) : true;
          st.flow = { kind: isOn ? 'subin' : 'subout', team, ref: pid, t };
          break;
        }
        default: break;
      }
      changed();
    }

    function fillFlow(pid, team) {
      const f = st.flow;
      if (!f) return;
      if (f.kind === 'assist') {
        if (!pid || team !== f.team) { flash('アシストは同じチームの選手です', 'err'); return; }
        if (pid === f.shooter) { flash('シュートした本人はアシストになりません', 'err'); return; }
        hooks.update(f.ref, { ast: pid });
        flash(`アシスト ${who(pid)}`);
        st.flow = null;
      } else if (f.kind === 'reb') {
        const t = now();
        const rt = pid ? team : f.team;
        add([{ type: 'reb', t, team: rt, pid: pid || null, off: rt === f.shooterTeam }]);
        flash(`${who(pid)} ${rt === f.shooterTeam ? 'オフェンス' : 'ディフェンス'}リバウンド`);
        st.flow = null;
      } else if (f.kind === 'steal') {
        if (!pid || team !== f.team) { flash('スティールは相手チームの選手です', 'err'); return; }
        hooks.update(f.ref, { stl: pid });
        flash(`スティール ${who(pid)}`);
        st.flow = null;
      } else if (f.kind === 'lost') {
        if (pid && team !== f.team) { flash('ボールを失ったのは相手チームの選手です', 'err'); return; }
        hooks.update(f.ref, { pid: pid || null });
        flash(`TO ${who(pid)}`);
        st.flow = null;
      } else if (f.kind === 'drawn') {
        if (!pid || team !== f.team) { flash('ファウルを受けたのは相手チームの選手です', 'err'); return; }
        hooks.update(f.ref, { drawn: pid });
        flash(`ファウルを受けた選手 ${who(pid)}`);
        st.flow = null;
      } else if (f.kind === 'assign') {
        // 自動検出したプレーに選手を付ける（確認モード）
        const e = findEv(f.ref);
        if (!e) { st.flow = null; changed(); return; }
        if (!pid) { flash('選手を選んでください（違う場面なら Delete）', 'err'); return; }
        const patch = { pid, ok: true };
        if (team !== e.team) patch.team = team;
        // リバウンドの「オフェンス／ディフェンス」は推定なので、取ったチームを直したら入れ替える
        if (e.type === 'reb') { if (team !== e.team) patch.off = !e.off; patch.est = false; }
        hooks.update(f.ref, patch);
        flash(`${who(pid)} に決定`);
        st.flow = (e.type === 'shot' && e.made) ? { kind: 'assist', team, ref: f.ref, shooter: pid } : null;
      } else if (f.kind === 'subin' || f.kind === 'subout') {
        if (!pid || team !== f.team) { flash('同じチームの選手を選んでください', 'err'); return; }
        if (pid === f.ref) { flash('別の選手を選んでください', 'err'); return; }
        const out = f.kind === 'subin' ? f.ref : pid, inn = f.kind === 'subin' ? pid : f.ref;
        add([{ type: 'sub', t: f.t, team: f.team, out, in: inn }]);
        flash(`交代 IN ${who(inn)} / OUT ${who(out)}`);
        st.flow = null;
      } else if (expectsOption()) {
        flash('番号キーで種類を選んでください（Enter で省略）', 'err');
        return;
      }
      changed();
    }

    function optionsFor(flow) {
      if (!flow) return null;
      if (flow.kind === 'totype') return BS.TO_KINDS.map((k, i) => ({ v: i + 1, id: k.id, label: k.label }));
      if (flow.kind === 'foultype') return BS.FOUL_KINDS.map((k, i) => ({ v: i + 1, id: k.id, label: k.label }));
      if (flow.kind === 'period') return [1, 2, 3, 4, 5].map((n) => ({ v: n, id: n, label: n > 4 ? '延長' : n + 'Q' }));
      return null;
    }
    function option(v) {
      const f = st.flow;
      const opts = optionsFor(f);
      if (!opts) return;
      const o = opts.find((x) => x.v === Number(v));
      if (!o) { flash('その番号の選択肢はありません', 'err'); return; }
      if (f.kind === 'totype') {
        const ev = findEv(f.ref);
        if (o.id === 'offfoul' && ev) {
          hooks.remove(f.ref);
          const fe = add([{ type: 'foul', t: ev.t, team: ev.team, pid: ev.pid, kind: 'O', drawn: null }])[0];
          flash('オフェンスファウル（TOとファウルに数えます）', 'info');
          st.flow = ev.pid ? { kind: 'drawn', team: 1 - ev.team, ref: fe.id } : null;
        } else {
          hooks.update(f.ref, { kind: o.id });
          flash(`TOの種類：${o.label}`);
          st.flow = (o.id === 'pass' || o.id === 'lost') ? { kind: 'steal', team: 1 - f.team, ref: f.ref } : null;
        }
      } else if (f.kind === 'foultype') {
        hooks.update(f.ref, { kind: o.id });
        flash(`ファウルの種類：${o.label}${o.id === 'O' ? '（TOにも数えます）' : ''}`);
        st.flow = { kind: 'drawn', team: 1 - f.team, ref: f.ref };
      } else if (f.kind === 'period') {
        add([{ type: 'period', t: f.t, n: o.id }]);
        flash(`${o.label} 開始を記録`);
        st.flow = null;
      }
      changed();
    }

    function enter() {
      if (st.flow) {
        const f = st.flow;
        if (f.kind === 'totype') st.flow = { kind: 'steal', team: 1 - f.team, ref: f.ref };
        else if (f.kind === 'foultype') st.flow = { kind: 'drawn', team: 1 - f.team, ref: f.ref };
        else if (f.kind === 'period') { option(f.def > 5 ? 5 : Math.max(1, f.def)); return; }
        else st.flow = null;
        changed();
        return;
      }
      if (st.act === 'reb' || st.act === 'to') { commit(st.act, null, st.t0, st.team); return; }
      if (st.act || st.sel) { st.act = null; st.sel = null; st.t0 = null; }
      changed();
    }
    function esc() {
      const busy = st.sel || st.act || st.flow || st.pendingLoc;
      st.sel = null; st.act = null; st.t0 = null; st.flow = null; st.pendingLoc = null;
      if (busy) flash('入力を取り消しました', 'info');
      changed();
    }
    function toggleTeam() {
      if (st.flow && st.flow.team != null && !expectsOption()) st.flow.team = 1 - st.flow.team;
      else st.team = 1 - st.team;
      clearDigits();
      changed();
    }
    function loc(sx, sy) {
      const target = st.locTarget ? findEv(st.locTarget) : null;
      const t = now();
      if (target && target.sx == null && Math.abs(t - target.t) < 10) {
        hooks.update(target.id, { sx, sy });
        flash(`シュート位置を記録（${BS.zoneLabel(BS.shotZone(sx, sy).zone)}）`);
      } else {
        st.pendingLoc = { sx, sy, t };
        flash('位置を仮置き → 次に入力するシュートに付きます', 'info');
      }
      changed();
    }

    function input(ev) {
      if (!ev) return;
      switch (ev.k) {
        case 'digit': digit(ev.d); break;
        case 'player': flushDigitsSilently(); player(ev.pid, ev.team); break;
        case 'action': flushDigits(); action(ev.id); break;
        case 'option': clearDigits(); option(ev.v); break;
        case 'enter': if (st.digits) resolveDigits(); else enter(); break;
        case 'esc': clearDigits(); esc(); break;
        case 'team': toggleTeam(); break;
        case 'loc': loc(ev.sx, ev.sy); break;
        default: break;
      }
    }
    function flushDigitsSilently() { clearDigits(); }

    /* 画面に出す案内 */
    function prompt() {
      const P = proj();
      const tn = (t) => (P.teams[t] ? P.teams[t].short : '');
      const f = st.flow;
      const typing = st.digits ? `番号 ${st.digits}_` : '';
      if (f) {
        const opts = optionsFor(f);
        const map = {
          assist: [`アシストは？`, `${tn(f.team)} の番号 / クリック ・ Enter＝なし`],
          reb: [`リバウンドは？（映像を見ながら）`, `${tn(f.team)} の番号 / クリック ・ Q＝チーム切替 ・ Enter＝省略`],
          totype: ['TOの種類は？', '番号キーで選択 ・ Enter＝省略'],
          steal: ['スティールした選手は？', `${tn(f.team)} の番号 / クリック ・ Enter＝なし`],
          lost: ['ボールを失った選手は？', `${tn(f.team)} の番号 / クリック ・ Enter＝不明`],
          foultype: ['ファウルの種類は？', '番号キーで選択 ・ Enter＝通常'],
          drawn: ['ファウルを受けた選手は？', `${tn(f.team)} の番号 / クリック ・ Enter＝省略`],
          subin: [`交代で入る選手は？（OUT ${who(f.ref)}）`, `${tn(f.team)} の番号 / クリック`],
          subout: [`交代で下がる選手は？（IN ${who(f.ref)}）`, `${tn(f.team)} の番号 / クリック`],
          period: ['何ピリオドの開始？', `番号キー ・ Enter＝${f.def > 4 ? '延長' : f.def + 'Q'}`],
          assign: ['⚡ 誰のプレー？', `${tn(f.team)} の番号 / クリック ・ Q＝チーム切替`]
        };
        const m = map[f.kind] || ['', ''];
        return { main: m[0], hint: typing || m[1], options: opts, expect: opts ? 'option' : 'player', team: f.team != null ? f.team : st.team, flow: f.kind };
      }
      if (st.act) {
        return { main: `${BY_ID[st.act].label} → 誰？`, hint: typing || `${tn(st.team)} の番号 / クリック ・ Q＝チーム切替 ・ Esc＝取消`, expect: 'player', team: st.team, act: st.act };
      }
      if (st.sel) {
        return { main: `${who(st.sel)} → プレーは？`, hint: 'W/E＝2P成功/失敗 R/T＝3P F/G＝FT D＝リバウンド X＝TO C＝ファウル…', expect: 'action', team: st.team, sel: st.sel };
      }
      return { main: '選手とプレーを入力', hint: typing || `番号キー（${tn(st.team)}）かクリックで選手、W・E・R…でプレー。順番はどちらでもOK`, expect: 'any', team: st.team };
    }

    function busy() { return !!(st.sel || st.act || st.digits || (st.flow && st.flow.kind !== 'reb')); }
    function waitingRebound() { return !!(st.flow && st.flow.kind === 'reb'); }
    function validate() {
      if (st.flow && st.flow.ref && st.flow.kind !== 'subin' && st.flow.kind !== 'subout' && !findEv(st.flow.ref)) { st.flow = null; changed(); }
      if (st.locTarget && !findEv(st.locTarget)) st.locTarget = null;
    }
    function reset() { clearDigits(); st.sel = null; st.act = null; st.t0 = null; st.flow = null; st.pendingLoc = null; st.locTarget = null; changed(); }
    function setTeam(t) { st.team = t; changed(); }
    function beginAssign(evId) {
      const e = findEv(evId);
      if (!e) return false;
      clearDigits();
      st.sel = null; st.act = null; st.t0 = null;
      st.flow = { kind: 'assign', team: e.team, ref: evId };
      changed();
      return true;
    }

    return { input, prompt, state: () => st, on: bus.on, busy, waitingRebound, validate, reset, setTeam, beginAssign, ACTIONS, BY_ID };
  }

  BS.TAG_ACTIONS = ACTIONS;
  BS.createTagger = createTagger;
})(typeof window !== 'undefined' ? window : globalThis);

    /* 速い版：テンプレート全体が画面内にあるときだけ使う（画素の位置を先に計算しておく） */
