  }
  function hexA(hex, a) {
    const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
    if (!m) return `rgba(128,128,128,${a})`;
    return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})`;
  }

  /* ---------- タグ一覧 ---------- */
  function buildLog() {
    const box = $('#log');
    const chips = [['all', 'すべて'], ['us', '自チーム'], ['them', '相手'], ['score', '得点'], ['miss', 'シュート失敗'], ['tov', 'TO'], ['foul', 'ファウル'], ['mark', 'マーク']];
    box.append(
      h('div', { class: 'log-head' },
        h('b', { id: 'logTitle' }, 'タグ一覧'),
        chips.map(([id, lab]) => h('button', { class: 'chip' + (id === logFilter ? ' on' : ''), dataset: { f: id }, onclick: () => { logFilter = id; box.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c.dataset.f === id)); renderLog(true); } }, lab)),
        h('label', { class: 'switch', style: { marginLeft: 'auto' }, title: '再生中、今の位置のタグを自動で表示' }, h('input', { type: 'checkbox', checked: true, onchange: (e) => { logFollow = e.target.checked; } }), '追従')),
      h('div', { class: 'log-list', id: 'logList' })
    );
  }
  function logMatch(e, us) {
    switch (logFilter) {
      case 'us': return e.team === us;
      case 'them': return e.team === 1 - us;
      case 'score': return (e.type === 'shot' || e.type === 'ft') && e.made;
      case 'miss': return e.type === 'shot' && !e.made;
      case 'tov': return e.type === 'to' || (e.type === 'foul' && e.kind === 'O');
      case 'foul': return e.type === 'foul';
      case 'mark': return e.type === 'mark';
      default: return true;
    }
  }
  function renderLog(force) {
    const list = $('#logList');
    if (!list) return;
    const P = app.store.project, M = app.model();
    const key = app.dataVersion + '|' + logFilter;
    if (!force && key === lastLogKey) return;
    lastLogKey = key;
    const us = P.ourTeam || 0;
    const evs = M.events.filter((e) => logMatch(e, us));
    $('#logTitle').textContent = `タグ一覧（${M.events.length}）`;
    list.innerHTML = '';
    if (!evs.length) {
      list.appendChild(h('div', { class: 'log-empty' }, M.events.length ? 'この条件のタグはありません' : 'まだタグがありません。映像を見ながら、番号キー＋W/E/R… でタグを付けます（右の「タグ付け」タブ）。'));
      return;
    }
    const frag = document.createDocumentFragment();
    const scoreAfter = new Map();
    M.flow.forEach((f) => { if (f.ev) scoreAfter.set(f.ev.id, f.s); });
    let last = [0, 0];
    const lastScore = new Map();
    M.events.forEach((e) => { if (scoreAfter.has(e.id)) last = scoreAfter.get(e.id); lastScore.set(e.id, last); });
    evs.forEach((e) => {
      const s = lastScore.get(e.id) || [0, 0];
      const col = e.team === 0 || e.team === 1 ? BS.ui.teamColor(P, e.team) : '#94a3b8';
      const row = h('div', { class: 'log-row', dataset: { id: e.id }, title: 'クリックでこの場面へ・ダブルクリックで編集' },
        h('span', { class: 'tm' }, BS.fmtTime(e.t)),
        h('span', { class: 'note' }, BS.clips.perLabel(e._per || 1)),
        h('span', { class: 'dot', style: { background: col } }),
        h('span', { class: 'desc' }, BS.clips.describe(P, e)),
        h('span', { class: 'sc' }, `${s[0]}-${s[1]}`),
        h('span', { class: 'ops' },
          h('button', { title: '編集', onclick: (ev) => { ev.stopPropagation(); BS.uiSetup.editEvent(e.id); } }, '✎'),
          h('button', { title: '削除（Cmd/Ctrl+Z で戻せます）', onclick: (ev) => { ev.stopPropagation(); app.store.removeEvent(e.id, 'タグ削除'); BS.ui.toast('タグを削除しました', 'warn', 4000, { label: '元に戻す', fn: () => app.undo() }); } }, '🗑')));
      row.addEventListener('click', () => { app.seek(Math.max(0, e.t - 2)); });
      row.addEventListener('dblclick', () => BS.uiSetup.editEvent(e.id));
      frag.appendChild(row);
    });
    list.appendChild(frag);
    curRowId = null;
    updateCurrentRow(true);
  }
  function updateCurrentRow(forceScroll) {
    const list = $('#logList');
    if (!list) return;
    const M = app.model();
    const t = app.time() + 0.05;
    let cur = null;
    for (const e of M.events) { if (e.t <= t) cur = e; else break; }
    const id = cur ? cur.id : null;
    if (id === curRowId && !forceScroll) return;
    curRowId = id;
    list.querySelectorAll('.log-row.cur').forEach((r) => r.classList.remove('cur'));
    if (!id) return;
    const row = list.querySelector(`.log-row[data-id="${id}"]`);
    if (row) {
      row.classList.add('cur');
      if (logFollow && (!app.paused() || forceScroll) && !list.matches(':hover')) {
        const top = row.offsetTop - list.clientHeight / 2;
        list.scrollTop = Math.max(0, top);
      }
    }
  }
  function flashRow(id) {
    const row = document.querySelector(`.log-row[data-id="${id}"]`);
    if (row) { row.classList.remove('flashrow'); void row.offsetWidth; row.classList.add('flashrow'); }
  }

  /* ---------- 時刻表示・ゲーム状況 ---------- */
  let lastTimeKey = '', lastGameKey = '';
  function onTime() {
    const t = app.time(), d = app.duration();
    const tt = $('#timeText');
    const timeKey = BS.fmtTime(t) + '/' + BS.fmtTime(d);
    if (tt && timeKey !== lastTimeKey) { lastTimeKey = timeKey; tt.innerHTML = `<b>${BS.fmtTime(t)}</b> / ${BS.fmtTime(d)}`; }
    const P = app.store.project, M = app.model();
    let s = [0, 0];
    for (const f of M.flow) { if (f.t <= t) s = f.s; else break; }
    const per = M.periodAt(t);
    const gs = $('#gameState');
    const gameKey = [per, s[0], s[1], P.teams[0].short, P.teams[1].short, P.teams[0].color, P.teams[1].color].join('|');
    if (gs && gameKey !== lastGameKey) {
      lastGameKey = gameKey;
      gs.innerHTML = '';
      gs.append(h('span', { class: 'note' }, BS.clips.perLabel(per)),
        h('span', { class: 'dot', style: { background: BS.ui.teamColor(P, 0) } }), `${P.teams[0].short} ${s[0]}`,
        h('span', { class: 'note' }, '-'),
        `${s[1]} ${P.teams[1].short}`, h('span', { class: 'dot', style: { background: BS.ui.teamColor(P, 1) } }));
    }
    // 再生ボタンの記号は、変わったときだけ書き換える（ここは再生中、毎コマ呼ばれる。毎回書き直すと、
    // ボタンを押している間に中の文字が入れ替わり、Safari では一時停止のクリックが届かなくなる）
    const ico = $('#btnPlay .ico'), mark = app.paused() ? '▶' : '⏸';
    if (ico && ico.textContent !== mark) ico.textContent = mark;
    drawTimeline();
    updateCurrentRow(false);
  }
  function onChange() {
    tlStaticKey = '';
    renderLog(true);
    onTime();
    const lg = $('#tlLegend');
    if (lg && app) {
      const P = app.store.project;
      lg.innerHTML = '';
      lg.append(
        h('span', null, h('span', { class: 'dot', style: { background: BS.ui.teamColor(P, 0), borderRadius: '50%' } }), '得点'),
        h('span', null, h('b', { style: { color: '#f87171' } }, '×'), 'TO'),
        h('span', null, h('b', { style: { color: '#fbbf24' } }, '▲'), 'ファウル'),
        app.model().events.some((e) => e.auto && !e.ok) ? h('span', null, h('b', { style: { color: '#fde047' } }, '⚡'), '自動（選手未確認）') : '');
    }
  }

  /* ---------- 映像上の案内・フラッシュ ---------- */
  function setPrompt(p, busy) {
    const el = $('#ovPrompt');
    if (!el) return;
    el.innerHTML = '';
    el.append(h('b', null, p.main), h('small', null, p.hint));
    el.classList.toggle('busy', !!busy);
    el.style.visibility = app && app.tab === 'auto' && !(BS.review && BS.review.active) ? 'hidden' : '';     // 自動解析タブではタグ入力の案内を出さない
  }
  function flash(text, kind) {
    const box = $('#ovFlash');
    if (!box) return;
    const el = h('div', { class: kind || 'ok' }, text);
    box.appendChild(el);
    flashQ.push(el);
    while (flashQ.length > 3) { const x = flashQ.shift(); x.remove(); }
    setTimeout(() => { el.remove(); const i = flashQ.indexOf(el); if (i >= 0) flashQ.splice(i, 1); }, 2200);
  }

  BS.uiPlayer = { init, mount, onTime, onChange, setPrompt, flash, flashRow, drawTimeline, renderLog };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/ui-tag.js */
/* バスケ分析スタジオ — 「タグ付け」タブ（選手ボタン・プレーボタン・シュート位置・案内） */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h, $ } = BS.ui;

  let app = null, pane = null;
  let onKey = '';
  let lastOnCheck = 0;
  let mini = null;      // タグ付けタブの下にある小さいコート図
  let rev = null;       // 確認モードのコート図と、そのまわりの表示

  function init(a) {
    app = a;
    pane = document.querySelector('.pane[data-pane="tag"]');
    mini = makeCourt({ id: 'miniCourt', marksId: 'miniMarks', rot: 0, onPick: (sx, sy) => app.tag({ k: 'loc', sx, sy }) });
    pane.append(
      h('div', { class: 'prompt', id: 'tagPrompt' }),
      buildReviewLoc(),
      h('div', { class: 'rosters', id: 'rosters' }),
      h('div', { class: 'pad', id: 'pad' }),
      h('div', { class: 'tagfoot' },
        h('div', { class: 'court-mini' }, mini.svg, h('div', { class: 'cap' }, 'シュート位置（任意）：クリック')),
        h('div', null,
          h('label', { class: 'switch', title: '選手やプレーを入力し始めたら映像を止め、入力が終わったら再生に戻す' },
            h('input', { type: 'checkbox', id: 'autoPause', onchange: (e) => { app.store.project.settings.autoPause = e.target.checked; } }), 'タグ入力中は一時停止'),
          h('div', { class: 'keyhelp', id: 'keyhelp' })))
    );
    buildPad();
    $('#keyhelp').innerHTML =
      '<span class="kbd">Space</span> 再生/停止　<span class="kbd">←</span><span class="kbd">→</span> 2秒（Shift で10秒）<br>' +
      '<span class="kbd">番号</span> 選手（2桁OK）　<span class="kbd">Q</span> チーム切替　<span class="kbd">Enter</span> 省略　<span class="kbd">Esc</span> 取消<br>' +
      '<span class="kbd">⌘/Ctrl+Z</span> 元に戻す　<span class="kbd">?</span> キー一覧';
  }

  function buildPad() {
    const pad = $('#pad');
    pad.innerHTML = '';
    BS.TAG_ACTIONS.forEach((a) => {
      pad.appendChild(h('button', { class: 'act ' + a.cls, dataset: { act: a.id }, title: `${a.label}（${a.key}）`, onclick: () => app.tag({ k: 'action', id: a.id }) },
        h('span', { class: a.short ? 'lbl-long' : '' }, a.label), a.short ? h('span', { class: 'lbl-short' }, a.short) : null, h('span', { class: 'k' }, a.key)));
    });
  }
  function pressAction(id) {
    const b = document.querySelector(`.act[data-act="${id}"]`);
    if (!b) return;
    b.classList.add('pressed');
    setTimeout(() => b.classList.remove('pressed'), 180);
  }

  /* ---------- 選手（コート上の5人は ●） ---------- */
  function onCourtAt(team, t) {
    const P = app.store.project;
    const T = P.teams[team];
    const starters = T.players.filter((p) => p.starter).map((p) => p.id);
    if (starters.length !== 5) return null;
    const set = new Set(starters);
    const subs = P.events.filter((e) => e.type === 'sub' && e.team === team && e.t <= t + 0.01).sort((a, b) => a.t - b.t);
    subs.forEach((e) => { if (e.out) set.delete(e.out); if (e.in) set.add(e.in); });
    return Array.from(set);
  }

  function renderRosters() {
    const box = $('#rosters');
    if (!box) return;
    const P = app.store.project, M = app.model();
    const st = app.tagger.state();
    const pr = app.tagger.prompt();
    const activeTeam = pr.team != null ? pr.team : st.team;
    const t = app.time();
    box.innerHTML = '';
    let key = '';
    [0, 1].forEach((tm) => {
      const T = P.teams[tm];
      const on = onCourtAt(tm, t);
      key += (on || []).join(',') + '|';
      const col = T.color || BS.ui.teamColor(P, tm);
      const card = h('div', { class: 'roster' + (activeTeam === tm ? ' active' : ''), style: { '--team': col } },
        h('div', { class: 'roster-head' },
          h('span', { class: 'dot', style: { background: col } }),
          h('b', { title: T.name }, T.name + (tm === (P.ourTeam || 0) ? '（自）' : '')),
          activeTeam === tm ? h('span', { class: 'note' }, '番号キーの対象') : h('span', { class: 'kbd', title: 'Q でこちらに切替' }, 'Q')));
      card.querySelector('.roster-head').addEventListener('click', () => app.tag({ k: 'team-set', team: tm }));
      const players = T.players.slice().sort((a, b) => {
        const ao = on ? (on.includes(a.id) ? 0 : 1) : 0, bo = on ? (on.includes(b.id) ? 0 : 1) : 0;
        return ao - bo || Number(a.no) - Number(b.no);
      });
      players.forEach((p) => {
        const mp = M.players[p.id];
        const b = mp ? mp.box : { pts: 0, pf: 0 };
        const isOn = on ? on.includes(p.id) : true;
        const btn = h('div', { class: 'pl' + (st.sel === p.id ? ' sel' : '') + (on && !isOn ? ' bench' : ''), role: 'button', tabindex: '-1', dataset: { pid: p.id }, style: { '--team': col }, title: `#${p.no} ${p.name || ''}` },
          on ? h('button', { class: 'oc' + (isOn ? ' on' : ''), title: isOn ? 'コート上（クリックで交代で下げる）' : 'ベンチ（クリックで交代で入れる）', onclick: (ev) => { ev.stopPropagation(); toggleCourt(tm, p.id, isOn); } }) : h('span'),
          h('span', { class: 'no' }, p.no),
          h('span', { class: 'nm' }, p.name || '—'),
          h('span', { class: 'st' }, `${b.pts}点 `, h('span', { class: b.pf >= 5 ? 'pf5' : '' }, `${b.pf}F`)));
        btn.addEventListener('click', () => app.tag({ k: 'player', pid: p.id }));
        card.appendChild(btn);
      });
      const tchip = h('div', { class: 'pl teamchip', role: 'button', title: 'チームリバウンド・チームTOなど（選手なし）' }, 'チーム（選手なし）');
      tchip.addEventListener('click', () => app.tag({ k: 'player', pid: null, team: tm }));
      card.appendChild(tchip);
      box.appendChild(card);
    });
    onKey = key;
  }
  function toggleCourt(team, pid, isOn) {
    const t = app.time();
    app.store.addEvents([{ id: BS.uid('t'), type: 'sub', t: Math.round(t * 100) / 100, team, out: isOn ? pid : null, in: isOn ? null : pid }], '交代');
    BS.ui.toast(`${BS.clips.nameOf(app.store.project, pid)} を${isOn ? 'ベンチへ' : 'コートへ'}（${BS.fmtTime(t)}）`, 'ok');
  }

  /* ---------- 案内 ---------- */
  function renderPrompt() {
    const box = $('#tagPrompt');
    if (!box) return;
    const p = app.tagger.prompt();
    const st = app.tagger.state();
    const busy = app.tagger.busy() || app.tagger.waitingRebound();
    box.className = 'prompt' + (busy ? ' busy' : '');
    box.innerHTML = '';
    const rl = BS.review && BS.review.label();
    const ev = rl ? BS.review.cur() : null;
    const asking = !st.flow || st.flow.kind === 'assign';      // 確認モードで「誰？」を聞いている（＝アシストなど、ほかの質問の途中ではない）
    const needLoc = !!(ev && BS.review.needLoc(ev));
    const askLoc = needLoc && BS.review.confirmed(ev) && asking;      // 選手はもう入っていて、あとは場所だけ
    const sub = !rl ? p.hint
      : askLoc ? '📍 どこから打った？　下のコート図をクリック ・ →＝場所なしで次へ'
        : `${p.main}　${p.hint}${needLoc && asking ? ' ・ 場所は下のコート図をクリック' : ''}`;
    box.append(h('b', null, rl || p.main), h('small', null, sub));
    const ops = h('div', { class: 'opts' });
    if (p.options) p.options.forEach((o) => ops.appendChild(h('button', { class: 'btn small', onclick: () => app.tag({ k: 'option', v: o.v }) }, h('span', { class: 'kbd' }, String(o.v)), ' ', o.label)));
    if (rl && asking) {
      // 確認モード：キーでもクリックでも直せるように、操作をボタンで並べる
      const kb = (code, key, text) => h('button', { class: 'btn small', onclick: () => BS.review.key({ code }) }, h('span', { class: 'kbd' }, key), ' ' + text);
      if (ev && (ev.type === 'shot' || ev.type === 'ft')) {
        // 場所を入れる設定のときは、2点／3点は場所から決まるので、ボタンは出さない（W・R のキーは効く。押すと、その点数を優先する）
        if (!BS.review.wantsLoc()) ops.append(kb('KeyW', 'W', '2点'), kb('KeyR', 'R', '3点'));
        ops.append(kb('KeyF', 'F', 'FT'), kb('KeyM', 'M', '成功⇄失敗'));
      }
      if (BS.review.mode !== 'loc') ops.append(kb('Delete', 'Del', '誤検出'));
      if (BS.review.wantsLoc()) ops.append(kb('ArrowLeft', '←', '前へ'));      // 1行に収まる数だけ出す（← のキーは、どちらの設定でも効く）
      ops.append(kb('ArrowRight', '→', '次へ'), kb('Escape', 'Esc', '終了'));
    } else if (st.flow || st.act || st.sel) {
      ops.appendChild(h('button', { class: 'btn small', onclick: () => app.tag({ k: 'enter' }) }, h('span', { class: 'kbd' }, 'Enter'), st.flow ? ' 省略' : ' 確定'));
      ops.appendChild(h('button', { class: 'btn small', onclick: () => app.tag({ k: 'esc' }) }, h('span', { class: 'kbd' }, 'Esc'), ' 取消'));
    }
    if (ops.children.length) box.appendChild(ops);
    document.querySelectorAll('.act').forEach((b) => b.classList.toggle('sel', b.dataset.act === st.act));
    BS.uiPlayer.setPrompt(rl ? { main: rl, hint: askLoc ? '📍 どこから打った？ コート図をクリック・→＝場所なしで次へ' : `${p.main}（番号キー）${needLoc && asking ? '＋コート図で場所' : ''}・Delete＝誤検出・→＝次へ` } : p, busy);
    const ap = $('#autoPause');
    if (ap) ap.checked = !!app.store.project.settings.autoPause;
    if (pane) pane.classList.toggle('reviewing', !!rl);      // 確認モードの間は、プレーのボタンと下の小さいコート図を隠す（CSS）
    renderReviewLoc();
    drawCourtMarks();
  }

  /* ---------- コート図（ハーフコート） ----------
     opts.rot      図の向き（BS.courtXform。0＝ゴールが上）
     opts.onPick   クリックした場所（sx, sy：メートル。いつも「ゴールが上」の座標）
     opts.onHover  マウスの下の場所（図の外へ出たら null） */
  function makeCourt(opts) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    if (opts.id) svg.id = opts.id;
    const g = document.createElementNS(ns, 'g');      // 回すのは、この中身だけ
    const lines = document.createElementNS(ns, 'g');
    lines.innerHTML = courtLines('#e9d5b5');
    // 印は、クリックの当たり判定から外す（CSS の .court-marks）。押している間に印を描き直しても、クリックはコート図に届く
    const marks = document.createElementNS(ns, 'g');
    marks.setAttribute('class', 'court-marks');
    if (opts.marksId) marks.id = opts.marksId;
    g.append(lines, marks);
    svg.appendChild(g);
    let xf = null;
    function setRot(rot) {
      xf = BS.courtXform(rot);
      svg.setAttribute('viewBox', `0 0 ${xf.w} ${xf.h}`);
      if (xf.svg) g.setAttribute('transform', xf.svg); else g.removeAttribute('transform');
    }
    setRot(opts.rot || 0);
    /* 画面の座標 → コートの座標。図を回していても、ブラウザが持っている変換の逆をかければ求まる */
    const at = (ev) => {
      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const q = pt.matrixTransform(g.getScreenCTM().inverse());
      return { sx: BS.clamp(Math.round(q.x), 0, 150) / 10, sy: BS.clamp(Math.round(q.y), 0, 142) / 10 };
    };
    svg.addEventListener('click', (ev) => { const q = at(ev); if (opts.onPick) opts.onPick(q.sx, q.sy); });
    if (opts.onHover) {
      svg.addEventListener('mousemove', (ev) => { const q = at(ev); opts.onHover(q.sx, q.sy); });
      svg.addEventListener('mouseleave', () => opts.onHover(null, null));
    }
    /* コートの座標 → 画面の座標（デモやテストが、その場所を押すため） */
    const pointOf = (sx, sy) => {
      const pt = svg.createSVGPoint();
      pt.x = sx * 10; pt.y = sy * 10;
      const q = pt.matrixTransform(g.getScreenCTM());
      return { x: q.x, y: q.y };
    };
    return { svg, marks, setRot, pointOf, rot: () => xf.rot };
  }
  /* 1単位 = 10cm。ベースライン y=0、ゴール (75, 15.75) */
  function courtLines(stroke) {
    const C = BS.COURT;
    const bx = 75, by = C.rimFromBaseline * 10;
    const r3 = C.three * 10;
    const xl = C.cornerLine * 10, xr = 150 - xl;
    const a = Math.asin((bx - xl) / r3);
    const yj = by + r3 * Math.cos(a);
    return `<rect x="0" y="0" width="150" height="142" fill="#3a2a1a"/>
      <rect x="0.5" y="0.5" width="149" height="141" fill="#8a6238" stroke="${stroke}" stroke-width="0.8"/>
      <rect x="${bx - 24.5}" y="0" width="49" height="58" fill="rgba(47,111,237,0.35)" stroke="${stroke}" stroke-width="0.8"/>
      <circle cx="${bx}" cy="58" r="18" fill="none" stroke="${stroke}" stroke-width="0.8"/>
      <path d="M${xl} 0 L${xl} ${yj.toFixed(1)} A${r3} ${r3} 0 0 0 ${xr} ${yj.toFixed(1)} L${xr} 0" fill="none" stroke="${stroke}" stroke-width="0.9"/>
      <path d="M${bx - 12.5} ${by} A12.5 12.5 0 0 0 ${bx + 12.5} ${by}" fill="none" stroke="${stroke}" stroke-width="0.6"/>
      <line x1="${bx - 9}" y1="12" x2="${bx + 9}" y2="12" stroke="#fff" stroke-width="1.2"/>
      <circle cx="${bx}" cy="${by}" r="2.3" fill="none" stroke="#ff7a2a" stroke-width="1"/>
      <path d="M${bx - 18} 140 A18 18 0 0 1 ${bx + 18} 140" fill="none" stroke="${stroke}" stroke-width="0.8"/>
      <line x1="0" y1="140" x2="150" y2="140" stroke="${stroke}" stroke-width="0.8"/>`;
  }
  /* シュートの印（成功＝丸、失敗＝×）と、目立たせる輪 */
  function markHTML(e, col, op) {
    const x = e.sx * 10, y = e.sy * 10;
    return e.made ? `<circle cx="${x}" cy="${y}" r="3" fill="${col}" stroke="#fff" stroke-width="0.6" opacity="${op}"/>`
      : `<path d="M${x - 2.6} ${y - 2.6} L${x + 2.6} ${y + 2.6} M${x + 2.6} ${y - 2.6} L${x - 2.6} ${y + 2.6}" stroke="${col}" stroke-width="1.4" opacity="${op}"/>`;
  }
  const ringHTML = (sx, sy) => `<circle cx="${sx * 10}" cy="${sy * 10}" r="4.5" fill="none" stroke="#fbbf24" stroke-width="1.6"><animate attributeName="r" values="3;6;3" dur="1.2s" repeatCount="indefinite"/></circle>`;
  /* 中身が変わったときだけ描き直す */
  function setMarks(g, html) { if (g.__html !== html) { g.__html = html; g.innerHTML = html; } }
  function drawCourtMarks() {
    if (!app || !mini) return;
    const P = app.store.project;
    const st = app.tagger.state();
    const located = P.events.filter((e) => e.type === 'shot' && e.sx != null).sort((a, b) => b.t - a.t);
    let html = '';
    located.slice(0, 12).forEach((e, i) => { html += markHTML(e, BS.ui.teamColor(P, e.team), (1 - i / 14).toFixed(2)); });
    if (st.pendingLoc) html += ringHTML(st.pendingLoc.sx, st.pendingLoc.sy);
    setMarks(mini.marks, html);
    if (rev && BS.review && BS.review.active) {
      // 確認モード：同じゴールで打った最近のシュートを薄く。いま確認しているシュートは、輪で目立たせる
      const ev = BS.review.cur();
      let h2 = '';
      located.filter((e) => !ev || (e.id !== ev.id && (ev.hoop == null || e.hoop == null || e.hoop === ev.hoop))).slice(0, 10)
        .forEach((e) => { h2 += markHTML(e, BS.ui.teamColor(P, e.team), '0.35'); });
      if (ev && ev.type === 'shot' && ev.sx != null) h2 += markHTML(ev, BS.ui.teamColor(P, ev.team), '1') + ringHTML(ev.sx, ev.sy);
      setMarks(rev.court.marks, h2);
    }
  }

  /* ---------- 確認モード：どこから打ったか ----------
     番号キーで「誰が」、このコート図のクリックで「どこから」。図は映像と同じ向きにそろえて見せる（BS.courtXform）。
     クリックした場所から、2点／3点も決まる（BS.review.setLoc）。 */
  function buildReviewLoc() {
    let hover = null;
    const court = makeCourt({
      id: 'revCourt', rot: 0,
      onPick: (sx, sy) => { if (BS.review.active) BS.review.setLoc(sx, sy); },
      onHover: (sx, sy) => { hover = sx == null ? null : { sx, sy }; renderReviewLoc(); }
    });
    const title = h('b', { id: 'revTitle' }), who = h('div', { class: 'st', id: 'revWho' }), where = h('div', { class: 'st', id: 'revWhere' });
    const hint = h('div', { class: 'note', id: 'revHint' }), cap = h('div', { class: 'cap' });
    const rot = h('button', { class: 'btn small', id: 'revRot', title: '図の向きが映像と合わないときに押します。向きは、ゴールごとに覚えます', onclick: () => BS.uiAuto.rotateCourt(BS.review.cur()) }, '↻ 図の向きを変える');
    const tog = h('input', { type: 'checkbox', id: 'revLocOn', onchange: (e) => BS.uiAuto.setReviewLoc(e.target.checked) });
    const box = h('div', { class: 'revloc', id: 'revLoc', hidden: true },
      h('div', { class: 'rc' }, court.svg, cap),
      h('div', { class: 'rs' }, title, who, where, hint,
        h('div', { class: 'row' }, rot, h('label', { class: 'switch', title: '外すと、番号キーだけで次の場面へ進みます（場所は入りません）' }, tog, 'シュートの場所も入れる'))));
    rev = { box, court, title, who, where, hint, cap, rot, tog, hover: () => hover };
    return box;
  }
  function renderReviewLoc() {
    if (!rev) return;
    const active = !!(BS.review && BS.review.active);
    if (rev.box.hidden === active) rev.box.hidden = !active;
    if (!active) return;
    const P = app.store.project;
    const ev = BS.review.cur();
    const on = BS.review.wantsLoc();
    const isShot = !!(ev && ev.type === 'shot');
    const set = (el, text) => { if (el.textContent !== text) el.textContent = text; };
    if (rev.tog.checked !== on) rev.tog.checked = on;
    rev.tog.parentElement.hidden = BS.review.mode === 'loc';      // 「場所だけ入れる」の間は、この切り替えは出さない
    rev.box.classList.toggle('nocourt', !on);
    rev.box.classList.toggle('off', on && !isShot);
    rev.rot.hidden = !on;
    if (!on) {
      set(rev.title, 'シュートの場所は入れない設定です');
      set(rev.who, ''); set(rev.where, '');
      set(rev.hint, '入れると、個人ごとのショット図が出て、2点／3点も場所から自動で決まります。');
      return;
    }
    const r = BS.uiAuto.courtRot(ev);
    if (rev.court.rot() !== r) rev.court.setRot(r);
    set(rev.cap, '下が手前（カメラ側）／輪がゴール');
    set(rev.title, isShot ? '📍 どこから打った？' : '📍 この場面は、場所を入れません');
    const name = ev && ev.pid ? BS.clips.nameOf(P, ev.pid) : null;
    const whoDone = !!(ev && BS.review.confirmed(ev) && name);
    set(rev.who, `① 選手　${whoDone ? '✓ ' + name : '背番号のキー（または下の名前をクリック）'}`);
    rev.who.classList.toggle('done', whoDone);
    if (isShot) {
      const z = ev.sx != null ? BS.shotZone(ev.sx, ev.sy) : null;
      set(rev.where, `② 場所　${z ? '✓ ' + BS.zoneLabel(z.zone) + '（' + ev.pts + '点）' : 'この図をクリック'}`);
      rev.where.classList.toggle('done', !!z);
    } else {
      set(rev.where, ev && ev.type === 'ft' ? '② 場所　フリースローは不要' : '② 場所　リバウンドは不要');
      rev.where.classList.remove('done');
    }
    const hv = rev.hover();
    if (hv && isShot) { const z = BS.shotZone(hv.sx, hv.sy); set(rev.hint, `ここを押すと：${BS.zoneLabel(z.zone)}（${z.three ? 3 : 2}点）`); }
    else set(rev.hint, isShot ? '順番はどちらが先でも OK。両方入ると次の場面へ。2点／3点は場所から決まります（自分で決めるなら W／R）。' : '選手を入れると、次の場面へ進みます。');
  }

  function onChange() { renderRosters(); renderPrompt(); }
  function onTime(t) {
    const now = performance.now();
    if (now - lastOnCheck < 300) return;
    lastOnCheck = now;
    let key = '';
    [0, 1].forEach((tm) => { key += (onCourtAt(tm, t) || []).join(',') + '|'; });
    if (key !== onKey) renderRosters();
  }

  BS.uiTag = {
    init, onChange, onTime, renderPrompt, renderRosters, pressAction, onCourtAt, courtLines, makeCourt, markHTML,
    /* 確認モードのコート図で、その場所（sx, sy）が画面のどこにあるか（デモやテストが、そこを押すため） */
    reviewCourtPoint: (sx, sy) => rev.court.pointOf(sx, sy)
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/ui-stats.js */
/* バスケ分析スタジオ — 集計・場面別・ショット・ファウルのタブ
   表の数字はクリックすると、その場面の動画を連続再生する（プロの分析ツールと同じ「数字→映像」）。 */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h, $ } = BS.ui;

  let app = null;
  const S = { detail: false, sortKey: null, sceneTeam: null, shot: { team: 'us', pid: '', result: 'all', scene: 'all', per: 'all' } };
  const pc = (v, d = 0) => (v == null ? '—' : (100 * v).toFixed(d) + '%');
  const f2 = (v) => (v == null ? '—' : v.toFixed(2));

  function init(a) { app = a; }
  function paneEl(id) { return document.querySelector(`.pane[data-pane="${id}"]`); }

  function linkNum(text, q, label) {
    const el = h('span', { class: 'lnk', title: 'クリックでこの場面を再生' }, String(text));
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const evs = BS.model.eventsFor(app.model(), q);
      app.playEvents(evs, label);
    });
    return el;
  }

  /* =================== 集計（ボックススコア） =================== */
  const COLS = [
    { k: 'min', lab: '分', title: '出場時間（スタメン＋交代タグから計算）', fmt: (b) => (b.min ? Math.round(b.min) : '—') },
    { k: 'pts', lab: '点', q: 'pts', hl: true },
    { k: 'fg', lab: 'FG', q: 'fga', fmt: (b) => `${b.fgm}-${b.fga}`, sort: (b) => b.fgm },
    { k: 'p3', lab: '3P', q: 'p3a', fmt: (b) => `${b.p3m}-${b.p3a}`, sort: (b) => b.p3m },
    { k: 'ft', lab: 'FT', q: 'fta', fmt: (b) => `${b.ftm}-${b.fta}`, sort: (b) => b.ftm },
    { k: 'or', lab: 'OR', q: 'or', title: 'オフェンスリバウンド' },
    { k: 'dr', lab: 'DR', q: 'dr', title: 'ディフェンスリバウンド' },
    { k: 'reb', lab: 'REB', q: 'reb', hl: true },
    { k: 'ast', lab: 'AST', q: 'ast', hl: true },
    { k: 'stl', lab: 'STL', q: 'stl' },
    { k: 'blk', lab: 'BLK', q: 'blk' },
    { k: 'tov', lab: 'TO', q: 'tov' },
    { k: 'pf', lab: 'PF', q: 'pf' },
    { k: 'pm', lab: '+/-', title: '出場中のチーム得失点差', fmt: (b, has) => (has ? BS.signed(b.pm) : '—') },
    { k: 'eff', lab: 'EFF', title: '貢献度（得点+REB+AST+STL+BLK−シュート失敗−FT失敗−TO）' }
  ];
  const DCOLS = [
    { k: 'p2', lab: '2P', q: 'p2a', fmt: (b) => `${b.p2m}-${b.p2a}`, sort: (b) => b.p2m },
    { k: 'fgp', lab: 'FG%', fmt: (b) => pc(b.fga ? b.fgm / b.fga : null), sort: (b) => (b.fga ? b.fgm / b.fga : -1) },
    { k: 'p3p', lab: '3P%', fmt: (b) => pc(b.p3a ? b.p3m / b.p3a : null), sort: (b) => (b.p3a ? b.p3m / b.p3a : -1) },
    { k: 'ftp', lab: 'FT%', fmt: (b) => pc(b.fta ? b.ftm / b.fta : null), sort: (b) => (b.fta ? b.ftm / b.fta : -1) },
    { k: 'efg', lab: 'eFG%', title: '3Pを1.5倍で数えたFG%', fmt: (b) => pc(b.efg), sort: (b) => (b.efg == null ? -1 : b.efg) },
    { k: 'tsp', lab: 'TS%', title: 'FTも含めたシュート効率', fmt: (b) => pc(b.tsp), sort: (b) => (b.tsp == null ? -1 : b.tsp) },
    { k: 'fd', lab: 'FD', q: 'fd', title: 'ファウルをもらった数' },
    { k: 'gmsc', lab: 'GmSc', title: 'ゲームスコア（Hollinger）' }
  ];

  function renderBox() {
    const pane = paneEl('box');
    const P = app.store.project, M = app.model();
    pane.innerHTML = '';
    if (!M.events.length) { pane.appendChild(emptyNote()); return; }
    const us = P.ourTeam || 0;
    // クォーター別得点
    const qs = M.periodScores;
    const qt = h('table', { class: 'tbl' },
      h('thead', null, h('tr', null, h('th', { class: 'l' }, 'チーム'), qs.map((q) => h('th', null, BS.clips.perLabel(q.n))), h('th', null, '計'))),
      h('tbody', null, [0, 1].map((tm) => h('tr', null,
        h('td', { class: 'l' }, h('span', { class: 'pn' }, h('span', { class: 'dot', style: { background: BS.ui.teamColor(P, tm) } }), P.teams[tm].name)),
        qs.map((q) => h('td', { class: q.pts[tm] > q.pts[1 - tm] ? 'hl' : '' }, q.pts[tm])),
        h('td', { class: 'hl' }, M.score[tm])))));
    pane.append(h('h3', null, 'スコア'), h('div', { class: 'tbl-wrap' }, qt));

    // 主な数字
    const U = M.teams[us], T = M.teams[1 - us];
    const kp = (lab, a, b, title) => h('div', { class: 'kpi', title: title || '' }, h('small', null, lab), h('b', null, a, h('i', null, '対'), b));
    pane.append(h('h3', null, '試合の要点 ', h('small', null, `左＝${P.teams[us].short}　右＝${P.teams[1 - us].short}`)),
      h('div', { class: 'kpis' },
        kp('ポゼッション', U.poss, T.poss, '攻撃の回数'),
        kp('1回あたり得点', f2(U.poss ? U.box.pts / U.poss : null), f2(T.poss ? T.box.pts / T.poss : null), 'PPP（Points Per Possession）'),
        kp('ペイント内得点', U.breakdown.paint, T.breakdown.paint),
        kp('セカンドチャンス', U.breakdown.second, T.breakdown.second, 'オフェンスリバウンド後の得点'),
        kp('速攻の得点', U.breakdown.fast, T.breakdown.fast),
        kp('TOからの得点', U.breakdown.offTO, T.breakdown.offTO, '相手のTOで始まった攻撃の得点'),
        kp('ベンチの得点', U.breakdown.bench, T.breakdown.bench),
        kp('最大リード', M.biggest[us], M.biggest[1 - us]),
        h('div', { class: 'kpi' }, h('small', null, 'リードチェンジ／同点'), h('b', null, M.leadChanges, h('i', null, '／'), M.ties))));

    // Four Factors
    pane.append(h('h3', null, '勝敗を分ける4つの要素 ', h('small', null, 'Dean Oliver の Four Factors（影響の大きさ ≒ 40:25:20:15）')), fourFactors(P, M, us));

    // ボックススコア
    const tools = h('div', { class: 'row', style: { margin: '14px 0 2px' } },
      h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: S.detail, onchange: (e) => { S.detail = e.target.checked; renderBox(); } }), '詳細（%・eFG%・TS% など）'),
      h('span', { class: 'note' }, '数字をクリック → その場面を連続再生。見出しクリックで並べ替え'));
    pane.append(tools);
    [us, 1 - us].forEach((tm) => pane.append(boxTable(P, M, tm)));
    pane.append(h('p', { class: 'note' }, '出場時間(分)は、スタメン設定と交代タグから、各ピリオドの映像の長さを試合時間（1ピリオド ' + (P.periodMinutes || 10) + '分）に換算した目安です。'));
  }

  function fourFactors(P, M, us) {
    const U = M.teams[us].ff, T = M.teams[1 - us].ff;
    const rows = [
      { lab: 'シュート効率 eFG%', a: U.efg, b: T.efg, hi: true, max: 0.7 },
      { lab: 'TO率（低いほど良い）', a: U.tov, b: T.tov, hi: false, max: 0.4 },
      { lab: 'オフェンスリバウンド率', a: U.orb, b: T.orb, hi: true, max: 0.6 },
      { lab: 'FT率（FT成功÷FG試投）', a: U.ftr, b: T.ftr, hi: true, max: 0.5 }
    ];
    const box = h('div', { class: 'card' });
    const cmp = h('div', { class: 'cmp' });
    cmp.append(h('div', { style: { textAlign: 'right', fontWeight: 700 } }, P.teams[us].short), h('div'), h('div', { style: { fontWeight: 700 } }, P.teams[1 - us].short));
    rows.forEach((r) => {
      const aw = r.a == null ? 0 : Math.min(1, r.a / r.max), bw = r.b == null ? 0 : Math.min(1, r.b / r.max);
      const better = r.a == null || r.b == null ? 0 : (r.hi ? (r.a > r.b ? 1 : r.a < r.b ? -1 : 0) : (r.a < r.b ? 1 : r.a > r.b ? -1 : 0));
      cmp.append(
        h('div', { class: 'bar l' + (better > 0 ? ' win' : '') }, h('i', { style: { width: (aw * 100) + '%', background: BS.ui.teamColor(P, us) } }), h('span', null, pc(r.a, 1))),
        h('div', { class: 'lab' }, r.lab),
        h('div', { class: 'bar r' + (better < 0 ? ' win' : '') }, h('i', { style: { width: (bw * 100) + '%', background: BS.ui.teamColor(P, 1 - us) } }), h('span', null, pc(r.b, 1))));
    });
    box.appendChild(cmp);
    return box;
  }

  function boxTable(P, M, tm) {
    const T = P.teams[tm];
    const has = M.lineupKnown[tm];
    const cols = COLS.concat(S.detail ? DCOLS : []);
    let players = T.players.map((p) => M.players[p.id]).filter(Boolean);
    const played = (b) => b.min > 0 || b.fga + b.fta + b.reb + b.ast + b.stl + b.blk + b.tov + b.pf > 0;
    players = players.filter((p) => played(p.box) || p.starter);
    const sortCol = cols.find((c) => c.k === S.sortKey);
    if (sortCol) players.sort((a, b) => valOf(sortCol, b.box) - valOf(sortCol, a.box));
    else players.sort((a, b) => (b.starter - a.starter) || (Number(a.no) - Number(b.no)));
    const best = {};
    ['pts', 'reb', 'ast'].forEach((k) => { best[k] = Math.max(0, ...players.map((p) => p.box[k])); });
    const head = h('tr', null, h('th', { class: 'l' }, '選手'), cols.map((c) => {
      const th = h('th', { class: 'sortable' + (S.sortKey === c.k ? ' sorted' : ''), title: c.title || '' }, c.lab);
      th.addEventListener('click', () => { S.sortKey = S.sortKey === c.k ? null : c.k; renderBox(); });
      return th;
    }));
    const body = players.map((p) => {
      const b = p.box;
      return h('tr', { class: p.starter ? '' : 'bench' },
        h('td', { class: 'l' }, h('span', { class: 'pn' }, h('span', { class: 'no' }, p.no), p.name || '', '')),
        cols.map((c) => {
          const txt = c.fmt ? c.fmt(b, has) : b[c.k];
          const cls = (c.hl && b[c.k] > 0 && b[c.k] === best[c.k] ? 'hl' : '') + (c.k === 'pm' && has ? (b.pm > 0 ? ' pos' : b.pm < 0 ? ' neg' : '') : '') + (c.k === 'pf' && b.pf >= 4 ? ' neg' : '');
          const cell = h('td', { class: cls });
          if (c.q && (c.k === 'fg' ? b.fga : c.k === 'p3' ? b.p3a : c.k === 'ft' ? b.fta : c.k === 'p2' ? b.p2a : b[c.k]) > 0) cell.appendChild(linkNum(txt, { pid: p.id, stat: c.q }, `#${p.no} ${p.name || ''} ${c.lab}`));
          else cell.textContent = txt;
          return cell;
        }));
    });
    const tb = M.teams[tm].box;
    const total = h('tr', { class: 'total' }, h('td', { class: 'l' }, 'チーム計'), cols.map((c) => {
      if (c.k === 'min' || c.k === 'pm') return h('td', null, '');
      const txt = c.fmt ? c.fmt(tb, false) : tb[c.k];
      const cell = h('td');
      if (c.q && tb[c.q] > 0 && ['pts', 'fg', 'p3', 'ft', 'or', 'dr', 'reb', 'ast', 'stl', 'blk', 'tov', 'pf', 'p2', 'fd'].includes(c.k)) cell.appendChild(linkNum(txt, { team: tm, stat: c.q }, `${T.short} ${c.lab}`));
      else cell.textContent = txt;
      return cell;
    }));
    const un = M.teams[tm].un;
    const unRow = M.teams[tm].unCount ? h('tr', { class: 'bench', title: '自動検出したが、まだ選手を確認していないぶん' },
      h('td', { class: 'l' }, h('span', { class: 'note' }, '⚡ 選手未確認')),
      cols.map((c) => {
        if (c.k === 'min' || c.k === 'pm' || c.k === 'eff' || c.k === 'gmsc') return h('td', null, '');
        return h('td', { class: 'note' }, c.fmt ? c.fmt(un, false) : (un[c.k] || 0));
      })) : null;
    if (unRow) body.push(unRow);
    const wrap = h('div');
    wrap.append(

      h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
        h('thead', null, h('tr', null, h('th', { class: 'l' }, 'チーム'), pers.map((n) => h('th', null, BS.clips.perLabel(n))), h('th', null, '計'), h('th', null, '相手のFT'))),
        h('tbody', null, [us, 1 - us].map((tm) => {
          const T = M.teams[tm];
          return h('tr', null,
            h('td', { class: 'l' }, h('span', { class: 'pn' }, h('span', { class: 'dot', style: { background: BS.ui.teamColor(P, tm) } }), P.teams[tm].name)),
            pers.map((n) => { const v = T.foulsByPer[n] || 0; return h('td', { class: v >= 5 ? 'neg' : '' }, v >= 5 ? `${v} ⚠` : v); }),
            h('td', null, linkNum(T.box.pf, { team: tm, stat: 'pf' }, `${P.teams[tm].short} のファウル`)),
            h('td', null, `${M.teams[1 - tm].box.ftm}/${M.teams[1 - tm].box.fta}`));
        })))));
    const warn = M.foulTrouble.filter((f) => f.team === us);
    const warnT = M.foulTrouble.filter((f) => f.team !== us);
    pane.append(h('h3', null, 'ファウルトラブル ', h('small', null, '目安：1Qで2個・前半で3個・3Qまでに4個')));
    if (!warn.length && !warnT.length) pane.append(h('p', { class: 'note' }, 'ファウルトラブルの選手はいません。'));
    else pane.append(h('div', { class: 'warnlist' }, warn.concat(warnT).map((f) => h('div', { class: 'w' }, h('b', null, `${P.teams[f.team].short} ${BS.clips.nameOf(P, f.pid)}`), `　${f.flags.map((x) => x.text).join(' → ')}（計${f.total}個）`))));
    [us, 1 - us].forEach((tm) => {
      const ps = P.teams[tm].players.map((p) => M.players[p.id]).filter((p) => p && (p.box.pf || p.box.fd));
      pane.append(h('div', { class: 'teamhead' }, h('span', { class: 'dot', style: { background: BS.ui.teamColor(P, tm) } }), P.teams[tm].name));
      if (!ps.length) { pane.append(h('p', { class: 'note' }, 'ファウルの記録はありません。')); return; }
      pane.append(h('div', { class: 'tbl-wrap' }, h('table', { class: 'tbl' },
        h('thead', null, h('tr', null, h('th', { class: 'l' }, '選手'), h('th', { class: 'l' }, 'いつ（色＝ピリオド）'), h('th', null, 'PF'), h('th', null, 'シュート時'), h('th', null, 'オフェンス'), h('th', { title: 'ファウルをもらった数' }, 'もらった'))),
        h('tbody', null, ps.sort((a, b) => b.box.pf - a.box.pf).map((p) => h('tr', null,
          h('td', { class: 'l' }, h('span', { class: 'pn' }, h('span', { class: 'no' }, p.no), p.name || '')),
          h('td', { class: 'l' }, h('span', { class: 'fdots' }, p.fouls.map((fe) => h('i', { class: 'q' + Math.min(5, fe._per), title: `${BS.clips.perLabel(fe._per)} ${BS.fmtTime(fe.t)} ${BS.foulLabel(fe.kind)}` })))),
          h('td', { class: p.box.pf >= 4 ? 'neg' : '' }, p.box.pf ? linkNum(p.box.pf, { pid: p.id, stat: 'pf' }, `#${p.no} のファウル`) : '0'),
          h('td', null, p.fouls.filter((x) => x.kind === 'S').length),
          h('td', null, p.fouls.filter((x) => x.kind === 'O').length),
          h('td', null, p.box.fd ? linkNum(p.box.fd, { pid: p.id, stat: 'fd' }, `#${p.no} がもらったファウル`) : '0')))))));
    });
    const kinds = (tm) => BS.FOUL_KINDS.map((k) => `${k.label} ${M.teams[tm].foulKinds[k.id] || 0}`).join('・');
    pane.append(h('h3', null, 'ファウルの種類'), h('div', { class: 'card' },
      h('div', null, h('b', null, P.teams[us].short + '：'), kinds(us)), h('div', null, h('b', null, P.teams[1 - us].short + '：'), kinds(1 - us))));
  }

  BS.uiStats = { init, renderBox, renderScene, renderShot, renderFoul, linkNum };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* js/ui-hl.js */
/* バスケ分析スタジオ — ハイライト（クリップの自動切り出し・並べ替え・トリム・連続再生・動画書き出し） */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h, $ } = BS.ui;

  let app = null;
  const HL = { preset: 'score', pid: '', cause: null, lead: null, lag: null, ft: false, clips: [], edited: false, custom: null, exporting: null, result: null };
  const reel = { clips: [], i: -1, active: false, label: '', capUntil: 0 };

  function init(a) {
    app = a;
    const viewer = $('#viewer');
    const bar = h('div', { class: 'reelbar', id: 'reelBar', hidden: true, style: { position: 'absolute', right: '10px', bottom: '10px', display: 'flex', gap: '4px', alignItems: 'center', background: 'rgba(8,12,20,0.86)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '8px', padding: '4px 6px', pointerEvents: 'auto' } },
      h('span', { id: 'reelLabel', style: { fontSize: '12px', maxWidth: '240px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', marginRight: '4px' } }),
      h('button', { class: 'btn small', title: '前のクリップ', onclick: () => step(-1) }, '⏮'),
      h('button', { class: 'btn small', title: '連続再生を止める', onclick: () => stop() }, '⏹'),
      h('button', { class: 'btn small', title: '次のクリップ', onclick: () => step(1) }, '⏭'),
      h('button', { class: 'btn small', title: 'このクリップ一覧をハイライトで編集・書き出し', onclick: () => sendToHighlights() }, '✂ 編集'));
    viewer.appendChild(bar);
  }
  function paneEl() { return document.querySelector('.pane[data-pane="hl"]'); }

  /* ---------- クリップを作る ---------- */
  function rebuild() {
    const P = app.store.project, M = app.model();
    if (HL.custom) { HL.clips = HL.custom.clips.map((c) => Object.assign({}, c)); return; }
    const opts = { pid: HL.pid, cause: HL.cause, ft: HL.ft };
    if (HL.lead != null) opts.lead = HL.lead;
    if (HL.lag != null) opts.lag = HL.lag;
    HL.clips = BS.clips.build(P, M, HL.preset, opts);
    HL.edited = false;
    app.reelVersion = (app.reelVersion || 0) + 1;
  }
  function clipsFor() { return HL.clips; }

  function presetLabel() {
    if (HL.custom) return HL.custom.label;
    const p = BS.clips.PRESETS.find((x) => x.id === HL.preset);
    let s = p ? p.label : '';
    if (HL.preset === 'player' && HL.pid) s = BS.clips.nameOf(app.store.project, HL.pid) + ' のハイライト';
    if (HL.preset === 'concede' && HL.cause) s += '：' + BS.clips.causeLabel(HL.cause);
    return s;
  }

  function render() {
    const pane = paneEl();
    if (!pane) return;
    const P = app.store.project, M = app.model();
    if (!HL.clips.length && !HL.edited) rebuild();
    pane.innerHTML = '';
    if (!M.events.length) {
      pane.append(h('div', { class: 'card note' }, 'タグを付けると、得点シーン・失点シーンなどを自動で切り出してハイライトを作れます。「🏀 サンプル試合」で試せます。'));
      return;
    }
    const us = P.ourTeam || 0;
    pane.append(h('h3', null, '何を集める？'));
    const pr = h('div', { class: 'presets' });
    BS.clips.PRESETS.forEach((p) => {
      const b = h('button', { class: 'btn small' + (!HL.custom && HL.preset === p.id ? ' on' : ''), title: p.hint, dataset: { preset: p.id } }, p.label);
      b.addEventListener('click', () => { HL.custom = null; HL.preset = p.id; HL.cause = null; if (p.id === 'player' && !HL.pid) HL.pid = bestScorer(); rebuild(); render(); drawTL(); });
      pr.appendChild(b);
    });
    if (HL.custom) pr.appendChild(h('button', { class: 'btn small on' }, HL.custom.label));
    pane.append(pr);

    const bar = h('div', { class: 'clipbar' });
    if (!HL.custom && HL.preset === 'player') {
      bar.append(h('label', null, '選手', h('select', { onchange: (e) => { HL.pid = e.target.value; rebuild(); render(); drawTL(); } },
        P.teams[us].players.map((p) => h('option', { value: p.id, selected: p.id === HL.pid }, `#${p.no} ${p.name || ''}`)))));
    }
    if (!HL.custom) {
      bar.append(
        h('label', { title: '空欄なら種類ごとの標準（得点は前6秒・後2.5秒）' }, '前', h('input', { type: 'number', min: 0, max: 30, step: 0.5, placeholder: '自動', value: HL.lead == null ? '' : HL.lead, onchange: (e) => { HL.lead = e.target.value === '' ? null : Number(e.target.value); rebuild(); render(); drawTL(); } }), '秒'),
        h('label', null, '後', h('input', { type: 'number', min: 0, max: 30, step: 0.5, placeholder: '自動', value: HL.lag == null ? '' : HL.lag, onchange: (e) => { HL.lag = e.target.value === '' ? null : Number(e.target.value); rebuild(); render(); drawTL(); } }), '秒'));
      if (HL.preset === 'score') bar.append(h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: HL.ft, onchange: (e) => { HL.ft = e.target.checked; rebuild(); render(); drawTL(); } }), 'FTも入れる'));
    }
    const on = HL.clips.filter((c) => c.on !== false);
    const secs = on.reduce((s, c) => s + (c.t1 - c.t0), 0);
    bar.append(h('span', { class: 'note', style: { marginLeft: 'auto' } }, `${on.length}/${HL.clips.length} クリップ・約 ${BS.fmtTime(secs + (on.length ? 4.7 : 0))}`));
    pane.append(bar);

    if (!HL.custom && HL.preset === 'concede') {
      const all = BS.clips.build(P, M, 'concede', {});
      const sum = BS.clips.causeSummary(all);
      const total = all.reduce((s, c) => s + (c.pts || 0), 0);
      const box = h('div', { class: 'causes' });
      const chip = (id, lab, n, pts) => {
        const b = h('button', { class: 'chip' + (HL.cause === id ? ' on' : ''), title: 'この原因だけにする' }, lab, h('b', null, `${n}回・${pts}点`));
        b.addEventListener('click', () => { HL.cause = HL.cause === id ? null : id; rebuild(); render(); drawTL(); });
        return b;
      };
      box.append(chip(null, 'すべて', all.length, total));
      sum.forEach((s) => box.append(chip(s.id, s.short, s.n, s.pts)));
      pane.append(h('p', { class: 'note' }, '失点を「攻撃の始まり」から切り出し、原因で分けています（スティール後・TO後・速攻・OR後・FT・3P・ペイント・ミドル）。'), box);
    }

    const list = h('div', { class: 'cliplist' });
    if (!HL.clips.length) list.append(h('div', { class: 'card note' }, '該当する場面がありません。'));
    HL.clips.forEach((c, i) => list.append(clipRow(c, i)));
    pane.append(list);

    const acts = h('div', { class: 'row', style: { marginTop: '10px' } },
      h('button', { class: 'btn primary', disabled: !on.length, onclick: () => playReel(HL.clips, presetLabel()) }, '▶ 連続再生'),
      h('button', { class: 'btn', onclick: () => stop() }, '⏹ 停止'),
      h('button', { class: 'btn good', id: 'btnExport', disabled: !on.length || !!HL.exporting, onclick: () => doExport() }, '🎬 動画に書き出し'),
      h('button', { class: 'btn small', onclick: () => { HL.clips.forEach((c) => { c.on = true; }); HL.edited = true; render(); drawTL(); } }, '全部選ぶ'),
      h('button', { class: 'btn small', onclick: () => { HL.clips.forEach((c) => { c.on = false; }); HL.edited = true; render(); drawTL(); } }, '全部外す'),
      h('button', { class: 'btn small', title: '他の編集ソフト用のクリップ一覧', onclick: () => clipCSV() }, '一覧CSV'));
    pane.append(acts);
    pane.append(exportBox());
  }
  function bestScorer() {
    const P = app.store.project, M = app.model();
    const us = P.ourTeam || 0;
    const ps = P.teams[us].players.map((p) => M.players[p.id]).filter(Boolean).sort((a, b) => b.box.pts - a.box.pts);
    return ps.length ? ps[0].id : '';
  }

  function clipRow(c, i) {
    const row = h('div', { class: 'clip' + (c.on === false ? ' off' : '') + (reel.active && reel.clips[reel.i] && reel.clips[reel.i].id === c.id ? ' playing' : ''), dataset: { cid: c.id } },
      h('input', { type: 'checkbox', checked: c.on !== false, title: '書き出しに含める', onchange: (e) => { c.on = e.target.checked; HL.edited = true; row.classList.toggle('off', !c.on); updateCount(); drawTL(); } }),
      h('span', { class: 'ix' }, i + 1),
      h('div', { class: 'tt' },
        h('b', { title: c.caption || c.title }, c.caption || c.title, c.cause ? h('span', { class: 'tag' }, BS.clips.causeLabel(c.cause)) : null),
        h('span', null, `${BS.fmtTime(c.t0, true)} 〜 ${BS.fmtTime(c.t1, true)}（${(c.t1 - c.t0).toFixed(1)}秒）　${c.sub || ''}`)),
      h('div', { class: 'cops' },
        h('button', { title: 'このクリップを再生', onclick: () => playReel([c], c.title) }, '▶'),
        h('button', { title: '上へ', onclick: () => move(i, -1) }, '↑'),
        h('button', { title: '下へ', onclick: () => move(i, 1) }, '↓'),
        h('button', { title: '開始を今の再生位置に', onclick: () => trim(c, 't0') }, '⇤'),
        h('button', { title: '終了を今の再生位置に', onclick: () => trim(c, 't1') }, '⇥'),
        h('button', { title: 'テロップを編集', onclick: () => editCaption(c) }, '✎')));
    return row;
  }
  function updateCount() {
    const on = HL.clips.filter((c) => c.on !== false);
    const b = $('#btnExport');
    if (b) b.disabled = !on.length || !!HL.exporting;
  }
  function move(i, d) {
    const j = i + d;
    if (j < 0 || j >= HL.clips.length) return;
    const tmp = HL.clips[i]; HL.clips[i] = HL.clips[j]; HL.clips[j] = tmp;
    HL.edited = true; render();
  }
  function trim(c, key) {
    const t = app.time();
    if (key === 't0' && t >= c.t1 - 0.5) { BS.ui.toast('開始は終了より前にしてください', 'err'); return; }
    if (key === 't1' && t <= c.t0 + 0.5) { BS.ui.toast('終了は開始より後にしてください', 'err'); return; }
    c[key] = Math.round(t * 10) / 10;
    HL.edited = true; render(); drawTL();
    BS.ui.toast(`${key === 't0' ? '開始' : '終了'}を ${BS.fmtTime(t, true)} にしました`, 'ok');
  }
  function editCaption(c) {
    const inp = h('input', { value: c.caption || c.title });
    const sub = h('input', { value: c.sub || '' });
    BS.ui.modal({
      title: 'テロップを編集', body: h('div', null, h('label', { class: 'field' }, '1行目（大きい文字）', inp), h('label', { class: 'field' }, '2行目', sub),
        h('p', { class: 'note' }, '書き出した動画の各クリップの最初の約3秒に表示されます。コーチのコメントを入れるのもおすすめです。')),
      buttons: [{ label: 'キャンセル' }, { label: '保存', cls: 'primary', onClick: () => { c.caption = inp.value; c.sub = sub.value; HL.edited = true; render(); } }]
    });
  }
  function drawTL() { app.reelVersion = (app.reelVersion || 0) + 1; BS.uiPlayer.drawTimeline(); }
  function clipCSV() {
    const rows = [['#', '開始(秒)', '終了(秒)', '開始', '終了', 'タイトル', 'サブ', '含める']];
    HL.clips.forEach((c, i) => rows.push([i + 1, c.t0.toFixed(2), c.t1.toFixed(2), BS.fmtTime(c.t0, true), BS.fmtTime(c.t1, true), c.caption || c.title, c.sub || '', c.on === false ? 'いいえ' : 'はい']));
    BS.ui.download('highlight_clips.csv', BS.ui.csv(rows), 'text/csv');
  }

  /* ---------- 連続再生（映像の上で） ---------- */
  function playReel(clips, label) {
    const list = clips.filter((c) => c.on !== false);
    if (!list.length) { BS.ui.toast('再生する場面がありません', 'warn'); return; }
    if (!app.media) { BS.ui.toast('動画が開かれていません', 'err'); return; }
    reel.clips = list; reel.label = label || ''; reel.active = true;
    startClip(0);
  }
  function startClip(i) {
    reel.i = i;
    const c = reel.clips[i];
    reel.capUntil = c.t0 + 3.6;
    app.seek(c.t0, { fromReel: true });
    app.play();
    updateReelUI();
  }
  function step(d) {
    if (!reel.active) return;
    const j = reel.i + d;
    if (j < 0) { startClip(0); return; }
    if (j >= reel.clips.length) { stop(); return; }
    startClip(j);
  }
  function stop(silent) {
    if (!reel.active) return;
    reel.active = false;
    app.pause();
    updateReelUI();
    if (!silent) BS.ui.toast('連続再生を終了しました', 'ok');
  }
  function onTime(t) {
    if (!reel.active) return;
    const c = reel.clips[reel.i];
    if (!c) { stop(true); return; }
    if (t >= c.t1 - 0.03) {
      if (reel.i + 1 < reel.clips.length) startClip(reel.i + 1);
      else { reel.active = false; app.pause(); updateReelUI(); BS.ui.toast(`「${reel.label}」を最後まで再生しました`, 'ok'); }
      return;
    }
    const cap = $('#ovCaption');
    const show = t < reel.capUntil;
    if (cap.hidden === show) cap.hidden = !show;
  }
  function updateReelUI() {
    const bar = $('#reelBar'), cap = $('#ovCaption');
    const pr = $('#ovPrompt');
    if (pr) pr.hidden = reel.active;
    if (!reel.active) {
      bar.hidden = true; cap.hidden = true;
      document.querySelectorAll('.clip.playing').forEach((r) => r.classList.remove('playing'));
      return;
    }
    const c = reel.clips[reel.i];
    bar.hidden = false;
    $('#reelLabel').textContent = `${reel.label}　${reel.i + 1}/${reel.clips.length}`;
    cap.querySelector('b').textContent = c.caption || c.title;
    cap.querySelector('span').textContent = c.sub || '';
    cap.hidden = false;
    document.querySelectorAll('.clip').forEach((r) => r.classList.toggle('playing', r.dataset.cid === c.id));
  }
  function sendToHighlights() {
    if (!reel.clips.length) return;
    HL.custom = { label: reel.label || '選んだ場面', clips: reel.clips.map((c) => Object.assign({}, c, { on: true })) };
    HL.clips = HL.custom.clips.map((c) => Object.assign({}, c));
    HL.edited = true;
    app.showTab('hl');
    render(); drawTL();
  }

  /* ---------- 書き出し ---------- */
  function exportBox() {
    const box = h('div', { class: 'card exportbox', id: 'exportBox' });
    const sup = BS.exportSupport();
    if (!sup) { box.append(h('p', { class: 'note' }, 'このブラウザは動画の書き出しに対応していません（Chrome / Edge 推奨）。連続再生は使えます。')); return box; }
    if (HL.exporting) {
      box.append(h('b', null, '書き出し中… '), h('span', { id: 'expLabel', class: 'note' }, ''),
        h('div', { class: 'progress' }, h('i', { id: 'expBar' })),
        h('p', { class: 'note' }, '実際の長さの時間がかかります。このタブを表示したままにしてください（別のタブにすると止まります）。'),
        h('button', { class: 'btn small danger', onclick: () => { HL.exporting.ctrl.abort(); } }, '中止'));
    } else if (HL.result) {
      const r = HL.result;
      const v = h('video', { src: r.url, controls: true, playsinline: true });
      box.append(h('b', null, '✅ 書き出しました '), h('span', { class: 'note' }, `${r.ext.toUpperCase()}・${(r.blob.size / 1048576).toFixed(1)}MB・約${Math.round(r.seconds)}秒${app.media && app.media.kind === 'video' && r.audio === false ? '・音声なし（ブラウザが音声の取り込みを許しませんでした）' : ''}`), v,
        h('div', { class: 'row', style: { marginTop: '8px' } },
          h('a', { class: 'btn primary', href: r.url, download: r.name }, '⬇ ダウンロード'),
          h('span', { class: 'note' }, r.ext === 'webm' ? 'WebM 形式。iPhone で見る場合は MP4 への変換が必要なことがあります。' : 'MP4 形式。スマホ・LINE でも再生できます。')));
    } else {
      box.append(h('p', { class: 'note', style: { margin: 0 } }, `選んだクリップをつないで、タイトル・テロップ付きの動画（${sup.ext.toUpperCase()}）にします。音声も入ります（実動画のみ）。`));
    }
    return box;
  }
  async function doExport() {
    if (HL.exporting || !app.media) return;
    stop(true);
    const P = app.store.project, M = app.model();
    const clips = HL.clips.filter((c) => c.on !== false);
    const ctrl = new AbortController();
    HL.exporting = { ctrl };
    HL.result = null;
    render();
    const us = P.ourTeam || 0;
    const opts = {
      title: presetLabel(), sub: `${P.teams[0].name} vs ${P.teams[1].name}`,
      endLines: [`${P.teams[0].short} ${M.score[0]} - ${M.score[1]} ${P.teams[1].short}`, P.title || '', P.date || ''],
      accent: BS.ui.teamColor(P, us)
    };
    try {
      const res = await BS.exportReel(app.media, clips, opts, (frac, label) => {
        const bar = $('#expBar'), lab = $('#expLabel');
        if (bar) bar.style.width = (frac * 100).toFixed(1) + '%';
        if (lab) lab.textContent = `${label}（${Math.round(frac * 100)}%）`;
      }, ctrl.signal);
      if (res) {
        const base = (P.title || 'highlight').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
        res.name = `${base}_${presetLabel().replace(/[\\/:*?"<>|\s（）：]+/g, '_').slice(0, 30)}.${res.ext}`;
        HL.result = res;
        BS.ui.toast('ハイライト動画ができました', 'ok');
      } else BS.ui.toast('書き出しを中止しました', 'warn');
    } catch (err) {
      BS.ui.toast('書き出しに失敗しました：' + err.message, 'err', 6000);
    }
    HL.exporting = null;
    render();
  }

  function onData() { if (!HL.edited && !HL.custom) rebuild(); }

  BS.uiHL = { init, render, rebuild, playReel, stop, step, onTime, onData, clipsFor, reelActive: () => reel.active, state: HL, reel, doExport, presetLabel };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/ui-advice.js */
/* バスケ分析スタジオ — アドバイスのタブ */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h } = BS.ui;
  let app = null;

  function init(a) { app = a; }

  function playSpec(spec, label) {
    const P = app.store.project, M = app.model();
    const r = BS.advice.resolveClips(P, M, spec);
    if (r.preset) {
      const clips = BS.clips.build(P, M, r.preset, { cause: r.cause });
      BS.uiHL.playReel(clips, label);
    } else app.playEvents(r.events, label);
  }

  function render() {
    const pane = document.querySelector('.pane[data-pane="adv"]');
    if (!pane) return;
    const P = app.store.project, M = app.model();
    pane.innerHTML = '';
    if (!M.events.length) {
      pane.append(h('div', { class: 'card note' }, 'タグを付けると、試合の数字から「優先して取り組むこと」「良かった点」「選手ごとのポイント」「次の練習メニュー」を自動でまとめます。'));
      return;

    const A = BS.advice.analyze(P, M);
    const us = A.us;

      h('div', { class: 'key' }, A.headline.key),

    const fbox = h('div', { class: 'factors' });

        h('div', { class: 'fb' }, h('span', { class: 'mid' }), h('i', { style: { left: good ? '50%' : (50 - w) + '%', width: w + '%', background: good ? '#22c55e' : '#ef4444' } })),
        h('span', { class: 'v', style: { color: good ? '#86efac' : '#fca5a5' } }, `${f.pts >= 0 ? '+' : ''}${f.pts.toFixed(1)}点`)));
    });
    head.append(h('div', { class: 'note', style: { marginTop: '8px' } }, `4つの要因を「${A.usName}から見た点数」に置き換えた目安（右＝有利、左＝不利）`), fbox);
    pane.append(head);
    if (!A.enough) pane.append(h('p', { class: 'note' }, '※ シュートのタグがまだ少ないため、参考程度にご覧ください。'));

    pane.append(h('h3', null, '🎯 優先して取り組むこと ', h('small', null, '失った点数の目安が大きい順')));
    const cards = h('div', { class: 'advcards' });
    if (!A.issues.length) cards.append(h('div', { class: 'card note' }, '大きな課題は見つかりませんでした。'));
    A.issues.slice(0, 6).forEach((it, i) => cards.append(issueCard(it, i)));
    pane.append(cards);

    if (A.strengths.length) {
      pane.append(h('h3', null, '👍 良かった点'));
      const sc = h('div', { class: 'advcards' });
      A.strengths.forEach((s) => sc.append(h('div', { class: 'adv good' },
        h('div', { class: 'ah' }, h('span', null, s.icon), h('b', null, s.title)),
        h('ul', null, s.evidence.map((e) => h('li', null, e))),
        h('div', { class: 'how' }, '→ ', s.how),
        h('div', { class: 'ops' }, h('button', { class: 'btn small', onclick: () => playSpec(s.clips, s.title) }, '▶ 関連シーン')))));
      pane.append(sc);
    }

    pane.append(h('h3', null, '🏋️ 次の練習メニュー（例）', h('small', null, '課題の上位から組み立て')));
    pane.append(h('div', { class: 'practice' }, A.practice.map((p) => h('div', null, h('span', null, h('b', null, p.title), h('br'), h('span', { class: 'note' }, p.why)), h('span', { class: 'mins' }, p.minutes + '分')))));

    pane.append(h('h3', null, '👤 選手ごとのポイント ', h('small', null, P.teams[us].name)));
    const pl = h('div', { class: 'plist' });
    A.players.forEach((p) => {
      const b = p.box;
      pl.append(h('div', { class: 'pcard' },
        h('div', { class: 'ph' }, h('span', { class: 'kbd' }, '#' + p.no), h('b', null, p.name || ''), h('span', { class: 'note' }, p.pos || ''),
          h('span', { class: 'st' }, `${b.pts}点 ${b.reb}R ${b.ast}A ${b.tov}TO ${b.pf}F`)),
        p.good.map((g) => h('div', { class: 'g' }, '○ ', g)),
        p.improve.map((g) => h('div', { class: 'i' }, '△ ', g)),
        !p.good.length && !p.improve.length ? h('div', { class: 'note' }, '目立った数字はありません（出場時間・タグの数が少ない）') : null,
        h('div', { style: { marginTop: '6px' } }, h('button', { class: 'btn small', onclick: () => {
          const clips = BS.clips.build(P, M, 'player', { pid: p.pid });
          if (clips.length) BS.uiHL.playReel(clips, `#${p.no} ${p.name || ''} のハイライト`);
          else app.playEvents(M.events.filter((e) => e.pid === p.pid), `#${p.no} のプレー`);
        } }, '▶ この選手の場面'))));
    });
    pane.append(pl);

    if (A.scouting.length) {
      pane.append(h('h3', null, '🔍 相手の要注意選手 ', h('small', null, '次に対戦するときのスカウティング')));
      pane.append(h('div', { class: 'advcards' }, A.scouting.map((s) => h('div', { class: 'adv' },
        h('div', null, s.text), h('div', { class: 'ops' }, h('button', { class: 'btn small', onclick: () => playSpec(s.clips, s.text.split('：')[0]) }, '▶ 場面を見る'))))));
    }
    pane.append(h('div', { class: 'row no-print', style: { marginTop: '14px' } },
      h('button', { class: 'btn', onclick: () => BS.uiSetup.printReport() }, '🖨 レポートを印刷 / PDF'),
      h('span', { class: 'note' }, 'アドバイスは数字にもとづく目安です。映像で確認してから選手に伝えてください。')));
  }

  function issueCard(it, i) {
    return h('div', { class: 'adv' },
      h('div', { class: 'ah' }, h('span', null, it.icon), h('b', null, `${i + 1}. ${it.title}`), it.impact > 0 ? h('span', { class: 'imp', title: '失った点数の目安' }, `約${Math.round(it.impact)}点分`) : null),
      h('ul', null, it.evidence.map((e) => h('li', null, e))),
      h('div', { class: 'why' }, 'なぜ大事？ ', it.why),
      h('div', { class: 'how' }, h('b', null, 'どうする：'), h('ul', null, it.how.map((x) => h('li', null, x)))),
      h('div', { class: 'drill' }, '練習例：', it.drills.join('／')),
      h('div', { class: 'ops' },
        h('button', { class: 'btn small primary', onclick: () => playSpec(it.clips, it.title) }, '▶ 関連シーンを見る'),
        h('button', { class: 'btn small', onclick: () => {
          const P = app.store.project, M = app.model();
          const r = BS.advice.resolveClips(P, M, it.clips);
          const clips = r.preset ? BS.clips.build(P, M, r.preset, { cause: r.cause }) : BS.clips.fromEvents(P, M, r.events);
          BS.uiHL.state.custom = { label: it.title, clips: clips.map((c) => Object.assign({}, c, { on: true })) };
          BS.uiHL.state.edited = true;
          BS.uiHL.rebuild();
          app.showTab('hl');
        } }, '✂ ハイライトにする')));
  }

  BS.uiAdvice = { init, render };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/ui-setup.js */
/* バスケ分析スタジオ — 設定・ファイル（チーム設定、タグ編集、キー一覧、保存/読み込み、CSV、印刷、動画を開く） */
(function (root) {
  'use strict';
  const BS = root.BS;
  const { h, $ } = BS.ui;
  let app = null;

  function init(a) {
    app = a;
    $('#btnTeams').addEventListener('click', () => teamDialog());
    $('#btnKeys').addEventListener('click', () => keysDialog());
    $('#btnHelp').addEventListener('click', () => helpDialog());
    $('#btnOpen').addEventListener('click', () => $('#fileVideo').click());
    $('#fileVideo').addEventListener('change', (e) => { const fs = Array.from(e.target.files || []); e.target.value = ''; if (fs.length) openFiles(fs); });
    $('#fileProject').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) openProjectFile(f); });
    const menu = $('#fileMenu');
    $('#btnFile').addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
    document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true; });
    menu.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-cmd]');
      if (!b) return;
      menu.hidden = true;
      command(b.dataset.cmd);
    });
    $('#projTitle').addEventListener('change', (e) => { app.store.updateMeta({ title: e.target.value.trim() || '試合' }); });
    // ドラッグ&ドロップ
    let depth = 0;
    const drop = $('#ovDrop');
    const hasFile = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    document.addEventListener('dragenter', (e) => { if (!hasFile(e)) return; depth++; drop.hidden = false; e.preventDefault(); });
    document.addEventListener('dragleave', (e) => { if (!hasFile(e)) return; depth = Math.max(0, depth - 1); if (!depth) drop.hidden = true; });
    document.addEventListener('dragover', (e) => { if (hasFile(e)) e.preventDefault(); });
    document.addEventListener('drop', (e) => {
      if (!hasFile(e)) return;
      e.preventDefault(); depth = 0; drop.hidden = true;
      openFiles(Array.from(e.dataTransfer.files || []));
    });
  }

  function command(cmd) {
    const P = app.store.project;
    switch (cmd) {
      case 'saveJson': {
        const data = JSON.stringify(Object.assign({}, P, { persist: undefined }), null, 1);
        BS.ui.download(`${safeName(P.title)}.bstudio.json`, data, 'application/json');
        if (P.persist) app.store.saveNow();
        BS.ui.toast('プロジェクトを保存しました（動画ファイルは含まれません）', 'ok');
        break;
      }
      case 'openJson': $('#fileProject').click(); break;
      case 'recent': recentDialog(); break;
      case 'csvBox': BS.ui.download(`${safeName(P.title)}_boxscore.csv`, boxCSV(), 'text/csv'); break;
      case 'csvEvents': BS.ui.download(`${safeName(P.title)}_tags.csv`, eventsCSV(), 'text/csv'); break;
      case 'print': printReport(); break;
      case 'clearEvents':
        BS.ui.modal({
          title: 'タグをすべて消す', body: h('p', null, `タグ ${P.events.length} 件をすべて消します。（⌘/Ctrl+Z で元に戻せます）`),
          buttons: [{ label: 'キャンセル' }, { label: 'すべて消す', cls: 'primary', onClick: () => { app.store.replaceEvents([], 'すべて消す'); app.tagger.reset(); BS.ui.toast('タグを消しました', 'warn', 5000, { label: '元に戻す', fn: () => app.undo() }); } }]
        });
        break;
      default: break;
    }
  }
  function safeName(s) { return String(s || 'game').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60); }

  /* ---------- 動画・プロジェクトを開く ---------- */
  const isJsonFile = (f) => /\.json$/i.test(f.name) || f.type === 'application/json';
  const isVideoFile = (f) => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(f.name);
  /* 選んだ／ドロップしたファイルを開く。プロジェクト（.json）と動画を一緒に渡されたら、プロジェクトを開いてから動画をつなぐ */
  function openFiles(files) {
    const json = files.find(isJsonFile), video = files.find(isVideoFile);
    if (json && video) openProjectFile(json, () => openVideoFile(video));
    else if (json) openProjectFile(json);
    else if (video) openVideoFile(video);
    else if (files.length) BS.ui.toast('動画ファイル（mp4 / mov など）かプロジェクト（.json）を選んでください', 'err');
  }
  function openVideoFile(file) {
    // 開発時の確認用に、URL 文字列でも開ける（{ url, name, size }）
    if (file && file.url) { const u = file; file = { name: u.name || u.url.split('/').pop(), size: u.size || 0, _url: u.url }; }
    const media = BS.createVideoMedia(file._url || file);
    let settled = false;
    media.on('error', () => {
      if (settled) return;
      settled = true;
      BS.ui.toast('この動画は再生できませんでした（形式に未対応の可能性）。MP4（H.264）を試してください。', 'err', 8000);
    });
    media.on('ready', (info) => {
      if (settled) return;
      settled = true;
      const cur = app.store.project;
      /* project をこの動画につないで表示する。restored: 'same'（いま開いているプロジェクト）/ 'saved'（このブラウザに保存してあったもの）/ false（新しい試合） */
      const attach = (project, restored) => {
        project.persist = true;
        project.duration = info.duration;
        project.source = { kind: 'video', name: file.name, size: file.size, duration: info.duration };
        app.stopDemo('video');
        app.setMedia(media);
        if (restored !== 'same') app.store.set(project, 'load');
        else app.store.updateMeta({ duration: info.duration, source: project.source });
        const hasAuto = project.events.some((e) => e.auto);
        app.showTab(hasAuto ? 'auto' : project.events.length ? 'tag' : 'auto');
        if (restored === 'saved') BS.ui.toast(`前回のタグ ${project.events.length} 件を復元しました`, 'ok', 4500);
        else if (restored === 'same') BS.ui.toast(`動画をつなぎました（タグ ${project.events.length} 件）${hasAuto ? '。右の ③ から、ハイライト・集計・確認モードへ進めます' : ''}`, 'ok', 6000);
        else BS.ui.toast('動画を開きました。右の「⚡自動解析」で、① ゴールを教える → ② 解析する の順に進めてください', 'ok', 8000);
      };
      const fresh = () => {
        const hit = app.store.findByVideo(file.name, file.size);
        const saved = hit ? app.store.loadSaved(hit.id) : null;
        if (saved) { attach(saved, 'saved'); return; }
        // 試合の日付は、動画ファイルの日付（撮った日であることが多い）を初めの値にする。あとで「👥 チーム・選手」で直せる
        const d = file.lastModified ? new Date(file.lastModified) : null;
        const p2 = (n) => String(n).padStart(2, '0');
        const date = d && !isNaN(d.getTime()) ? `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}` : undefined;
        attach(BS.newProject({ title: file.name.replace(/\.[^.]+$/, ''), date, source: { kind: 'video', name: file.name, size: file.size } }), false);
      };
      const waiting = cur.source && cur.source.kind === 'video' && !app.media;      // プロジェクトだけ開いてあって、動画がまだ
      if (cur.source && cur.source.kind === 'video' && cur.source.name === file.name && cur.source.size === file.size) { attach(cur, 'same'); return; }
      if (waiting && cur.events.length) {
        // 名前や大きさが違う動画：同じ試合（名前を変えた・変換した）かどうかは分からないので聞く
        let chosen = false;
        BS.ui.modal({
          title: 'この動画を、開いているプロジェクトにつなぎますか？',
          body: h('p', null, `開いているプロジェクト「${cur.title}」は、動画「${cur.source.name}」に付けたタグ（${cur.events.length} 件）です。いま選んだ動画は「${file.name}」です。同じ試合の動画（名前を変えた・変換した）なら「つなぐ」を選んでください。`),
          buttons: [
            { label: '別の試合として開く', onClick: () => { chosen = true; fresh(); } },
            { label: 'このプロジェクトにつなぐ', cls: 'primary', onClick: () => { chosen = true; attach(cur, 'same'); } }],
          onClose: () => { if (!chosen) { media.destroy(); BS.ui.toast('動画は開きませんでした', 'warn'); } }
        });
        return;
      }
      fresh();
    });
  }

  function openProjectFile(file, then) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const p = JSON.parse(fr.result);
        if (!p || !Array.isArray(p.teams) || !Array.isArray(p.events)) throw new Error('形式が違います');
        const proj = BS.normalizeProject(p);
        if (proj.source && proj.source.kind === 'sample') {
          app.openSample({ keepEvents: proj.events, title: proj.title });
          BS.ui.toast('サンプル試合のプロジェクトを開きました', 'ok');
          return;
        }
        proj.persist = true;
        app.stopDemo('project');
        app.setMedia(null);
        app.store.set(proj, 'load');
        if (then) then();
        else BS.ui.toast(`プロジェクトを開きました（タグ ${proj.events.length} 件）。${proj.source && proj.source.name ? `続けて「🎬 動画を開く」で、動画「${proj.source.name}」を選んでください` : ''}`, 'ok', 9000);
      } catch (err) {
        BS.ui.toast('読み込めませんでした：' + err.message, 'err', 6000);
      }
    };
    fr.readAsText(file);
  }

  /* ---------- チーム・選手 ---------- */
  function rosterText(T) {
    return T.players.map((p) => [p.no, p.name || '', p.pos || '', p.starter ? '*' : ''].filter((x) => x !== '').join(' ')).join('\n');
  }
  function parseRoster(text, prefix, old) {
    const out = [];
    const seen = new Set();
    const errors = [];
    text.split(/\r?\n/).forEach((line, i) => {
      const s = line.trim();
      if (!s) return;
      const tokens = s.split(/[\s,、　]+/).filter(Boolean);
      const no = tokens.shift();
      if (!/^\d{1,2}$/.test(no)) { errors.push(`${i + 1}行目：背番号は数字（0〜99）で始めてください`); return; }
      if (seen.has(no)) { errors.push(`${i + 1}行目：#${no} が重複しています`); return; }
      seen.add(no);
      let starter = false, pos = '';
      const rest = [];
      tokens.forEach((tk) => {
        if (tk === '*' || tk === '★' || tk === '先発' || tk === 'S') starter = true;
        else if (/^(PG|SG|SF|PF|C|G|F)$/i.test(tk)) pos = tk.toUpperCase();
        else rest.push(tk);
      });
      const prev = old.find((p) => p.no === no);
      out.push({ id: prev ? prev.id : prefix + no, no, name: rest.join(' '), pos, starter });
    });
    return { players: out, errors };
  }
  function teamDialog(isNew) {
    const P = app.store.project;
    const body = h('div');
    const cols = h('div', { class: 'grid2' });
    const refs = [0, 1].map((tm) => {
      const T = P.teams[tm];
      const name = h('input', { value: T.name });
      const short = h('input', { value: T.short, maxlength: 5 });
      const color = h('input', { type: 'color', value: T.color || (tm ? '#e0413a' : '#2f6fed'), style: { height: '34px', padding: '2px' } });
      const ta = h('textarea', { spellcheck: 'false' }, rosterText(T));
      const info = h('div', { class: 'note' });
      const upd = () => { const r = parseRoster(ta.value, tm === 0 ? 'A' : 'B', T.players); info.textContent = `${r.players.length}人・スタメン ${r.players.filter((p) => p.starter).length}人${r.errors.length ? '　⚠ ' + r.errors[0] : ''}`; info.style.color = r.errors.length ? '#fca5a5' : ''; };
      ta.addEventListener('input', upd); upd();
      cols.append(h('div', null,
        h('label', { class: 'field' }, `チーム名（${tm === 0 ? '左' : '右'}）`, name),
        h('div', { class: 'grid2' }, h('label', { class: 'field' }, '略称（3〜4文字）', short), h('label', { class: 'field' }, '色', color)),
        h('label', { class: 'field' }, '選手（1行に1人：背番号 名前 ポジション *＝スタメン）', ta), info));
      return { name, short, color, ta };
    });
    const ours = h('select', null, [0, 1].map((tm) => h('option', { value: tm, selected: (P.ourTeam || 0) === tm }, P.teams[tm].name)));
    const perMin = h('select', null, [[8, '8分（中学）'], [10, '10分（高校・一般 FIBA）'], [12, '12分（NBA）'], [5, '5分（ミニ・練習）']].map(([v, l]) => h('option', { value: v, selected: Number(P.periodMinutes) === v }, l)));
    const title = h('input', { value: P.title });
    const date = h('input', { type: 'date', value: P.date || '' });
    body.append(
      isNew ? h('p', { class: 'note', style: { marginTop: 0 } }, '背番号だけでもタグ付けできます。名前・スタメン（* 印）を入れると、集計とアドバイスがわかりやすくなります。スタメン5人と交代を記録すると、出場時間と +/- も出ます。') : '',
      h('div', { class: 'grid2' }, h('label', { class: 'field' }, '試合名', title), h('label', { class: 'field' }, '日付', date)),
      cols,
      h('div', { class: 'grid2' }, h('label', { class: 'field' }, '分析する側（自チーム）', ours), h('label', { class: 'field' }, '1ピリオドの長さ', perMin)));

          const teams = [0, 1].map((tm) => {

            return { parsed, team: Object.assign({}, P.teams[tm], { name: r.name.value.trim() || P.teams[tm].name, short: (r.short.value.trim() || P.teams[tm].short).slice(0, 5), color: r.color.value, players: parsed.players }) };
          });
          const err = teams.map((x) => x.parsed.errors[0]).filter(Boolean)[0];

          if (teams.some((x) => !x.team.players.length)) { BS.ui.toast('選手を1人以上入れてください', 'err'); return false; }

      }]
