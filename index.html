<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バスケ分析スタジオ</title>
<meta name="description" content="バスケの試合動画にタグを付けて、個人スタッツ・場面別集計・ファウル・ハイライト動画・アドバイスまで作るブラウザアプリ">
<style>
/* バスケ分析スタジオ */
:root {
  --bg: #0c1019;
  --panel: #131a27;
  --panel2: #182133;
  --panel3: #1e2940;
  --line: #26324a;
  --line2: #33415f;
  --text: #e8eef8;
  --muted: #95a3bd;
  --faint: #6b7892;
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.16);
  --good: #22c55e;
  --good-soft: rgba(34, 197, 94, 0.14);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.14);
  --bad: #ef4444;
  --bad-soft: rgba(239, 68, 68, 0.14);
  --home: #2f6fed;
  --away: #e0413a;
  --radius: 10px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
a { color: #8ab4ff; }
.num { font-variant-numeric: tabular-nums; font-family: var(--font); }

/* ---------- ヘッダー ---------- */
.topbar { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: #0f1522; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .logo { font-size: 26px; }
.brand b { display: block; font-size: 16px; letter-spacing: 0.02em; }
.brand small { display: block; color: var(--muted); font-size: 11px; margin-top: -2px; }
.proj { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; min-width: 0; }
.proj input { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-weight: 600; min-width: 0; width: 100%; max-width: 360px; }
.proj input:hover, .proj input:focus { border-color: var(--line2); background: var(--panel); outline: none; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--panel3); color: var(--muted); white-space: nowrap; }
.badge.sample { background: rgba(245, 158, 11, 0.16); color: #fbbf24; }
.badge.video { background: var(--good-soft); color: #4ade80; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 11px; font-size: 13px; line-height: 1.3; white-space: nowrap; transition: background 0.12s, border-color 0.12s; }
.btn:hover { background: var(--panel3); border-color: #45567a; }
.btn:active { transform: translateY(1px); }
/* ボタンの中で書き換わる記号（▶⇄⏸）。クリックの当たり判定はボタン本体に任せる（js/ui-player.js の説明を参照） */
.btn .ico { pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2f74ea; }
.btn.good { background: #16a34a; border-color: #16a34a; color: #fff; }
.btn.danger { color: #fca5a5; }
.btn.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.icon { padding: 6px 9px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: #cfe0ff; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 6px; min-width: 250px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); z-index: 40; }
.menu-list button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.menu-list button:hover { background: var(--panel3); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }

/* ---------- レイアウト ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1.28fr) minmax(400px, 1fr); gap: 12px; padding: 12px; align-items: start; }
body.wide .main { grid-template-columns: minmax(0, 0.8fr) minmax(520px, 1.2fr); }
.stage, .panel { min-width: 0; }
.stage { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 64px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 400px; }

/* ---------- 映像 ---------- */
.viewer { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; aspect-ratio: 16 / 9; border: 1px solid var(--line); }
.media-slot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.media-el { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.empty-media { color: var(--muted); text-align: center; padding: 20px; }
.empty-media b { color: var(--text); font-size: 16px; }
.ov-prompt { position: absolute; left: 10px; bottom: 10px; max-width: calc(100% - 20px); background: rgba(10, 14, 22, 0.82); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 10px; font-size: 13px; pointer-events: none; backdrop-filter: blur(4px); transition: opacity 0.2s; }
.ov-prompt b { color: #fff; }
.ov-prompt small { display: block; color: var(--muted); font-size: 11.5px; }
.ov-prompt.busy { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.ov-flash { position: absolute; right: 10px; top: 60px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
.ov-flash div { background: rgba(10, 14, 22, 0.86); border-left: 4px solid var(--good); padding: 5px 10px; border-radius: 6px; font-size: 13px; animation: flashIn 0.18s ease-out; }
.ov-flash div.info { border-left-color: var(--accent); }
.ov-flash div.err { border-left-color: var(--bad); }
@keyframes flashIn { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
.ov-caption { position: absolute; left: 4%; bottom: 7%; max-width: 80%; background: rgba(8,12,20,0.85); border-left: 6px solid var(--accent); padding: 8px 16px; border-radius: 8px; pointer-events: none; }
.ov-caption b { display: block; font-size: clamp(13px, 1.7vw, 20px); }
.ov-caption span { color: #c9d4e6; font-size: clamp(11px, 1.2vw, 14px); }
.ov-reel { position: absolute; right: 10px; top: 10px; background: rgba(8,12,20,0.8); padding: 3px 10px; border-radius: 6px; font-size: 12px; pointer-events: none; }
.ov-drop { position: absolute; inset: 0; background: rgba(59,130,246,0.25); border: 3px dashed var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
.ov-demo-note { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(245,158,11,0.92); color: #1b1300; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 99px; pointer-events: none; }

/* ---------- 再生バー ---------- */
.transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; }
.transport .btn { padding: 5px 9px; }
.transport .play { min-width: 44px; justify-content: center; background: var(--accent); border-color: var(--accent); color: #fff; }
.transport .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; margin-left: 4px; }
.transport .time b { color: var(--text); }
.transport select { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 6px; }
.transport .spacer { flex: 1; }
.transport .gamestate { font-size: 13px; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

/* ---------- タイムライン ---------- */
.timeline { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px 4px; }
.timeline canvas { width: 100%; height: 104px; display: block; cursor: pointer; touch-action: none; }
.tl-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 3px; flex-wrap: wrap; }
.tl-head .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.tl-head .seg button { background: none; border: 0; padding: 1px 8px; font-size: 11.5px; color: var(--muted); }
.tl-head .seg button.on { background: var(--accent-soft); color: #cfe0ff; }
.tl-legend { display: flex; gap: 10px; flex-wrap: wrap; }
.tl-legend span { display: inline-flex; align-items: center; gap: 4px; }
.tl-tip { position: absolute; background: #0b0f18; border: 1px solid var(--line2); border-radius: 6px; padding: 4px 8px; font-size: 12px; pointer-events: none; white-space: nowrap; z-index: 5; }

/* ---------- イベント一覧 ---------- */
.log { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 150px; }
.log-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.log-head b { font-size: 13px; margin-right: 4px; }
.chip { background: var(--panel2); border: 1px solid var(--line2); border-radius: 99px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: #cfe0ff; }
.log-list { overflow-y: auto; max-height: 230px; position: relative; }
.log-row { display: grid; grid-template-columns: 58px 30px 12px minmax(0, 1fr) 70px 52px; gap: 6px; align-items: center; padding: 3px 8px; border-bottom: 1px solid rgba(38,50,74,0.6); font-size: 12.5px; cursor: pointer; }
.log-row:hover { background: var(--panel2); }
.log-row.cur { background: var(--accent-soft); }
.log-row.flashrow { animation: rowFlash 1.2s ease-out; }
@keyframes rowFlash { from { background: rgba(34,197,94,0.35); } to { background: transparent; } }
.log-row .tm { font-variant-numeric: tabular-nums; color: var(--muted); }
.log-row .desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-row .sc { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; font-size: 12px; }
.log-row .ops { display: flex; gap: 2px; justify-content: flex-end; }
.log-row .ops button { background: none; border: 0; padding: 0 3px; color: var(--faint); font-size: 13px; }
.log-row .ops button:hover { color: var(--text); }
.log-empty { padding: 18px; color: var(--muted); text-align: center; font-size: 13px; }

/* ---------- タブ ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); scrollbar-width: none; }
@media (max-width: 700px) { .tabs { flex-wrap: nowrap; overflow-x: auto; } }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 9px 8px; color: var(--muted); font-size: 13px; white-space: nowrap; border-radius: 6px 6px 0 0; }
.tab:hover { color: var(--text); background: var(--panel2); }
.tab.on { color: #fff; border-bottom-color: var(--accent); background: var(--panel2); font-weight: 600; }
.tab .n { font-size: 10.5px; background: var(--panel3); border-radius: 99px; padding: 0 6px; margin-left: 4px; color: var(--muted); }
.tabbody { padding: 12px; overflow: auto; }
.pane h3 { font-size: 14px; margin: 16px 0 8px; display: flex; align-items: center; gap: 8px; }
.pane h3:first-child { margin-top: 0; }
.pane h3 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.note { color: var(--muted); font-size: 12px; }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- タグ付け ---------- */
.prompt { background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--radius); padding: 7px 12px; margin-bottom: 10px; height: 94px; overflow: hidden; }
.prompt.busy { border-color: var(--accent); background: linear-gradient(0deg, var(--panel2), rgba(59,130,246,0.12)); }
.prompt b { font-size: 15px; }
.prompt b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prompt small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prompt .opts { display: flex; gap: 5px; flex-wrap: nowrap; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.prompt .opts .btn { flex: none; }
.rosters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.roster { border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; background: var(--panel2); transition: box-shadow 0.15s, border-color 0.15s; }
.roster.active { border-color: var(--team, var(--accent)); box-shadow: 0 0 0 1px var(--team, var(--accent)) inset; }
.roster-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; font-size: 13px; }
.roster-head b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster-head .kbd { font-size: 10.5px; }
.pl { display: grid; grid-template-columns: 16px 30px minmax(0, 1fr) auto; gap: 5px; align-items: center; width: 100%; background: var(--panel); border: 1px solid transparent; border-radius: 7px; padding: 3px 5px; margin-bottom: 3px; text-align: left; font-size: 12.5px; }
.pl:hover { border-color: var(--line2); background: var(--panel3); }
.pl.sel { border-color: #fff; background: var(--panel3); }
.pl .no { font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; background: var(--team, #445); border-radius: 5px; text-align: center; padding: 0 2px; }
.pl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .st { color: var(--muted); font-size: 11px; white-space: nowrap; }
.pl .st .pf5 { color: #fca5a5; font-weight: 700; }
.pl .oc { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--faint); background: transparent; padding: 0; }
.pl .oc.on { background: var(--good); border-color: var(--good); }
.pl.bench { opacity: 0.78; }
.pl.teamchip { grid-template-columns: 1fr; text-align: center; color: var(--muted); font-size: 11.5px; padding: 2px; }
.pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
.act { position: relative; background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 9px 4px 7px; font-size: 12.5px; font-weight: 600; text-align: center; }
.act:hover { background: var(--panel3); }
.act.pressed { transform: scale(0.96); background: var(--accent-soft); border-color: var(--accent); }
.act.sel { background: var(--accent-soft); border-color: var(--accent); }
.act .lbl-short { display: none; }
.act .k { position: absolute; top: 2px; right: 4px; font-size: 10px; color: var(--faint); font-family: var(--mono); font-weight: 400; }
.act.made { border-bottom: 3px solid var(--good); }
.act.miss { border-bottom: 3px solid #64748b; }
.act.bad { border-bottom: 3px solid var(--bad); }
.act.good { border-bottom: 3px solid #38bdf8; }
.act.game { border-bottom: 3px solid #a78bfa; }
.tagfoot { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 10px; align-items: start; }
.court-mini { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
.court-mini svg { width: 100%; display: block; cursor: crosshair; }
.court-mini .cap { font-size: 11.5px; color: var(--muted); text-align: center; }
/* コート図の上の印（シュートの位置）は、クリックの当たり判定から外す。押している間に印を描き直しても、クリックはコート図に届く */
.court-marks { pointer-events: none; }
/* 確認モード：どこから打ったか（コート図を大きく出す。プレーのボタンと下の小さい図は、その間は隠す） */
.revloc { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel2); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 10px 8px 8px; margin-bottom: 10px; }
.revloc[hidden] { display: none; }
.revloc .rc svg { width: 100%; aspect-ratio: 1 / 1; display: block; cursor: crosshair; border-radius: 6px; }
.revloc .rc .cap { font-size: 11px; color: var(--muted); text-align: center; margin-top: 3px; }
.revloc .rs { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.revloc .rs b { font-size: 15px; }
.revloc .st { font-size: 13.5px; background: var(--panel3); border: 1px solid var(--line2); border-radius: 8px; padding: 5px 9px; }
.revloc .st:empty { display: none; }
.revloc .st.done { border-color: #16a34a; color: #86efac; }
.revloc .note { min-height: 2.9em; }
.revloc .row { margin-top: auto; }
.revloc.off .rc svg { opacity: 0.4; cursor: default; }
.revloc.nocourt { grid-template-columns: minmax(0, 1fr); border-color: var(--line2); }
.revloc.nocourt .rc { display: none; }
.revloc.nocourt .note { min-height: 0; }
.pane.reviewing #pad, .pane.reviewing .tagfoot { display: none; }
/* タグの編集画面の中のコート図 */
.editloc { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 10px; align-items: start; margin-top: 8px; }
.editloc .ec svg { width: 100%; aspect-ratio: 1 / 1; display: block; cursor: crosshair; border-radius: 6px; }
@media (max-height: 760px) { .revloc { grid-template-columns: 176px minmax(0, 1fr); } }
.kbd { display: inline-block; font-family: var(--mono); font-size: 11px; background: var(--panel3); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--text); line-height: 1.5; }
.keyhelp { font-size: 12px; color: var(--muted); line-height: 1.9; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; user-select: none; }
.switch input { accent-color: var(--accent); }

/* ---------- 表 ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 4px 6px; text-align: right; border-bottom: 1px solid rgba(38,50,74,0.7); white-space: nowrap; }
.tbl th { background: var(--panel3); color: var(--muted); font-weight: 600; font-size: 11.5px; position: sticky; top: 0; cursor: default; }
.tbl th.sortable { cursor: pointer; }
.tbl th.sorted { color: #fff; }
.tbl td.l, .tbl th.l { text-align: left; }
.tbl tr.total td { background: var(--panel2); font-weight: 700; }
.tbl tr.bench td:first-child { color: var(--muted); }
.tbl td .lnk, .lnk { cursor: pointer; border-radius: 4px; padding: 0 3px; }
.tbl td .lnk:hover, .lnk:hover { background: var(--accent); color: #fff; }
.tbl td.hl { color: #fbbf24; font-weight: 700; }
.tbl td.neg { color: #fca5a5; }
.tbl td.pos { color: #86efac; }
.tbl .pn { display: inline-flex; gap: 6px; align-items: center; }
.tbl .pn .no { font-weight: 800; min-width: 22px; text-align: right; }
.teamhead { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; font-weight: 700; }
.teamhead .score { margin-left: auto; font-size: 20px; font-variant-numeric: tabular-nums; }

/* 比較バー */
.cmp { display: grid; grid-template-columns: 1fr 150px 1fr; gap: 6px 10px; align-items: center; font-size: 12.5px; }
.cmp .lab { text-align: center; color: var(--muted); font-size: 12px; }
.cmp .bar { height: 18px; background: var(--panel3); border-radius: 4px; position: relative; overflow: hidden; }
.cmp .bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.cmp .bar.l i { right: 0; }
.cmp .bar.r i { left: 0; }
.cmp .bar span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-weight: 700; font-size: 12px; padding: 0 6px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
.cmp .bar.l span { left: 0; }
.cmp .bar.r span { right: 0; }
.cmp .win { outline: 1px solid rgba(255,255,255,0.5); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.kpi { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.kpi small { color: var(--muted); font-size: 11.5px; display: block; }
.kpi b { font-size: 17px; font-variant-numeric: tabular-nums; }
.kpi b i { font-style: normal; color: var(--muted); font-size: 12px; font-weight: 400; margin: 0 3px; }

/* 場面別 */
.ppp-bars { display: flex; flex-direction: column; gap: 5px; }
.ppp-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 118px; gap: 8px; align-items: center; font-size: 12.5px; }
.ppp-row .track { height: 16px; background: var(--panel3); border-radius: 4px; position: relative; }
.ppp-row .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.ppp-row .track .avg { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; opacity: 0.7; }
.ppp-row .v { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.ppp-row .v b { color: var(--text); }
.flowchart { width: 100%; height: 150px; display: block; background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); }
.seg2 { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
.seg2 button { background: var(--panel2); border: 0; padding: 4px 10px; font-size: 12.5px; color: var(--muted); }
.seg2 button.on { background: var(--accent); color: #fff; }

/* ショットチャート */
.shotwrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.shotchart { width: 100%; display: block; background: #2a2016; border-radius: var(--radius); }
.shotchart .shot { cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
.filters select { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; max-width: 100%; }

/* ファウル */
.fdots { display: inline-flex; gap: 3px; }
.fdots i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; background: var(--warn); }
.fdots i.q1 { background: #facc15; } .fdots i.q2 { background: #fb923c; } .fdots i.q3 { background: #f87171; } .fdots i.q4 { background: #e879f9; } .fdots i.q5 { background: #a78bfa; }
.bonus { color: #fca5a5; font-weight: 700; }
.warnlist { display: flex; flex-direction: column; gap: 6px; }
.warnlist .w { background: var(--warn-soft); border: 1px solid rgba(245,158,11,0.35); border-radius: 8px; padding: 6px 10px; font-size: 13px; }

/* ハイライト */
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.clipbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.clipbar label { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.clipbar input[type=number] { width: 54px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 3px 5px; }
.causes { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.causes .chip b { color: var(--text); margin-left: 3px; }
.cliplist { display: flex; flex-direction: column; gap: 4px; }
.clip { display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
.clip.playing { border-color: var(--accent); background: var(--accent-soft); }
.clip.off { opacity: 0.5; }
.clip .ix { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.clip .tt { overflow: hidden; }
.clip .tt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip .tt span { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.clip .cops { display: flex; gap: 2px; }
.clip .cops button { background: var(--panel); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 5px; font-size: 12px; color: var(--muted); }
.clip .cops button:hover { color: #fff; border-color: var(--accent); }
.clip .tag { font-size: 10.5px; padding: 0 6px; border-radius: 99px; background: var(--bad-soft); color: #fca5a5; margin-left: 4px; }
.exportbox { margin-top: 12px; }
.progress { height: 8px; background: var(--panel3); border-radius: 99px; overflow: hidden; margin: 6px 0; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
.exportbox video { width: 100%; border-radius: 8px; margin-top: 8px; background: #000; }

/* アドバイス */
.headline { background: linear-gradient(135deg, #182440, #1b2b1f00); border: 1px solid var(--line2); border-radius: var(--radius); padding: 12px 14px; }
.headline .res { font-size: 16px; font-weight: 800; }
.headline .key { margin-top: 4px; }
.headline .flow { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.factors { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
.factor { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12.5px; }
.factor .fb { height: 14px; position: relative; background: var(--panel3); border-radius: 4px; }
.factor .fb .mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.factor .fb i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.factor .v { text-align: right; font-variant-numeric: tabular-nums; }
.advcards { display: flex; flex-direction: column; gap: 10px; }
.adv { background: var(--panel2); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: var(--radius); padding: 10px 12px; }
.adv.good { border-left-color: var(--good); }
.adv .ah { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.adv .ah b { font-size: 14.5px; }
.adv .imp { margin-left: auto; font-size: 11.5px; color: #fbbf24; background: var(--warn-soft); padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.adv ul { margin: 6px 0 0; padding-left: 18px; }
.adv li { margin: 1px 0; }
.adv .why { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.adv .how { margin-top: 6px; font-size: 13px; }
.adv .drill { margin-top: 6px; font-size: 12.5px; color: #c4d2ea; }
.adv .ops { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.pcard { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; font-size: 12.5px; }
.pcard .ph { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
.pcard .ph b { font-size: 13.5px; }
.pcard .ph .st { margin-left: auto; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.pcard .g { color: #86efac; }
.pcard .i { color: #fcd34d; }
.pcard div + div { margin-top: 2px; }
.practice { counter-reset: p; display: flex; flex-direction: column; gap: 5px; }
.practice div { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; display: flex; gap: 10px; align-items: baseline; }
.practice div::before { counter-increment: p; content: counter(p); background: var(--accent); color: #fff; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
.practice .mins { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- モーダル・トースト ---------- */
.modal { position: fixed; inset: 0; background: rgba(4,7,12,0.66); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px; overflow-y: auto; }
.modal-card { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; width: min(640px, 100%); box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.modal-card.wide { width: min(980px, 100%); }
.modal-card header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.modal-card header b { font-size: 15px; flex: 1; }
.modal-card header button { background: none; border: 0; font-size: 20px; color: var(--muted); }
.modal-body { padding: 14px 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px 14px; }
.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; font-size: 12.5px; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--panel2); border: 1px solid var(--line2); border-radius: 7px; padding: 6px 8px; color: var(--text); font-size: 13.5px; }
.field textarea { min-height: 220px; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
/* お知らせは左下（映像の列の下）に出す。右のパネルのボタンや説明を隠さない・クリックのじゃまをしない */
.toasts { position: fixed; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 70; align-items: flex-start; pointer-events: none; max-width: min(62vw, 760px); }
.toast { background: #0b1220; border: 1px solid var(--line2); border-left: 4px solid var(--accent); padding: 8px 14px; border-radius: 8px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: flashIn 0.2s ease-out; pointer-events: none; display: flex; gap: 10px; align-items: center; }
.toast button { pointer-events: auto; }
.toast.ok { border-left-color: var(--good); }
.toast.err { border-left-color: var(--bad); }
.toast.warn { border-left-color: var(--warn); }

/* ---------- 自動デモ ---------- */
#demoLayer { position: fixed; inset: 0; pointer-events: none; z-index: 80; }
#demoCursor { position: fixed; left: 0; top: 0; width: 26px; height: 26px; transform: translate(-3px, -2px); transition: left 0.6s cubic-bezier(.4,.1,.2,1), top 0.6s cubic-bezier(.4,.1,.2,1); filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
#demoCursor.click::after { content: ''; position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fbbf24; animation: ripple 0.5s ease-out forwards; }
@keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
#demoCaption { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); width: min(620px, calc(100vw - 24px)); transition: top 0.25s, left 0.25s; background: rgba(12,17,28,0.96); border: 1px solid #f59e0b; border-radius: 14px; padding: 12px 16px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); pointer-events: auto; }
#demoCaption .st { color: #fbbf24; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; }
#demoCaption h4 { margin: 2px 0 4px; font-size: 16px; }
#demoCaption p { margin: 0; color: #cfd8e8; font-size: 13.5px; }
#demoCaption .foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
#demoCaption .bar { flex: 1; height: 4px; background: var(--panel3); border-radius: 99px; overflow: hidden; }
#demoCaption .bar i { display: block; height: 100%; background: #f59e0b; width: 0; transition: width 0.4s; }
#demoKeys { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 6px; }
#demoKeys .key { background: #f8fafc; color: #0f172a; border-radius: 8px; padding: 6px 12px; font-family: var(--mono); font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #94a3b8, 0 10px 20px rgba(0,0,0,0.4); animation: keyIn 0.15s ease-out; }
#demoKeys .key small { display: block; font-family: var(--font); font-size: 10px; font-weight: 600; color: #475569; text-align: center; }
@keyframes keyIn { from { transform: translateY(6px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
.demo-target { outline: 3px solid #f59e0b !important; outline-offset: 2px; border-radius: 8px; transition: outline 0.2s; }

/* ---------- 印刷（レポート） ---------- */
@media print {
  body { background: #fff; color: #000; }
  .topbar, .stage, .tabs, #demoLayer, .toasts, .adv .ops, .no-print { display: none !important; }
  .main { display: block; padding: 0; }
  .panel { border: 0; background: #fff; }
  .card, .adv, .pcard, .practice div, .headline, .kpi { background: #fff !important; color: #000 !important; border-color: #bbb !important; }
  .note, .adv .why { color: #333 !important; }
}

/* ---------- 画面幅 ---------- */
@media (max-width: 1180px) {
  .main, body.wide .main { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; }
}
@media (max-width: 640px) {
  .topbar { padding: 8px 10px; gap: 8px; position: static; }
  .stage { top: 0; }
  .brand small { display: none; }
  .actions .btn { padding: 5px 8px; font-size: 12px; }
  .main { padding: 8px; gap: 8px; }
  .rosters { grid-template-columns: 1fr 1fr; gap: 6px; }
  .roster { padding: 4px; }
  .roster-head .note { display: none; }
  .pl { grid-template-columns: 12px 26px minmax(0, 1fr); gap: 4px; padding: 3px 4px; font-size: 12px; }
  .pl .st { display: none; }
  .pl .oc { width: 10px; height: 10px; }
  .tagfoot { grid-template-columns: minmax(0, 1fr); }
  .court-mini { max-width: 260px; margin: 0 auto; }
  .pad { grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .act { font-size: 11.5px; padding: 8px 2px 6px; }
  .act .lbl-long { display: none; }
  .act .lbl-short { display: inline; }
  .tagfoot, .shotwrap, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .revloc { grid-template-columns: 150px minmax(0, 1fr); gap: 8px; }
  .ov-prompt { font-size: 11px; padding: 3px 7px; left: 6px; bottom: 6px; }
  .ov-prompt small { display: none; }
  .ov-flash { top: 34px; right: 6px; }
  .ov-flash div { font-size: 11px; padding: 3px 7px; }
  .log-row { grid-template-columns: 50px 26px 10px minmax(0, 1fr) 44px; }
  .log-row .sc { display: none; }
  .cmp { grid-template-columns: 1fr 96px 1fr; }
  .ppp-row { grid-template-columns: 92px minmax(0, 1fr) 90px; }
  .factor { grid-template-columns: 110px minmax(0, 1fr) 56px; }
}

/* --- 自動解析タブ：進み具合・指定のしかた --- */
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 2px 0 4px; }
.step { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px 3px 4px; }
.step b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--panel3); color: var(--text); font-size: 12px; }
.step.on { color: var(--text); border-color: var(--accent); }
.step.on b { background: var(--accent); color: #fff; }
.step.done b { background: var(--good); color: #06240f; }
.howto { margin: 0 0 10px; }
.howto summary, details.note summary { cursor: pointer; user-select: none; }
.howto summary { font-weight: 600; font-size: 13px; }
.howto ol { margin: 6px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.55; }
.howto li { margin: 2px 0; }
.howfig { margin: 8px 0 2px; max-width: 350px; }
.howfig svg { display: block; width: 100%; height: auto; }
.thumbrow { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
.hoopthumb { border-radius: 6px; border: 1px solid var(--line2); background: #000; flex: none; }
.help h4 { margin: 14px 0 6px; font-size: 14px; }
.help h4:first-child { margin-top: 0; }
.help ol, .help ul { margin: 4px 0; padding-left: 22px; font-size: 13.5px; line-height: 1.7; }
.help li { margin: 3px 0; }
.help .howfig { max-width: 460px; }
.setupfold { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.setupfold > summary { cursor: pointer; user-select: none; font-size: 13px; color: var(--muted); }
.setupfold[open] > summary { margin-bottom: 10px; }

</style>
</head>

<div id="app">
  <header class="topbar">

    <div class="proj">

  <main class="main">

<script>
/* js/core.js */
/* バスケ分析スタジオ — 共通処理（名前空間・乱数・書式・イベントバス）
   DOM に依存しないので node のテストからも読み込める。 */
(function (root) {
  'use strict';
  const BS = root.BS = root.BS || {};
  BS.VERSION = '1.0.0';

  /* ---------- 乱数（シード固定・mulberry32） ---------- */
  BS.rng = function (seed) {
    let a = (seed >>> 0) || 1;
    function next() {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return {
      next,
      range: (lo, hi) => lo + (hi - lo) * next(),
      int: (lo, hi) => Math.floor(lo + (hi - lo + 1) * next()),
      chance: (p) => next() < p,
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      /* items: [[value, weight], ...] */
      weighted(items) {
        let sum = 0;
        for (const it of items) sum += Math.max(0, it[1]);
        let r = next() * sum;
        for (const it of items) { r -= Math.max(0, it[1]); if (r <= 0) return it[0]; }
        return items[items.length - 1][0];
      },
      gauss(mu, sd) {
        const u = Math.max(1e-9, next()), v = next();
        return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
      }
    };
  };

  /* ---------- 数値・書式 ---------- */
  BS.clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
  BS.lerp = (a, b, k) => a + (b - a) * k;
  BS.smooth = (k) => k * k * (3 - 2 * k);
  BS.round = (v, d = 1) => { const m = Math.pow(10, d); return Math.round(v * m) / m; };

  BS.fmtTime = function (sec, withTenths) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    const pad = (n) => String(n).padStart(2, '0');
    let out = (h ? h + ':' + pad(m) : String(m)) + ':' + pad(s);
    if (withTenths) out += '.' + Math.floor((sec * 10) % 10);
    return out;
  };
  /* 割合（%）。分母0なら「—」 */
  BS.pct = function (num, den, digits = 1) {
    if (!den) return '—';
    return (100 * num / den).toFixed(digits);
  };
  BS.ratio = function (num, den, digits = 2) {
    if (!den) return '—';
    return (num / den).toFixed(digits);
  };
  BS.signed = (n) => (n > 0 ? '+' + n : String(n));

    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

  };

  BS.uid = function (prefix = 'e') {

  };

  BS.emitter = function () {
    const map = new Map();
    return {
      on(name, fn) { if (!map.has(name)) map.set(name, new Set()); map.get(name).add(fn); return () => map.get(name).delete(fn); },
      off(name, fn) { if (map.has(name)) map.get(name).delete(fn); },
      emit(name, payload) {
        if (!map.has(name)) return;
        for (const fn of Array.from(map.get(name))) {
          try { fn(payload); } catch (err) { if (typeof console !== 'undefined') console.error('[BS] handler error', name, err); }
        }
      }
    };
  };

  BS.shotZone = function (sx, sy) {
    const C = BS.COURT;
    const dx = sx - 7.5, dy = sy - C.rimFromBaseline;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const inCornerStrip = sy <= C.cornerDepth && (sx < C.cornerLine || sx > C.W - C.cornerLine);
    const three = inCornerStrip || (sy > C.cornerDepth && dist > C.three);

    else if (dist <= 2.0) zone = 'rim';
    else if (Math.abs(dx) <= C.keyW / 2 && sy <= C.keyL) zone = 'paint';
    else zone = 'mid';
    return { three, zone, dist };
  };
  BS.ZONES = [
    { id: 'rim', label: 'ゴール下', short: 'ゴール下' },
    { id: 'paint', label: 'ペイント', short: 'ペイント' },
    { id: 'mid', label: 'ミドル', short: 'ミドル' },
    { id: 'c3', label: 'コーナー3P', short: 'コーナー3' },
    { id: 'ab3', label: 'トップ/ウイング3P', short: 'トップ3' }
  ];

     シュート位置はいつも「ゴールを上にしたハーフコート」の座標（sx, sy）で持つ。画面に描くときだけ、図を回して見せる。
     確認モードでは、図を映像と同じ向きにそろえる（図の下＝手前＝カメラ側）と、見たままの場所を押せる。

     180＝ゴールが下（手前のゴールを、後ろ側から見ている）

  BS.COURT_ROTS = [0, 90, 180, 270];
  BS.courtXform = function (rot) {
    const W = 150, H = 142;
    rot = ((Math.round((rot || 0) / 90) * 90) % 360 + 360) % 360;
    if (rot === 90) return { rot, w: H, h: W, svg: `translate(${H},0) rotate(90)`, toView: (x, y) => [H - y, x], toCourt: (u, v) => [v, H - u] };
    if (rot === 180) return { rot, w: W, h: H, svg: `translate(${W},${H}) rotate(180)`, toView: (x, y) => [W - x, H - y], toCourt: (u, v) => [W - u, H - v] };
    if (rot === 270) return { rot, w: H, h: W, svg: `translate(0,${W}) rotate(-90)`, toView: (x, y) => [y, W - x], toCourt: (u, v) => [W - v, u] };
    return { rot: 0, w: W, h: H, svg: '', toView: (x, y) => [x, y], toCourt: (u, v) => [u, v] };
  };
  /* ゴールの指定（バックボードの枠とリング）から、図の向きの初期値を決める。
     横から見たゴールは、リングが板からコートの内側へ突き出して見える：リングが板の中心より右にあれば、コートは右へ広がる（＝ゴールは左）。
     板のほぼ正面にリングがあれば、コートの端から見ている（＝ゴールは上）。合わないときは、利用者が画面で回せる */
  BS.courtRotOfMark = function (mark) {
    if (!mark || !mark.box || !mark.rim || !(mark.box.w > 0)) return 0;

    return 0;
  };

    const G = {

    function attackDir(team) { return ((team === 0) === (G.period <= 2)) ? 1 : -1; }

    function ev(t, type, fields) {

    }

    /* ---- 守備位置（マークマンとゴールの間、ボール側に寄る） ---- */
    function defendMoves(O, offTargets, ballSlot, opts) {
      opts = opts || {};
      const D = 1 - O;
      const basket = A(O, C.rimFromBaseline, 0);
      const ballP = offTargets[ballSlot] || pos(ballSlot);
      const mv = {};
      for (let r = 0; r < 5; r++) {
        const os = slotOf(O, r), ds = slotOf(D, r);
        if (opts.skip && opts.skip.includes(ds)) continue;
        const op = offTargets[os] || pos(os);
        const onBall = os === ballSlot;
        const k = onBall ? 0.17 : 0.33;
        let p = mix(op, basket, k);
        if (!onBall) p = mix(p, ballP, 0.16 + (opts.sag || 0));
        mv[ds] = p;
      }
      return mv;
    }
    function withDef(O, offMoves, ballSlot, opts) {
      return Object.assign(defendMoves(O, offMoves, ballSlot, opts), offMoves);
    }

    /* ---- 位置取り（攻撃方向基準の u=ベースラインからの距離, v=左右） ---- */
    const SP = {
      top: [8.0, 0], lslot: [7.2, -3.2], rslot: [7.2, 3.2],
      lwing: [5.9, -5.6], rwing: [5.9, 5.6], lcorner: [0.7, -6.8], rcorner: [0.7, 6.8],
      lelbow: [5.6, -2.4], relbow: [5.6, 2.4], lblock: [1.9, -2.6], rblock: [1.9, 2.6],
      lshort: [1.6, -4.8], rshort: [1.6, 4.8]
    };
    function formation(O, m) {
      const S = (k) => A(O, SP[k][0], SP[k][1] * m);
      const f = R.chance(0.65)
        ? { 0: S('top'), 1: S('rwing'), 2: S('lwing'), 3: S('rcorner'), 4: S('lblock') }
        : { 0: S('top'), 1: S('rcorner'), 2: S('lcorner'), 3: S('relbow'), 4: S('lelbow') };
      const out = {};
      for (let r = 0; r < 5; r++) out[slotOf(O, r)] = jit(f[r], 0.35);
      return out;
    }

    /* ---- シュート位置（ゾーン別） ---- */
    function spotFor(zone) {
      for (let i = 0; i < 12; i++) {
        let u, v;
        if (zone === 'rim') { const r = R.range(0.35, 1.5), th = R.range(-1.2, 1.2); u = C.rimFromBaseline + r * Math.cos(th); v = r * Math.sin(th); }
        else if (zone === 'paint') { u = R.range(2.6, 5.3); v = R.range(-2.1, 2.1); }
        else if (zone === 'mid') { const r = R.range(3.9, 5.9), th = R.range(-1.35, 1.35); u = C.rimFromBaseline + r * Math.cos(th); v = r * Math.sin(th); }
        else if (zone === 'c3') { u = R.range(0.4, 2.2); v = (R.chance(0.5) ? 1 : -1) * R.range(6.85, 7.15); }
        else { const r = R.range(7.05, 7.7), th = R.range(-1.1, 1.1); u = C.rimFromBaseline + r * Math.cos(th); v = r * Math.sin(th); }
        const z = BS.shotZone(7.5 + v, u);
        if (z.zone === zone || (i > 9 && (z.three === (zone === 'c3' || zone === 'ab3')))) return { u, v };
      }
      return zone === 'ab3' ? { u: 8.5, v: 0 } : { u: 1.6, v: 0.3 };
    }

    /* ---- 交代（デッドボール時） ---- */
    function mustSit(pid) {
      const f = G.pf[pid] || 0;
      if (f >= 5) return true;
      if (G.period === 1 && f >= 2) return true;
      if (G.period === 2 && f >= 3) return true;
      if (G.period === 3 && f >= 4) return true;
      return false;
    }
    const ROT = { 1: [1, 3], 2: [0, 4], 3: [2, 3], 4: [1, 4] };
    function desired(team) {
      const frac = (G.T - G.periodStart) / PERIOD_LEN;
      const benchRoles = (frac >= 0.45 && frac < (G.period === 4 ? 0.72 : 0.9)) ? ROT[G.period] : [];
      const T = TEAMS[team];
      const used = new Set();
      const lineup = [];
      for (let r = 0; r < 5; r++) {
        const starter = T.players.find((p) => p.starter && p.role === r);
        const bench = T.players.find((p) => !p.starter && p.role === r);
        let pick = benchRoles.includes(r) ? bench : starter;
        if (mustSit(pick.id)) pick = pick === starter ? bench : starter;
        if (mustSit(pick.id) || used.has(pick.id)) {
          pick = T.players.find((p) => !used.has(p.id) && !mustSit(p.id) && !lineup.includes(p) && p !== starter && p !== bench && (G.pf[p.id] || 0) < 5) || pick;
        }
        used.add(pick.id);
        lineup.push(pick);
      }
      return lineup.map((p) => p.id);
    }
    function applySubs(keep) {
      let changed = false;
      for (let team = 0; team < 2; team++) {
        const want = desired(team);
        for (let r = 0; r < 5; r++) {
          const s = slotOf(team, r);
          if (keep && keep.includes(s)) continue;
          const now = G.slotMap[s];
          if (now !== want[r] && !G.slotMap.includes(want[r])) {
            G.slotMap[s] = want[r];
            ev(G.T, 'sub', { team, out: now, in: want[r] });
            changed = true;
          }
        }
      }
      if (changed) tr.slots.push({ t: r2(G.T), map: G.slotMap.slice() });
    }

    /* ---- タイムアウト ---- */
    function maybeTimeout(team) {
      const half = G.period <= 2 ? 0 : 1;
      if (G.run.team === 1 - team && G.run.pts >= 8 && G.toLeft[team][half] > 0) {
        G.toLeft[team][half]--;
        G.run = { team: -1, pts: 0 };
        ev(G.T, 'timeout', { team });
        const t0 = G.T;
        const benchX = [10.5, 17.5];
        const mv = {};
        for (let s = 0; s < 10; s++) {
          const tm = s < 5 ? 0 : 1;
          const bx = benchX[attackDir(tm) > 0 ? 0 : 1];
          mv[s] = { x: bx + ((s % 5) - 2) * 0.7, y: R.range(-0.9, -0.4) };
        }
        beat(2.4, mv, null);
        beat(4.6, null, null);
        overlay(t0, G.T + 0.8, 'timeout', 'タイムアウト ' + TEAMS[team].short);
        applySubs();
        return true;
      }
      return false;
    }

    /* =========================================================
       ポゼッション
       entry: { type: 'inbound'|'dreb'|'steal'|'sideline'|'front'|'jump'|'period'|'oreb', team, holder }
       ========================================================= */
    function bringUp(O, entry, m) {
      const D = 1 - O;
      const pg = slotOf(O, 0);
      const S = (u, v) => A(O, u, v * m);
      let holder = entry.holder;
      if (entry.type === 'inbound') {
        const inb = slotOf(O, R.chance(0.6) ? 4 : 3);
        const bp = ballPoint();
        const mv = {};
        mv[inb] = { x: bp[0], y: bp[1] - 0.15 };
        mv[pg] = S(23.2, 2.8);
        offSlots(O).forEach((s) => { if (s !== inb && s !== pg) mv[s] = jit(S(R.range(16, 20), R.range(-5, 5)), 0.5); });
        // 守備側（得点したチーム）は自陣へ戻る
        offSlots(D).forEach((s) => { mv[s] = mix(pos(s), A(O, R.range(4, 10), R.range(-5, 5)), 0.6); });
        beat(1.1, mv, { free: { a: bp, b: [mv[inb].x, mv[inb].y + 0.2, 1.0], n: 1, h: 0.6 } });
        const oob = S(28.7, R.range(-1.5, 1.5));
        beat(0.7, { [inb]: oob }, { hold: inb });
        beat(0.6, { [pg]: S(22.8, 3.2) }, { pass: [inb, pg] });
        holder = pg;
        // インバウンドした選手もコートへ
        beat(0.3, { [inb]: S(26, 1.5) }, { hold: pg, dr: true });
      } else if (entry.type === 'sideline' || entry.type === 'period' || entry.type === 'front') {
        const front = entry.type === 'front';
        const inb = slotOf(O, 2);
        const side = m;
        const mv = {};
        const u0 = front ? 6.5 : 14;
        mv[inb] = S(u0, 7.95 * side);
        mv[pg] = front ? S(7.8, 3.5 * side) : S(12.5, 3.8 * side);
        offSlots(O).forEach((s) => { if (s !== inb && s !== pg) mv[s] = jit(front ? S(R.range(1.5, 6), R.range(-5, 5)) : S(R.range(6, 12), R.range(-5, 5)), 0.5); });
        Object.assign(mv, defendMoves(O, mv, pg, { sag: 0.05 }));
        beat(entry.type === 'period' ? 2.2 : 1.8, mv, { free: { a: ballPoint(), b: [mv[inb].x, mv[inb].y + 0.2, 1.1], n: 2, h: 0.5 } });
        beat(0.55, null, { pass: [inb, pg] });
        holder = pg;
        beat(0.35, { [inb]: S(front ? 5.5 : 12, 5.5 * side) }, { hold: pg, dr: true });
        if (front) return pg;
      } else if (entry.type === 'dreb' || entry.type === 'steal') {
        if (holder !== pg) {
          const outlet = S(R.range(19, 22), R.range(4, 6) * (R.chance(0.5) ? 1 : -1));
          const mv = { [pg]: outlet };
          offSlots(O).forEach((s) => { if (s !== pg && s !== holder) mv[s] = jit(S(R.range(12, 18), R.range(-5, 5)), 0.5); });
          offSlots(D).forEach((s) => { mv[s] = mix(pos(s), A(O, R.range(3, 9), R.range(-5, 5)), 0.55); });
          beat(0.9, mv, { hold: holder });
          beat(0.6, null, { pass: [holder, pg] });
          holder = pg;
        }
      } else if (entry.type === 'jump') {
        holder = pg;
      }
      // ハーフコートへ運ぶ
      const f = formation(O, m);
      const start = pos(holder);
      const topP = A(O, 8.6, R.range(-1.5, 1.5));
      const d = dist(start, topP);
      const dur = BS.clamp(d / 4.4, 1.2, 4.2);
      const mid = mix(start, topP, 0.55);
      const half1 = {};
      const half2 = {};
      offSlots(O).forEach((s) => {
        if (s === holder) return;
        half1[s] = mix(pos(s), f[s], 0.6);
        half2[s] = f[s];
      });
      half1[holder] = mid; half2[holder] = topP;
      beat(dur * 0.5, withDef(O, half1, holder, { sag: 0.1 }), { hold: holder, dr: true });
      beat(dur * 0.5, withDef(O, half2, holder), { hold: holder, dr: true });
      return holder;
    }

    function pickShooter(O, roles, zone) {
      const items = roles.map((r) => {
        const s = slotOf(O, r);
        const p = plAt(s);
        let w = p.use;
        if ((zone === 'c3' || zone === 'ab3') && p.fg3 <= 0.05) w = 0;
        return [s, w];
      });
      if (!items.some((it) => it[1] > 0)) return slotOf(O, roles[0]);
      return R.weighted(items);
    }
    function makeProb(O, s, zone, play) {
      const p = plAt(s);
      let base = ZONE_BASE[zone];
      const three = zone === 'c3' || zone === 'ab3';
      base *= three ? p.fg3 / 0.33 : p.fg2 / 0.47;
      base *= (TEAMS[O].quality[play] || 1);
      if (play === 'transition' && zone === 'rim') base *= 1.12;
      if (play === 'putback') base *= 0.95;
      return BS.clamp(base, 0.05, 0.86);
    }

    /* 攻撃側の終わり方を決める（TO / ファウル / シュート） */
    function decideOutcome(O, handlerSlot, play) {
      const T = TEAMS[O], D = 1 - O;
      const h = plAt(handlerSlot);
      const pTO = 0.15 * T.toRate * (0.65 + 0.35 * h.to);
      const pFoul = 0.095 * TEAMS[D].foulRate;
      const r = R.next();
      if (r < pTO) return 'to';
      if (r < pTO + pFoul) return 'foul';
      return 'shot';
    }

    /* シュートを打って結果まで（成功/失敗/ブロック/シューティングファウル） */
    function shoot(O, s, zone, play, passer, opts) {
      opts = opts || {};
      const D = 1 - O;
      const tRel = G.T;
      const p = pos(s);
      const half = toHalf(O, p.x, p.y);
      const three = BS.shotZone(half.sx, half.sy).three;
      const pts = three ? 3 : 2;
      let pMake = makeProb(O, s, zone, play);
      const foulP = zone === 'rim' ? 0.14 : zone === 'paint' ? 0.11 : zone === 'mid' ? 0.045 : 0.018;
      const fouled = R.chance(foulP * TEAMS[D].foulRate);
      if (fouled) pMake *= 0.55;
      let made = R.chance(pMake);
      // ブロック（ゴール下・ペイントの失敗の一部）
      let blocker = null;
      if (!made && !fouled && (zone === 'rim' || zone === 'paint')) {
        const cand = [slotOf(D, 4), slotOf(D, 3), slotOf(D, s % 5)];
        const bs = R.weighted(cand.map((c) => [c, plAt(c).blk]));
        if (R.chance(0.1 * plAt(bs).blk + 0.02)) blocker = bs;
      }
      const assisted = passer != null && made && R.chance(opts.astP != null ? opts.astP : 0.9);
      const shooterPid = pidAt(s);
      pose(s, tRel - 0.25, 0.75, 'shoot');
      jump(s, tRel - 0.2, 0.55, zone === 'rim' ? 0.45 : 0.3);

      let shotEv = null;
      if (!fouled || made) {
        shotEv = ev(tRel, 'shot', {
          team: O, pid: shooterPid, made, pts, sx: half.sx, sy: half.sy,
          ast: assisted ? pidAt(passer) : null, blk: blocker != null ? pidAt(blocker) : null, play
        });
      }
      const rim = rim3(O);
      const rel = hand(cur, s, 2.45);
      const d = dist({ x: rel[0], y: rel[1] }, { x: rim[0], y: rim[1] });

      if (blocker != null) {
        // ブロック：守備者が跳んで叩く
        const bp = pos(blocker);
        const near = toward(p, bp, 0.7);
        beat(0.05, { [blocker]: toward(bp, p, Math.max(0, dist(bp, p) - 0.75)) }, null);
        jump(blocker, G.T - 0.1, 0.6, 0.55);
        pose(blocker, G.T - 0.1, 0.6, 'block');
        beat(0.2, null, { air: { a: rel, b: [near.x, near.y + 0.2, 2.95], h: 3.05 } });
        const loose = toward(near, A(O, R.range(4, 8), R.range(-5, 5)), R.range(2.5, 4.2));
        return reboundPhase(O, s, { x: loose.x, y: loose.y }, { from: [near.x, near.y + 0.2, 2.95], blocked: true, shotEv });
      }

      const flight = 0.72 + d * 0.052;
      const apex = C.rimH + 0.8 + d * 0.13;
      const crash = crashMoves(O, s, null, 0.25);
      beat(flight, crash, { air: { a: rel, b: rim, h: apex } });

      if (made) {
        const tIn = G.T;
        addScore(O, pts, tIn);
        const drop = [rim[0], rim[1], 1.55];
        beat(0.3, null, { air: { a: rim, b: drop, h: rim[2] } });
        const land = A(O, R.range(0.6, 2.2), R.range(-1.2, 1.2));
        beat(0.8, null, { free: { a: drop, b: [land.x, land.y, 0.12], n: 2, h: 0.7 } });
        if (fouled) {
          const fouler = pickFouler(D, s, true);
          foul(fouler, 'S', shooterPid, tRel + 0.05);
          const r = freeThrows(O, s, 1);
          return r;
        }
        return { end: 'made', next: { type: 'inbound', team: D } };
      }
      if (fouled) {
        const fouler = pickFouler(D, s, true);
        foul(fouler, 'S', shooterPid, tRel + 0.05);
        // ボールはリングに当たって落ちる
        const land = A(O, R.range(1.2, 2.6), R.range(-1.5, 1.5));
        beat(0.8, null, { free: { a: rim, b: [land.x, land.y, 0.12], n: 2, h: 1.2 } });
        return freeThrows(O, s, pts === 3 ? 3 : 2);
      }
      // 外れ → リバウンド
      const long = pts === 3 ? R.range(2.8, 4.8) : R.range(1.2, 3.2);
      const ang = R.range(-1.4, 1.4);
      const rimP = A(O, C.rimFromBaseline, 0);
      const outP = A(O, C.rimFromBaseline + long * Math.cos(ang), long * Math.sin(ang));
      void rimP;
      return reboundPhase(O, s, outP, { from: [rim[0] + R.range(-0.15, 0.15), rim[1], rim[2] + 0.05], shotEv });
    }

    /* シュート中のリバウンド争い（ビッグはゴールへ、ガードは戻る） */
    function crashMoves(O, shooter, target, k) {
      const D = 1 - O;
      const mv = {};
      const basket = A(O, C.rimFromBaseline + 1.2, 0);
      [3, 4].forEach((r) => {
        const so = slotOf(O, r), sd = slotOf(D, r);
        if (so !== shooter) mv[so] = mix(pos(so), jit(basket, 1.4), k);
        mv[sd] = mix(pos(sd), jit(basket, 1.0), k + 0.1);
      });
      [0, 1].forEach((r) => {
        const so = slotOf(O, r);
        if (so !== shooter) mv[so] = mix(pos(so), A(O, 10, (r ? 3 : -3)), k * 0.8);
      });
      void target;
      return mv;
    }

    function reboundPhase(O, shooter, spot, info) {
      const D = 1 - O;
      const pOR = BS.clamp(0.265 * TEAMS[O].orb / TEAMS[D].drb, 0.1, 0.5) * (info.ft ? 0.4 : 1) * (info.blocked ? 0.7 : 1);
      const off = R.chance(pOR);
      const team = off ? O : D;
      const roleW = [0.4, 0.55, 0.9, 1.3, 1.65];
      const items = [0, 1, 2, 3, 4].map((r) => {
        const s = slotOf(team, r);
        return [s, plAt(s).reb * roleW[r] * (s === shooter ? 0.5 : 1)];
      });
      const rs = R.weighted(items);
      const mv = crashMoves(O, shooter, spot, 0.55);
      mv[rs] = { x: spot.x, y: spot.y - 0.15 };
      const carom = info.blocked ? 0.75 : R.range(0.6, 0.85);
      // リングに当たって弾むボール：頂点の高さは、落ち方が本物の重力（9.8 m/s²）と同じになるように決める（映像の見た目だけに効く）
      beat(carom, mv, { air: { a: info.from, b: [spot.x, spot.y + 0.05, 2.1], h: info.blocked ? 3.2 : Math.max(info.from[2], 2.1) + 9.8 * carom * carom / 8 } });
      jump(rs, G.T - 0.3, 0.55, 0.45);
      pose(rs, G.T - 0.3, 0.6, 'reb');
      ev(G.T, 'reb', { team, pid: pidAt(rs), off });
      beat(0.45, null, { hold: rs });
      if (off) return { cont: true, entry: { type: 'oreb', team: O, holder: rs } };
      return { end: 'dreb', next: { type: 'dreb', team: D, holder: rs } };
    }

    /* ファウル */
    function pickFouler(D, againstSlot, shooting) {
      const r = againstSlot % 5;
      const cand = [[slotOf(D, r), 0.6]];
      if (shooting) { cand.push([slotOf(D, 4), 0.25], [slotOf(D, 3), 0.15]); }
      else { cand.push([slotOf(D, (r + 1) % 5), 0.2], [slotOf(D, (r + 4) % 5), 0.2]); }
      return R.weighted(cand.map(([s, w]) => [s, w * plAt(s).foul]));
    }
    function foul(foulerSlot, kind, drawnPid, t) {
      const pid = pidAt(foulerSlot);
      const team = P[pid].team;
      G.pf[pid] = (G.pf[pid] || 0) + 1;
      G.tf[team][Math.min(G.period, 5)]++;
      ev(t, 'foul', { team, pid, kind, drawn: drawnPid || null });
    }

    /* フリースロー */
    function freeThrows(O, shooterSlot, n) {
      const D = 1 - O;
      applySubs([shooterSlot]);
      const shooterPid = pidAt(shooterSlot);
      const mv = {};
      mv[shooterSlot] = A(O, 6.0, 0);
      const lane = [[2.7, 2.95], [2.7, -2.95], [3.6, 2.95], [3.6, -2.95], [4.5, 2.95], [4.5, -2.95]];
      const dSl = [slotOf(D, 4), slotOf(D, 3), slotOf(D, 2)];
      const oSl = [slotOf(O, 4), slotOf(O, 3)].filter((s) => s !== shooterSlot);
      mv[dSl[0]] = A(O, lane[0][0], lane[0][1]);
      mv[dSl[1]] = A(O, lane[1][0], lane[1][1]);
      if (oSl[0] != null) mv[oSl[0]] = A(O, lane[2][0], lane[2][1]);
      if (oSl[1] != null) mv[oSl[1]] = A(O, lane[3][0], lane[3][1]);
      mv[dSl[2]] = A(O, lane[4][0], lane[4][1]);
      const rest = [0, 1, 2, 3, 4].map((r) => slotOf(O, r)).concat([slotOf(D, 0), slotOf(D, 1)]).filter((s) => mv[s] === undefined);
      rest.forEach((s, i) => { mv[s] = A(O, R.range(7.5, 9.5), (i - rest.length / 2) * 2.2); });
      const land = ballPoint();
      beat(2.0, mv, { free: { a: land, b: [mv[shooterSlot].x, mv[shooterSlot].y + 0.2, 1.1], n: 3, h: 0.5 } });
      const p = plAt(shooterSlot);
      let last = null;
      for (let i = 1; i <= n; i++) {
        beat(1.1, null, { hold: shooterSlot, dr: true });
        beat(0.35, null, { hold: shooterSlot });
        const tRel = G.T;
        const made = R.chance(p.ft);
        pose(shooterSlot, tRel - 0.2, 0.6, 'shoot');
        ev(tRel, 'ft', { team: O, pid: shooterPid, made, n: i, of: n });
        const rim = rim3(O);
        const rel = hand(cur, shooterSlot, 2.35);
        beat(0.95, null, { air: { a: rel, b: rim, h: 4.35 } });
        if (made) {
          addScore(O, 1, G.T);
          const drop = [rim[0], rim[1], 1.55];
          beat(0.3, null, { air: { a: rim, b: drop, h: rim[2] } });
          const ld = A(O, R.range(0.8, 1.8), R.range(-0.8, 0.8));
          beat(0.7, null, { free: { a: drop, b: [ld.x, ld.y, 0.12], n: 2, h: 0.6 } });
          if (i < n) beat(0.9, null, { air: { a: [ld.x, ld.y, 0.3], b: hand(cur, shooterSlot, 1.1), h: 1.6 } });
          last = true;
        } else {
          last = false;
          if (i < n) {
            const ld = A(O, R.range(0.8, 2.2), R.range(-1.2, 1.2));
            beat(0.7, null, { free: { a: rim, b: [ld.x, ld.y, 0.12], n: 2, h: 1.0 } });
            beat(0.9, null, { air: { a: [ld.x, ld.y, 0.3], b: hand(cur, shooterSlot, 1.1), h: 1.6 } });
          }
        }
      }
      if (last) return { end: 'made', next: { type: 'inbound', team: D } };
      const long = R.range(1.2, 2.8), ang = R.range(-1.3, 1.3);
      const spot = A(O, C.rimFromBaseline + long * Math.cos(ang), long * Math.sin(ang));
      const rim = rim3(O);
      return reboundPhase(O, shooterSlot, spot, { from: [rim[0], rim[1], rim[2] + 0.05], ft: true });
    }

    /* ターンオーバー */
    function turnover(O, handlerSlot, play, m) {
      const D = 1 - O;
      const T = TEAMS[O];
      const S = (u, v) => A(O, u, v * m);
      const kind = R.weighted([['pass', T.passTO], ['lost', 0.26], ['travel', 0.09], ['offfoul', 0.1], ['oob', 0.05], ['viol', 0.05]]);
      const hp = pidAt(handlerSlot);
      if (kind === 'pass') {
        const targets = offSlots(O).filter((s) => s !== handlerSlot);
        const tgt = R.pick(targets);
        const thief = slotOf(D, tgt % 5);
        const a = pos(handlerSlot), b = pos(tgt);
        const cut = mix(a, b, R.range(0.45, 0.7));
        const steal = R.chance(0.82);
        if (steal) {
          beat(0.45, { [thief]: cut }, { passTo: [handlerSlot, [cut.x, cut.y + 0.2, 1.3]] });
          ev(G.T, 'to', { team: O, pid: hp, kind, stl: pidAt(thief), play });
          beat(0.25, null, { hold: thief, dr: true });
          return { end: 'to', next: { type: 'steal', team: D, holder: thief } };
        }
        const outP = { x: b.x + (b.x - a.x) * 0.6, y: m > 0 ? C.W + 1.2 : -1.2 };
        beat(0.6, null, { passTo: [handlerSlot, [outP.x, BS.clamp(outP.y, -1.2, C.W + 1.2), 0.5]] });
        ev(G.T - 0.3, 'to', { team: O, pid: hp, kind, stl: null, play });
        beat(1.2, null, null);
        return { end: 'to', next: { type: 'sideline', team: D } };
      }
      if (kind === 'lost') {
        const thief = R.chance(0.75) ? slotOf(D, handlerSlot % 5) : slotOf(D, R.int(0, 4));
        const hpnt = pos(handlerSlot);
        const loose = toward(hpnt, A(O, R.range(8, 14), R.range(-4, 4)), R.range(1.5, 2.6));
        const tPoke = G.T;
        beat(0.55, { [thief]: loose }, { free: { a: hand(cur, handlerSlot, 0.9), b: [loose.x, loose.y + 0.2, 0.12], n: 2, h: 0.5 } });
        const steal = R.chance(0.85);
        ev(tPoke + 0.1, 'to', { team: O, pid: hp, kind, stl: steal ? pidAt(thief) : null, play });
        if (steal) {
          beat(0.25, null, { hold: thief, dr: true });
          return { end: 'to', next: { type: 'steal', team: D, holder: thief } };
        }
        beat(1.0, null, null);
        return { end: 'to', next: { type: 'sideline', team: D } };
      }
      if (kind === 'offfoul') {
        const def = slotOf(D, R.chance(0.5) ? 4 : handlerSlot % 5);
        const hpnt = pos(handlerSlot);
        const drive = toward(hpnt, A(O, 2.5, 0), 2.6);
        const meet = toward(drive, hpnt, -0.1);
        beat(0.9, { [handlerSlot]: drive, [def]: toward(meet, A(O, 1.2, 0), -0.55) }, { hold: handlerSlot, dr: true });
        pose(def, G.T, 1.0, 'fall');
        foul(handlerSlot, 'O', pidAt(def), G.T);
        beat(1.4, null, { hold: handlerSlot });
        return { end: 'to', next: { type: 'sideline', team: D } };
      }
      // トラベリング / アウトオブバウンズ / その他の違反
      const hpnt = pos(handlerSlot);
      const move = toward(hpnt, A(O, 3, 0), 1.6);
      beat(0.8, { [handlerSlot]: move }, { hold: handlerSlot, dr: kind !== 'travel' });
      if (kind === 'oob') {
        const outP = { x: move.x + R.range(-1, 1), y: m > 0 ? C.W + 0.8 : -0.8 };
        beat(0.5, null, { passTo: [handlerSlot, [outP.x, outP.y, 0.3]] });
      }
      ev(G.T - 0.2, 'to', { team: O, pid: hp, kind, stl: null, play });
      beat(1.3, null, null);
      void S;
      return { end: 'to', next: { type: 'sideline', team: D } };
    }

    /* 守備のファウル（シュート以外）→ ボーナスならFT、でなければサイドから再開 */
    function defensiveFoul(O, handlerSlot) {
      const D = 1 - O;
      const fouler = pickFouler(D, handlerSlot, false);
      const hpnt = pos(handlerSlot);
      beat(0.7, { [handlerSlot]: toward(hpnt, A(O, 3, 0), 1.3), [fouler]: toward(pos(fouler), hpnt, dist(pos(fouler), hpnt) - 0.5) }, { hold: handlerSlot, dr: true });
      foul(fouler, 'P', pidAt(handlerSlot), G.T);
      beat(1.2, null, { hold: handlerSlot });
      if (G.tf[D][Math.min(G.period, 5)] >= 5) return freeThrows(O, handlerSlot, 2);
      applySubs();
      return { cont: true, entry: { type: 'front', team: O } };
    }

    /* ---------- プレータイプ別の動き ---------- */
    function halfCourt(O, holder, m, opts) {
      opts = opts || {};
      const D = 1 - O;
      const T = TEAMS[O];
      const S = (u, v) => A(O, u, v * m);
      const pg = holder;
      // ボール回し（0〜2回）
      const nRev = opts.quick ? 0 : R.weighted([[0, 0.3], [1, 0.45], [2, 0.25]]);
      let ball = pg;
      for (let i = 0; i < nRev; i++) {
        const recv = R.pick(offSlots(O).filter((s) => s !== ball && s % 5 !== 4));
        const mv = {};
        offSlots(O).forEach((s) => { if (s !== ball && s !== recv) mv[s] = jit(pos(s), 0.6); });
        beat(R.range(0.8, 1.3), withDef(O, mv, ball), { hold: ball, dr: true });
        beat(0.5, withDef(O, {}, recv), { pass: [ball, recv] });
        ball = recv;
      }
      // ボールを持った選手からPGに戻してプレー開始（PnR等はPGがハンドラー）
      const play = R.weighted(Object.keys(T.style).map((k) => [k, T.style[k]]));
      const outcome = decideOutcome(O, ball, play);
      const beatHold = (dt, mv, s) => beat(dt, withDef(O, mv || {}, s), { hold: s, dr: true });

      if (outcome === 'to') {
        beatHold(R.range(0.6, 1.2), {}, ball);
        return turnover(O, ball, play, m);
      }
      if (outcome === 'foul') {
        beatHold(R.range(0.6, 1.0), {}, ball);
        return defensiveFoul(O, ball);
      }

      if (play === 'pnr') {
        let h = ball;
        if (h % 5 !== 0) { beat(0.5, withDef(O, { [slotOf(O, 0)]: S(8.2, 1) }, slotOf(O, 0)), { pass: [h, slotOf(O, 0)] }); h = slotOf(O, 0); }
        const scr = slotOf(O, R.chance(0.6) ? 4 : 3);
        const side = R.chance(0.5) ? 1 : -1;
        const hp = pos(h);
        beatHold(1.0, { [scr]: { x: hp.x + (A(O, 9, 0).x - A(O, 8, 0).x) * 0.1, y: hp.y + side * 0.9 } }, h);
        const drive = S(4.4, -1.8 * side);
        const roll = S(2.1, 0.9 * side);
        const mv = { [h]: drive, [scr]: roll };
        const def = defendMoves(O, mv, h, { sag: 0.12 });
        def[slotOf(D, h % 5)] = toward(drive, pos(h), 1.1);
        beat(1.2, Object.assign(def, mv), { hold: h, dr: true });
        const branch = R.weighted([['handler', 0.44], ['roll', 0.3], ['kick', 0.26]]);
        if (branch === 'handler') {
          const zone = R.weighted([['rim', 0.34], ['paint', 0.26], ['mid', 0.4]]);
          const sp = spotFor(zone);
          beatHold(0.5, { [h]: S(sp.u, sp.v) }, h);
          return shoot(O, h, zone, play, null);
        }
        if (branch === 'roll') {
          const zone = R.weighted([['rim', 0.78], ['paint', 0.22]]);
          const sp = spotFor(zone);
          beat(0.45, withDef(O, { [scr]: S(sp.u, sp.v) }, scr, { sag: 0.1 }), { pass: [h, scr] });
          beat(0.2, null, { hold: scr });
          return shoot(O, scr, zone, play, h);
        }
        const zone = R.weighted([['c3', 0.38], ['ab3', 0.44], ['mid', 0.18]]);
        const sh = pickShooter(O, [1, 2, 3].filter((r) => slotOf(O, r) !== scr), zone);
        const sp = spotFor(zone);
        const spot = S(sp.u, sp.v);
        beat(0.55, withDef(O, { [sh]: spot }, sh, { sag: 0.25 }), { pass: [h, sh] });
        beat(0.3, { [slotOf(D, sh % 5)]: toward(pos(slotOf(D, sh % 5)), spot, dist(pos(slotOf(D, sh % 5)), spot) - 1.4) }, { hold: sh });
        return shoot(O, sh, zone, play, h);
      }
      if (play === 'iso') {
        const iso = pickShooter(O, [0, 1, 2], 'mid');
        const side = R.chance(0.5) ? 1 : -1;
        const isoP = S(6.2, 4.6 * side);
        const mv = { [iso]: isoP };
        offSlots(O).forEach((s) => { if (s !== iso && s !== ball) mv[s] = jit(S(R.chance(0.5) ? 0.8 : 6.5, -6 * side + R.range(-1, 1)), 0.4); });
        if (ball !== iso) { beat(0.9, withDef(O, mv, ball), { hold: ball, dr: true }); beat(0.5, null, { pass: [ball, iso] }); }
        else beatHold(0.9, mv, iso);
        beatHold(0.9, {}, iso);
        const zone = R.weighted([['rim', 0.34], ['paint', 0.14], ['mid', 0.37], ['ab3', 0.15]]);
        const sp = spotFor(zone);
        beatHold(0.9, { [iso]: S(sp.u, sp.v) }, iso);
        return shoot(O, iso, zone, play, null);
      }
      if (play === 'post') {
        const big = slotOf(O, R.chance(0.65) ? 4 : 3);
        const side = R.chance(0.5) ? 1 : -1;
        const wing = slotOf(O, R.chance(0.5) ? 1 : 2);
        const mv = { [big]: S(2.1, 2.5 * side), [wing]: S(5.9, 5.3 * side) };
        const def = defendMoves(O, mv, ball);
        def[slotOf(D, big % 5)] = S(1.4, 2.2 * side);
        if (ball !== wing) {
          beat(1.0, Object.assign(def, mv), { hold: ball, dr: true });
          beat(0.5, null, { pass: [ball, wing] });
        } else beat(1.0, Object.assign(def, mv), { hold: wing, dr: true });
        beat(0.5, null, { pass: [wing, big] });
        const kick = R.chance(0.18);
        if (kick) {
          beatHold(1.0, { [big]: S(1.8, 1.8 * side) }, big);
          const zone = R.chance(0.6) ? 'ab3' : 'c3';
          const sh = pickShooter(O, [0, 1, 2].filter((r) => slotOf(O, r) !== big), zone);
          const sp = spotFor(zone);
          beat(0.55, withDef(O, { [sh]: S(sp.u, sp.v) }, sh, { sag: 0.25 }), { pass: [big, sh] });
          beat(0.25, null, { hold: sh });
          return shoot(O, sh, zone, play, big);
        }
        const zone = R.weighted([['paint', 0.56], ['rim', 0.34], ['mid', 0.1]]);
        const sp = spotFor(zone);
        beatHold(1.3, { [big]: S(sp.u, sp.v * (sp.v * side > 0 ? 1 : 1)) }, big);
        return shoot(O, big, zone, play, wing, { astP: 0.25 });
      }
      if (play === 'spot') {
        const h = ball;
        const drive = S(3.4, R.range(-1, 1));
        const mv = { [h]: drive };
        const def = defendMoves(O, mv, h, { sag: 0.3 });
        beat(1.1, Object.assign(def, mv), { hold: h, dr: true });
        const zone = R.weighted([['c3', 0.36], ['ab3', 0.44], ['mid', 0.2]]);
        const sh = pickShooter(O, [0, 1, 2, 3].filter((r) => slotOf(O, r) !== h), zone);
        const sp = spotFor(zone);
        const spot = S(sp.u, sp.v);
        beat(0.55, { [sh]: spot }, { pass: [h, sh] });
        beat(0.3, { [slotOf(D, sh % 5)]: toward(pos(slotOf(D, sh % 5)), spot, dist(pos(slotOf(D, sh % 5)), spot) - 1.3) }, { hold: sh });
        return shoot(O, sh, zone, play, h);
      }
      if (play === 'cut') {
        const cutter = R.pick(offSlots(O).filter((s) => s !== ball));
        beatHold(0.8, {}, ball);
        const zone = R.chance(0.85) ? 'rim' : 'paint';
        const sp = spotFor(zone);
        const tgt = S(sp.u, sp.v);
        beat(0.9, withDef(O, { [cutter]: mix(pos(cutter), tgt, 0.7) }, ball), { hold: ball, dr: true });
        beat(0.45, { [cutter]: tgt, [slotOf(D, cutter % 5)]: toward(pos(slotOf(D, cutter % 5)), tgt, dist(pos(slotOf(D, cutter % 5)), tgt) - 1.0) }, { pass: [ball, cutter] });
        beat(0.2, null, { hold: cutter });
        return shoot(O, cutter, zone, play, ball);
      }
      // offscreen
      const shooterR = R.chance(0.6) ? 1 : 2;
      const sh = slotOf(O, shooterR) === ball ? slotOf(O, shooterR === 1 ? 2 : 1) : slotOf(O, shooterR);
      const side = R.chance(0.5) ? 1 : -1;
      const screener = slotOf(O, 3) === ball ? slotOf(O, 4) : slotOf(O, 3);
      beat(1.0, withDef(O, { [sh]: S(1.8, 3.1 * side), [screener]: S(2.8, 4.1 * side) }, ball), { hold: ball, dr: true });
      const zone = R.weighted([['ab3', 0.5], ['mid', 0.4], ['c3', 0.1]]);
      const sp = spotFor(zone);
      const spot = S(sp.u, sp.v);
      const dsh = slotOf(D, sh % 5);
      beat(1.1, { [sh]: spot, [dsh]: toward(spot, pos(sh), 1.3) }, { hold: ball, dr: true });
      beat(0.5, null, { pass: [ball, sh] });
      beat(0.25, null, { hold: sh });
      return shoot(O, sh, zone, 'offscreen', ball);
    }

    function transitionPlay(O, entry, m) {
      const D = 1 - O;
      const S = (u, v) => A(O, u, v * m);
      let h = entry.holder;
      const lanes = offSlots(O).filter((s) => s !== h);
      const runners = lanes.slice(0, 2);
      const mv = {};
      const dash = S(4.2, R.range(-1, 1));
      mv[h] = mix(pos(h), dash, 0.5);
      runners.forEach((s, i) => { mv[s] = mix(pos(s), S(5.5, i ? 5.5 : -5.5), 0.5); });
      lanes.slice(2).forEach((s) => { mv[s] = mix(pos(s), S(12, R.range(-3, 3)), 0.5); });
      offSlots(D).forEach((s) => { mv[s] = mix(pos(s), A(O, R.range(2, 7), R.range(-3, 3)), 0.4); });
      const d = dist(pos(h), dash);
      const dur = BS.clamp(d / 6.0, 0.8, 3.2);
      beat(dur / 2, mv, { hold: h, dr: true });
      const mv2 = {};
      mv2[h] = dash;
      runners.forEach((s, i) => { mv2[s] = S(3.0, i ? 4.8 : -4.8); });
      lanes.slice(2).forEach((s) => { mv2[s] = S(8.5, R.range(-3, 3)); });
      offSlots(D).forEach((s) => { mv2[s] = mix(pos(s), A(O, R.range(1.5, 5), R.range(-2.5, 2.5)), 0.6); });
      beat(dur / 2, mv2, { hold: h, dr: true });
      if (R.chance(0.08 * TEAMS[O].toRate)) return turnover(O, h, 'transition', m);
      const branch = R.weighted([['self', 0.58], ['lane', 0.27], ['trail', 0.15]]);
      if (branch === 'self') {
        const zone = R.chance(0.85) ? 'rim' : 'paint';
        const sp = spotFor(zone);
        beat(0.5, { [h]: S(sp.u, sp.v) }, { hold: h, dr: true });
        return shoot(O, h, zone, 'transition', null);
      }
      if (branch === 'lane') {
        const r = runners[R.int(0, 1)];
        const sp = spotFor('rim');
        beat(0.45, { [r]: S(sp.u, sp.v) }, { pass: [h, r] });
        beat(0.15, null, { hold: r });
        return shoot(O, r, 'rim', 'transition', h);
      }
      const tr3 = pickShooter(O, [0, 1, 2, 3].filter((r) => slotOf(O, r) !== h), 'ab3');
      const sp = spotFor('ab3');
      beat(0.6, { [tr3]: S(sp.u, sp.v) }, { pass: [h, tr3] });
      beat(0.25, null, { hold: tr3 });
      return shoot(O, tr3, 'ab3', 'transition', h);
    }

    function putback(O, entry) {
      const s = entry.holder;
      const basketSide = A(O, C.rimFromBaseline + 0.9, R.range(-0.8, 0.8));
      beat(0.45, { [s]: toward(pos(s), basketSide, 1.2) }, { hold: s });
      const p = pos(s);
      const half = toHalf(O, p.x, p.y);
      const zone = BS.shotZone(half.sx, half.sy).zone;
      return shoot(O, s, zone === 'rim' ? 'rim' : 'paint', 'putback', null);
    }

    function possession(O, entry) {
      const T = TEAMS[O];
      let m = R.chance(0.5) ? 1 : -1;
      let trans = false;
      if (entry.type === 'steal') trans = R.chance(0.52 * T.transition);
      else if (entry.type === 'dreb') trans = R.chance(0.19 * T.transition);
      for (let guard = 0; guard < 8; guard++) {
        let res;
        if (entry.type === 'oreb') {
          const pl = plAt(entry.holder);
          const pPut = pl.role >= 3 ? 0.55 : 0.25;
          if (R.chance(pPut)) res = putback(O, entry);
          else {
            const pg = slotOf(O, 0);
            if (entry.holder !== pg) {
              beat(0.7, withDef(O, { [pg]: A(O, 7.5, 1.5 * m) }, entry.holder), { hold: entry.holder, dr: true });
              beat(0.5, null, { pass: [entry.holder, pg] });
            }
            const f = formation(O, m);
            beat(1.4, withDef(O, f, pg), { hold: pg, dr: true });
            res = halfCourt(O, pg, m, { quick: true });
          }
        } else if (trans) {
          res = transitionPlay(O, entry, m);
        } else {
          const h = bringUp(O, entry, m);
          res = halfCourt(O, h, m);
        }
        trans = false;
        if (res.cont) { entry = res.entry; m = R.chance(0.5) ? 1 : -1; continue; }
        return res.next;
      }
      return { type: 'inbound', team: 1 - O };
    }

    /* ---------- ピリオド ---------- */
    function startPeriod(n, arrowTeam) {
      G.period = n;
      G.periodStart = G.T;
      tr.periods.push({ n, t0: r2(G.T), t1: null, dir0: attackDir(0) });
      ev(G.T, 'period', { n });
      applySubs();
      if (n === 1) {
        // ジャンプボール
        const mv = {};
        const c0 = slotOf(0, 4), c1 = slotOf(1, 4);
        mv[c0] = { x: 14 - 0.45 * attackDir(0), y: 7.5 };
        mv[c1] = { x: 14 - 0.45 * attackDir(1), y: 7.5 };
        [0, 1].forEach((tm) => {
          [0, 1, 2, 3].forEach((r, i) => {
            const ang = (i / 4) * Math.PI * 2 + (tm ? Math.PI / 4 : 0);
            mv[slotOf(tm, r)] = { x: 14 + Math.cos(ang) * 2.6 - 0.9 * attackDir(tm), y: 7.5 + Math.sin(ang) * 2.4 };
          });
        });
        for (const k in mv) { cur[2 * k] = mv[k].x; cur[2 * k + 1] = mv[k].y; }
        pushFrame();
        tr.slots.push({ t: 0, map: G.slotMap.slice() });
        beat(1.3, null, { rest: [14, 7.5, 1.3] });
        const winner = R.chance(0.5) ? 0 : 1;
        const toss = [14, 7.6, 1.3];
        beat(0.8, null, { air: { a: toss, b: [14, 7.6, 3.0], h: 3.8 } });
        jump(c0, G.T - 0.45, 0.6, 0.55); jump(c1, G.T - 0.45, 0.6, 0.5);
        const pg = slotOf(winner, 0);
        beat(0.6, null, { air: { a: [14, 7.6, 3.0], b: hand(cur, pg, 1.3), h: 3.1 } });
        beat(0.2, null, { hold: pg, dr: true });
        return { type: 'jump', team: winner, holder: pg, winner };
      }
      return { type: 'period', team: arrowTeam };
    }
    function endPeriod(n) {
      const pr = tr.periods[tr.periods.length - 1];
      const t0 = G.T;
      beat(0.8, null, null);
      const benchX = [10.5, 17.5];
      const mv = {};
      for (let s = 0; s < 10; s++) {
        const tm = s < 5 ? 0 : 1;
        mv[s] = { x: benchX[attackDir(tm) > 0 ? 0 : 1] + ((s % 5) - 2) * 0.75, y: R.range(-0.9, -0.3) };
      }
      const bp = ballPoint();
      beat(n === 4 ? 3.5 : 3.0, mv, { free: { a: bp, b: [14, 7.5, 0.12], n: 3, h: 0.6 } });
      beat(n === 2 ? 3.2 : n === 4 ? 3.0 : 2.0, null, { rest: [14, 7.5, 0.12] });
      pr.t1 = r2(G.T);
      const label = n === 4 ? '試合終了' : n === 2 ? '前半終了' : `第${n}Q 終了`;
      overlay(t0 + 0.8, G.T, n === 4 ? 'final' : 'period', label);
    }

    /* ---------- 試合を回す ---------- */
    let arrow = 0;
    let next = null;
    for (let n = 1; n <= 4; n++) {
      if (n === 1) {
        next = startPeriod(1);
        arrow = 1 - next.winner;
      } else {
        next = startPeriod(n, arrow);
        arrow = 1 - arrow;
      }
      while (G.T - G.periodStart < PERIOD_LEN) {
        const O = next.team;
        if (next.type === 'inbound') maybeTimeout(O);
        if (next.type === 'sideline' || next.type === 'period') applySubs();
        next = possession(O, next);
        // 念のため、次の攻撃の持ち主を正す
        if (next.holder != null && Math.floor(next.holder / 5) !== next.team) next.holder = slotOf(next.team, 0);
      }
      endPeriod(n);
      if (next.type !== 'inbound') { /* 次のピリオドは交互のスローイン */ }
    }

    const duration = r2(G.T);
    const periods = tr.periods.map((p) => ({ n: p.n, t0: p.t0, t1: p.t1, dir0: p.dir0 }));
    return {
      seed, duration, periodLen: PERIOD_LEN,
      teams: TEAMS.map((t) => ({
        id: t.id, name: t.name, short: t.short, color: t.color, text: t.text, trim: t.trim,
        players: t.players.map((p) => ({ id: p.id, no: String(p.no), name: p.name, pos: p.pos, starter: p.starter }))
      })),
      events, track: tr, periods, final: G.score.slice(),
    };
  }

  BS.sim = { generate, DEFAULT_SEED: 204, HOME, AWAY };
